const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

function CalendarTab({ orders, services, accessories, calendarNotes, onAddNote, onDeleteNote, onEditNote, onOpenRecord, onScheduleDelivery, onScheduleService }) {
  const [month, setMonth] = useState(() => { const d = new Date(); d.setDate(1); return d; });
  const [selected, setSelected] = useState(null);
  const [noteText, setNoteText] = useState("");
  const [editingNote, setEditingNote] = useState(null); // { id, date, text }

  const activeOrders = useMemo(() => orders.filter((o) => !o.archived), [orders]);
  const activeServices = useMemo(() => services.filter((s) => !s.archived), [services]);
  const activeAccessories = useMemo(() => accessories.filter((a) => !a.archived), [accessories]);

  const [hiddenKinds, setHiddenKinds] = useState({});
  const allEventsByDate = useMemo(() => {
    const map = {};
    // One calendar entry per order arriving, not per bike: models on the same order share an entry,
    // and a bike allocated from a stock order rides on that stock order's entry.
    const qtyOf = (r) => Number(r.qty) || 1;
    const orderById = {};
    activeOrders.forEach((o) => { orderById[o.id] = o; });
    const orderBundles = {};
    activeOrders.forEach((o) => {
      if (!o.eta) return;
      const parent = o.parentId ? orderById[o.parentId] : null;
      const host = parent && parent.eta === o.eta ? parent : o;
      const key = o.eta + "|" + (host.groupId ? "g" + host.groupId : "o" + host.id);
      const b = orderBundles[key] || (orderBundles[key] = { date: o.eta, lines: [], allocs: [] });
      (host === o ? b.lines : b.allocs).push(o);
    });
    Object.values(orderBundles).forEach((b) => {
      const first = b.lines[0] || b.allocs[0];
      const names = b.allocs.map((k) => k.customer).filter(Boolean);
      let title, detail;
      if (b.lines.length > 1) {
        const brands = Array.from(new Set(b.lines.map((l) => String(l.brand || "").trim()).filter(Boolean))).join(" + ");
        title = `${brands || "ORDER"} · ${b.lines.length} models (${b.lines.reduce((t, l) => t + qtyOf(l), 0)} bikes)`;
        detail = names.length ? "allocated: " + names.join(", ") : "";
      } else {
        title = `${first.brand} ${first.type}`.trim() + (qtyOf(first) > 1 ? ` ×${qtyOf(first)}` : "");
        detail = first.customer ? `for ${first.customer}` : names.length ? "shop stock · allocated: " + names.join(", ") : "shop stock";
      }
      (map[b.date] = map[b.date] || []).push({ kind: "order", title, detail, color: "#33506B", ref: first, items: b.lines.length > 1 ? b.lines : null });
    });
    activeServices.forEach((s) => {
      if (!s.bookedDate) return;
      (map[s.bookedDate] = map[s.bookedDate] || []).push({ kind: "service", title: `${s.customer || "SERVICE"}`, color: "#FFCC0A", ref: s });
    });
    // Parts from the same supplier due the same day (and on the same tracking) are one delivery, so one entry.
    const partBundles = {};
    activeAccessories.forEach((a) => {
      if (!a.eta) return;
      const key = a.eta + "|" + String(a.brand || "").trim().toUpperCase() + "|" + String(a.tracking || "").trim();
      (partBundles[key] || (partBundles[key] = { date: a.eta, lines: [] })).lines.push(a);
    });
    Object.values(partBundles).forEach((b) => {
      const a = b.lines[0];
      const many = b.lines.length > 1;
      (map[b.date] = map[b.date] || []).push({
        kind: "accessory", color: "#7C5CBF", ref: a, items: many ? b.lines : null,
        title: many ? `${a.brand || "Order"}: ${b.lines.length} items` : `${a.brand || "Order"}: ${a.type || "item"}`,
        detail: many ? "" : `qty ${a.qty || "—"} for ${a.customer || "—"}`,
      });
    });
    activeOrders.forEach((o) => {
      if (o.fulfillment !== "Delivery" || !o.deliveryDate) return;
      (map[o.deliveryDate] = map[o.deliveryDate] || []).push({ kind: "delivery", title: `DELIVER: ${o.customer || "CUSTOMER"}`, color: "#2E8B77", ref: o });
    });
    activeOrders.forEach((o) => {
      if (o.fulfillment !== "Pickup" || !o.receivedDate) return;
      (map[o.receivedDate] = map[o.receivedDate] || []).push({ kind: "pickup", title: `PICK UP: ${o.customer || "CUSTOMER"}`, color: "#B5651D", ref: o });
    });
    (calendarNotes || []).forEach((n) => {
      if (!n.date) return;
      (map[n.date] = map[n.date] || []).push({ kind: "note", title: n.text, color: "#C2417A", ref: n });
    });
    return map;
  }, [activeOrders, activeServices, activeAccessories, calendarNotes]);
  const eventsByDate = useMemo(() => {
    const out = {};
    Object.keys(allEventsByDate).forEach((d) => { out[d] = allEventsByDate[d].filter((ev) => !hiddenKinds[ev.kind]); });
    return out;
  }, [allEventsByDate, hiddenKinds]);
  const KIND_FILTERS = [
    { kind: "order", label: "Orders", color: "#33506B" }, { kind: "accessory", label: "Accessories", color: "#7C5CBF" },
    { kind: "service", label: "Services", color: "#FFCC0A" }, { kind: "delivery", label: "Deliveries", color: "#2E8B77" },
    { kind: "pickup", label: "Pick ups", color: "#B5651D" }, { kind: "note", label: "Notes", color: "#C2417A" },
  ];

  const cells = useMemo(() => {
    const year = month.getFullYear(), m = month.getMonth();
    const first = new Date(year, m, 1);
    const startOffset = (first.getDay() + 6) % 7; // Monday-first
    const daysInMonth = new Date(year, m + 1, 0).getDate();
    const arr = [];
    for (let i = 0; i < startOffset; i++) arr.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      arr.push(dateStr);
    }
    return arr;
  }, [month]);

  const monthLabel = month.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const todayStr = new Date().toISOString().slice(0, 10);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <IconBtn onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() - 1, 1))} title="Previous"><ChevronLeft size={15} /></IconBtn>
          <h2 className="rodi-display" style={{ fontSize: 34, fontWeight: 600, margin: 0, minWidth: 190, letterSpacing: "-0.02em" }}>{monthLabel}</h2>
          <IconBtn onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() + 1, 1))} title="Next"><ChevronRight size={15} /></IconBtn>
        </div>
        <button
          onClick={() => { const ok = downloadICS(activeOrders, activeServices, activeAccessories, calendarNotes); if (!ok) alert("Add an ETA or booking date first — nothing to export yet."); }}
          className="rodi-btn"
          style={{ background: "#fff", border: "1px solid #D8DAD1", borderRadius: 8, padding: "9px 14px", display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontWeight: 600, fontSize: 13.5 }}
        >
          <Download size={15} /> Export to calendar (.ics)
        </button>
      </div>

      <div data-testid="calendar-filters" style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
        {KIND_FILTERS.map((f) => {
          const on = !hiddenKinds[f.kind];
          return (
            <button key={f.kind} onClick={() => setHiddenKinds((h) => ({ ...h, [f.kind]: on }))} className="rodi-btn" style={{
              border: on ? `2px solid ${f.color}` : "1px solid #D8DAD1", background: on ? "#fff" : "#F3F4EF", color: on ? "#191B18" : "#8B9086",
              borderRadius: 999, padding: "5px 12px", cursor: "pointer", fontSize: 12.5, fontWeight: 600, display: "flex", alignItems: "center", gap: 6,
              textDecoration: on ? "none" : "line-through",
            }}>
              <span style={{ width: 8, height: 8, borderRadius: 999, background: on ? f.color : "#C9CBC3" }} />
              {f.label}
            </button>
          );
        })}
      </div>

      <div className="rodi-cal-grid" style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6, marginBottom: 6 }}>
        {WEEKDAYS.map((d) => (
          <div key={d} style={{ textAlign: "center", fontSize: 12, color: "#8B9086", fontWeight: 600, padding: "4px 0" }}>{d}</div>
        ))}
      </div>
      <div className="rodi-cal-grid" style={{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))", gap: 8 }}>
        {cells.map((dateStr, i) => {
          if (!dateStr) return <div key={i} />;
          const evs = eventsByDate[dateStr] || [];
          const dayNum = Number(dateStr.slice(-2));
          const isToday = dateStr === todayStr;
          return (
            <div
              key={dateStr}
              onClick={() => setSelected(dateStr)}
              className="rodi-cal-cell"
              style={{
                minHeight: 112, minWidth: 0, border: isToday ? "2px solid #FFCC0A" : "1px solid #E7E4DB",
                borderRadius: 14, background: selected === dateStr ? "#FBF5DA" : "#fff",
                padding: 9, cursor: "pointer", display: "flex", flexDirection: "column", gap: 5,
                overflowX: "hidden",
              }}
            >
              <span className="rodi-cal-num" style={{ alignSelf: "flex-start", minWidth: 26, height: 26, borderRadius: 13, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 5px", fontSize: 13, fontWeight: 700, background: isToday ? "#FFCC0A" : "transparent", color: "#16171A" }}>{dayNum}</span>
              {evs.map((ev, idx) => (
                <span key={idx} className="rodi-cal-chip" style={{
                  display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 600, background: tintOf(ev.color, "22"), color: "#16171A", borderRadius: 7,
                  padding: "4px 8px", overflow: "hidden", whiteSpace: "nowrap",
                }}><span style={{ flex: "0 0 7px", height: 7, borderRadius: 999, background: ev.color }} /><span className="rodi-cal-chiptext" style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{ev.title}</span></span>
              ))}
            </div>
          );
        })}
      </div>

      {selected && (
        <div
          data-testid="day-modal"
          onClick={() => setSelected(null)}
          style={{
            position: "fixed", inset: 0, zIndex: 40, background: "rgba(25,27,24,0.55)",
            display: "flex", alignItems: "center", justifyContent: "center", padding: 16, overflowY: "auto",
          }}
        >
        <div
          onClick={(e) => e.stopPropagation()}
          style={{
            background: "#fff", border: "none", borderRadius: 22, padding: 18,
            width: "100%", maxWidth: 560, maxHeight: "90vh", overflowY: "auto", boxSizing: "border-box",
            boxShadow: "0 12px 40px rgba(0,0,0,0.3)",
          }}
        >
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <h3 className="rodi-display" style={{ margin: 0, fontSize: 19, fontWeight: 600 }}>{formatAU(selected)}</h3>
            <IconBtn onClick={() => setSelected(null)} title="Close"><X size={14} /></IconBtn>
          </div>
          {(eventsByDate[selected] || []).length === 0 && <p style={{ color: "#8B9086", fontSize: 14 }}>Nothing scheduled this day.</p>}
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
            {(eventsByDate[selected] || []).map((ev, idx) => {
              if (ev.kind === "note" && editingNote && editingNote.id === ev.ref.id) {
                return (
                  <form
                    key={idx}
                    onSubmit={(e) => {
                      e.preventDefault();
                      if (!editingNote.text.trim()) return;
                      onEditNote(editingNote.id, editingNote.date, editingNote.text.trim());
                      setEditingNote(null);
                    }}
                    style={{ display: "flex", gap: 8, alignItems: "center", background: "#FFF8E1", padding: 8, borderRadius: 8 }}
                  >
                    <input type="date" value={editingNote.date} onChange={(e) => setEditingNote({ ...editingNote, date: e.target.value })} style={{ ...inputStyle, width: 150 }} />
                    <input value={editingNote.text} onChange={(e) => setEditingNote({ ...editingNote, text: e.target.value.toUpperCase() })} style={{ ...inputStyle, flex: 1 }} />
                    <button type="submit" className="rodi-btn" style={{ background: "#FFCC0A", color: "#191B18", border: "none", borderRadius: 8, padding: "8px 12px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}>Save</button>
                    <button type="button" onClick={() => setEditingNote(null)} style={{ background: "#fff", border: "1px solid #D8DAD1", borderRadius: 8, padding: "8px 12px", cursor: "pointer", fontSize: 13 }}>Cancel</button>
                  </form>
                );
              }
              const clickable = ev.kind === "order" || ev.kind === "service" || ev.kind === "accessory" || ev.kind === "delivery" || ev.kind === "pickup";
              const KIND = { order: ["ORDER ARRIVING", "#33506B"], service: ["SERVICE", "#C99A0A"], accessory: ["ACCESSORY ARRIVING", "#7C5CBF"], delivery: ["DELIVERY", "#2E8B77"], pickup: ["PICK UP", "#B5651D"], note: ["NOTE", "#C2417A"] };
              const [kindLabel, kindColor] = KIND[ev.kind] || ["EVENT", "#565C54"];
              const detail = ev.detail != null ? ev.detail
                : ev.kind === "service" ? ev.ref.serviceType || ""
                : ev.kind === "note" ? "click to edit"
                : ev.kind === "delivery" || ev.kind === "pickup" ? `${ev.ref.brand || ""} ${ev.ref.type || ""}`.trim()
                : `qty ${ev.ref.qty || "—"} for ${ev.ref.customer || "—"}`;
              return (
                <div
                  key={idx}
                  data-testid="day-event"
                  onClick={() => { if (clickable) onOpenRecord(ev.kind === "delivery" || ev.kind === "pickup" ? "order" : ev.kind, ev.ref); }}
                  style={{
                    display: "flex", gap: 10, alignItems: "center", fontSize: 14,
                    cursor: clickable ? "pointer" : "default",
                    padding: "9px 12px", border: "1px solid #E3E4DD", borderLeft: `6px solid ${kindColor}`,
                    borderRadius: 8, background: "#FAFAF7",
                  }}
                  className={clickable ? "rodi-row" : undefined}
                >
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 10.5, fontWeight: 800, letterSpacing: "0.06em", color: kindColor }}>{kindLabel}</div>
                    <div
                      style={{ fontWeight: 700, cursor: ev.kind === "note" ? "pointer" : undefined, wordBreak: "break-word" }}
                      onClick={(e) => { if (ev.kind === "note") { e.stopPropagation(); setEditingNote({ id: ev.ref.id, date: ev.ref.date, text: ev.ref.text }); } }}
                    >{ev.title}</div>
                    {detail && <div style={{ color: "#565C54", fontSize: 12.5 }}>{detail}</div>}
                    {ev.items && (
                      <div style={{ marginTop: 5, display: "flex", flexDirection: "column", gap: 2 }}>
                        {ev.items.map((it) => (
                          <button key={it.id} type="button" data-testid="day-event-item" onClick={(e) => { e.stopPropagation(); onOpenRecord(ev.kind, it); }}
                            style={{ textAlign: "left", background: "none", border: "none", padding: "3px 0", font: "inherit", fontSize: 12.5, color: "#3F4248", cursor: "pointer", textDecoration: "underline" }}>
                            {(it.type || "item") + ((Number(it.qty) || 1) > 1 ? " ×" + it.qty : "") + (it.customer ? " — " + it.customer : "")}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                  {ev.kind === "note" && (
                    <div style={{ marginLeft: "auto", display: "flex", gap: 4 }}>
                      <IconBtn onClick={() => setEditingNote({ id: ev.ref.id, date: ev.ref.date, text: ev.ref.text })} title="Edit note"><Pencil size={13} /></IconBtn>
                      <IconBtn onClick={() => onDeleteNote(ev.ref.id)} title="Delete note" danger><Trash2 size={13} /></IconBtn>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
            <button
              type="button"
              onClick={() => onScheduleDelivery(selected)}
              className="rodi-btn"
              style={{
                background: "#2E8B77", color: "#fff", border: "1px solid #D9D6CC", borderRadius: 8,
                padding: "8px 14px", display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontWeight: 700, fontSize: 13,
              }}
            >
              <Truck size={14} /> Schedule delivery
            </button>
            <button
              type="button"
              onClick={() => onScheduleService(selected)}
              className="rodi-btn"
              style={{
                background: "#FFCC0A", color: "#191B18", border: "none", borderRadius: 8,
                padding: "8px 14px", display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontWeight: 700, fontSize: 13,
              }}
            >
              <Wrench size={14} /> Schedule service
            </button>
          </div>

          <form
            onSubmit={(e) => {
              e.preventDefault();
              if (!noteText.trim()) return;
              onAddNote(selected, noteText.trim());
              setNoteText("");
            }}
            style={{ display: "flex", gap: 8 }}
          >
            <input
              value={noteText}
              onChange={(e) => setNoteText(e.target.value.toUpperCase())}
              placeholder="e.g. DECLAN P/UP ORDER — check assembled"
              style={{ ...inputStyle, flex: 1 }}
            />
            <button type="submit" className="rodi-btn" style={{
              background: "#FFCC0A", color: "#191B18", border: "none", borderRadius: 8,
              padding: "0 16px", cursor: "pointer", fontWeight: 700, fontSize: 13.5,
            }}>
              Add note
            </button>
          </form>
        </div>
        </div>
      )}
    </div>
  );
}

function StatCard({ icon, label, value, color }) {
  return (
    <div style={{
      background: "#fff", border: "1px solid #E7E4DB", borderRadius: 18, boxShadow: "0 1px 2px rgba(20,20,15,0.04)", padding: "18px 20px",
      display: "flex", flexDirection: "column", gap: 12, height: "100%",
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
        <span style={{ width: 9, height: 9, borderRadius: 999, background: color, flexShrink: 0 }} />
        <span style={{ fontSize: 13, fontWeight: 600, color: "#6B6E66" }}>{label}</span>
      </div>
      <div className="rodi-display" style={{ fontSize: 42, lineHeight: 1, letterSpacing: "-0.03em", fontVariantNumeric: "tabular-nums" }}>{value}</div>
    </div>
  );
}

function AttentionList({ title, icon, color, items, renderItem, emptyText }) {
  if (items.length === 0) return null;
  return (
    <div style={{ background: "#fff", border: "1px solid #E7E4DB", borderRadius: 18, boxShadow: "0 1px 2px rgba(20,20,15,0.04)", padding: 14, marginBottom: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <span style={{ color }}>{icon}</span>
        <h4 style={{ margin: 0, fontSize: 14, fontWeight: 700 }}>{title} ({items.length})</h4>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {items.map(renderItem)}
      </div>
    </div>
  );
}

function ChecklistWidget({ items, onAdd, onToggle, onDelete, onEdit }) {
  const [text, setText] = useState("");
  const [editing, setEditing] = useState(null); // { id, text }
  const saveEdit = () => { if (editing && editing.text.trim() && onEdit) onEdit(editing.id, editing.text.trim()); setEditing(null); };
  const sorted = useMemo(() => {
    const arr = [...items];
    arr.sort((a, b) => {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      return (a.createdAt || "").localeCompare(b.createdAt || "");
    });
    return arr;
  }, [items]);
  return (
    <div style={{ background: "#fff", border: "1px solid #E7E4DB", borderRadius: 18, boxShadow: "0 1px 2px rgba(20,20,15,0.04)", padding: 14 }}>
      <form
        onSubmit={(e) => {
          e.preventDefault();
          if (!text.trim()) return;
          onAdd(text.trim());
          setText("");
        }}
        style={{ display: "flex", gap: 8, marginBottom: sorted.length ? 12 : 0 }}
      >
        <input
          value={text}
          onChange={(e) => setText(e.target.value.toUpperCase())}
          placeholder="Add a to-do…"
          style={{ ...inputStyle, flex: 1 }}
        />
        <button type="submit" className="rodi-btn" style={{
          background: "#FFCC0A", color: "#191B18", border: "none", borderRadius: 8,
          padding: "0 14px", cursor: "pointer", fontWeight: 700, fontSize: 13.5,
        }}>
          <Plus size={15} />
        </button>
      </form>
      {sorted.length === 0 && <p style={{ color: "#8B9086", fontSize: 14, margin: 0 }}>Nothing on the list — add a reminder above.</p>}
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {sorted.map((item) => (
          <div key={item.id} style={{
            display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: "1px solid #EFEFEA",
          }}>
            <input
              type="checkbox"
              checked={!!item.done}
              onChange={() => onToggle(item.id)}
              style={{ width: 16, height: 16, cursor: "pointer", flexShrink: 0 }}
            />
            {editing && editing.id === item.id ? (
              <input data-testid="checklist-edit-input" autoFocus value={editing.text}
                onChange={(e) => setEditing({ id: item.id, text: e.target.value.toUpperCase() })}
                onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); saveEdit(); } if (e.key === "Escape") setEditing(null); }}
                onBlur={saveEdit}
                style={{ ...inputStyle, flex: 1, padding: "5px 8px", fontSize: 13.5 }} />
            ) : (
              <span data-testid="checklist-text" title="Click to edit" onClick={() => setEditing({ id: item.id, text: item.text })} style={{
                flex: 1, fontSize: 13.5, cursor: "text",
                color: item.done ? "#8B9086" : "#191B18",
                textDecoration: item.done ? "line-through" : "none",
              }}>
                {item.text}
              </span>
            )}
            <IconBtn onClick={() => setEditing({ id: item.id, text: item.text })} title="Edit"><Pencil size={13} /></IconBtn>
            <IconBtn onClick={() => onDelete(item.id)} title="Delete" danger><Trash2 size={13} /></IconBtn>
          </div>
        ))}
      </div>
    </div>
  );
}

function DashboardTab({ orders, services, accessories, checklistItems, onAddChecklistItem, onToggleChecklistItem, onDeleteChecklistItem, onEditChecklistItem, onExport, onExportCSV, goTo, onOpen, onServiceStep, onOrderStep, rentals, onRentalStep }) {
  const [customerQuery, setCustomerQuery] = useState("");

  const activeOrders = useMemo(() => orders.filter((o) => !o.archived), [orders]);
  const activeServices = useMemo(() => services.filter((s) => !s.archived), [services]);
  const activeAccessories = useMemo(() => accessories.filter((a) => !a.archived), [accessories]);

  const ordersThisWeek = useMemo(() => activeOrders.filter((o) => {
    const d = daysFromToday(o.eta);
    return d !== null && d >= 0 && d <= 7;
  }), [activeOrders]);
  const overdueOrders = useMemo(() => activeOrders.filter((o) => isPastDate(o.eta) && !isHere(o.status)), [activeOrders]);
  const servicesToday = useMemo(() => activeServices.filter((s) => s.bookedDate === todayISO()), [activeServices]);
  const servicesThisWeek = useMemo(() => activeServices.filter((s) => {
    const d = daysFromToday(s.bookedDate);
    return d !== null && d >= 0 && d <= 7;
  }), [activeServices]);
  const overdueServices = useMemo(() => activeServices.filter((s) =>
    isPastDate(s.bookedDate) && s.status === "Booked"
  ), [activeServices]);
  const needsAssembly = useMemo(() => activeOrders.filter((o) => isHere(o.status) && o.assemblyStatus !== "Assembled"), [activeOrders]);
  const overdueAccessories = useMemo(() => activeAccessories.filter((a) => isPastDate(a.eta) && !isHere(a.status)), [activeAccessories]);
  const deliveriesThisWeek = useMemo(() => activeOrders.filter((o) => {
    if (o.fulfillment !== "Delivery") return false;
    const d = daysFromToday(o.deliveryDate);
    return d !== null && d >= 0 && d <= 7;
  }), [activeOrders]);

  const readyForPickup = useMemo(() => [
    ...activeServices.filter((s) => s.status === "Ready for Pickup").map((s) => ({ kind: "service", rec: s })),
    ...activeOrders.filter((o) => orderQuickMatch(o, "pickup")).map((o) => ({ kind: "order", rec: o })),
  ], [activeServices, activeOrders]);


  const customerResults = useMemo(() => {
    const q = customerQuery.trim().toLowerCase();
    if (!q) return null;
    return {
      orders: activeOrders.filter((o) => (o.customer || "").toLowerCase().includes(q)),
      services: activeServices.filter((s) => (s.customer || "").toLowerCase().includes(q)),
      accessories: activeAccessories.filter((a) => (a.customer || "").toLowerCase().includes(q)),
    };
  }, [customerQuery, activeOrders, activeServices, activeAccessories]);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <div>
          <div style={{ fontSize: 13, fontWeight: 600, letterSpacing: "0.14em", color: "#8A8C82", textTransform: "uppercase" }}>{new Date().toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long" })}</div>
          <h2 className="rodi-display" style={{ fontSize: 38, margin: "6px 0 0", letterSpacing: "-0.02em" }}>What needs doing</h2>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <button onClick={onExport} className="rodi-btn" style={{
          background: "#fff", border: "1px solid #D8DAD1", borderRadius: 8, padding: "9px 14px",
          display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontWeight: 600, fontSize: 13.5,
        }}>
          <Download size={15} /> Export all data
        </button>
        <button onClick={onExportCSV} className="rodi-btn" data-testid="export-csv" style={{
          background: "#fff", border: "1px solid #D8DAD1", borderRadius: 8, padding: "9px 14px",
          display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontWeight: 600, fontSize: 13.5,
        }}>
          <Download size={15} /> Export CSV
        </button>
        </div>
      </div>

      <DoNext services={activeServices} orders={activeOrders} accessories={activeAccessories} rentals={rentals} onServiceStep={onServiceStep} onOrderStep={onOrderStep} onRentalStep={onRentalStep} onOpen={onOpen} goTo={goTo} />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 16, marginBottom: 28 }}>
        <div onClick={() => goTo("orders", "week")} style={{ cursor: "pointer" }}>
          <StatCard icon={<Package size={18} />} label="Arriving this week" value={ordersThisWeek.length} color="#33506B" />
        </div>
        <div onClick={() => goTo("orders", "overdue")} style={{ cursor: "pointer" }}>
          <StatCard icon={<AlertOctagon size={18} />} label="Overdue orders" value={overdueOrders.length} color="#C1483A" />
        </div>
        <div onClick={() => goTo("services", "today")} style={{ cursor: "pointer" }}>
          <StatCard icon={<Wrench size={18} />} label="Services today" value={servicesToday.length} color="#191B18" />
        </div>
        <div onClick={() => goTo("services", "week")} style={{ cursor: "pointer" }}>
          <StatCard icon={<CalendarDays size={18} />} label="Services this week" value={servicesThisWeek.length} color="#3A7CA5" />
        </div>
        <div onClick={() => goTo("orders", "assembly")} style={{ cursor: "pointer" }}>
          <StatCard icon={<AlertTriangle size={18} />} label="Needs assembly" value={needsAssembly.length} color="#D98B3D" />
        </div>
        <div onClick={() => goTo("orders", "deliveries")} style={{ cursor: "pointer" }}>
          <StatCard icon={<Boxes size={18} />} label="Deliveries this week" value={deliveriesThisWeek.length} color="#2E8B77" />
        </div>
      </div>

      <div className="rodi-two-col" style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 24, alignItems: "start" }}>
        <div>
          <h3 className="rodi-display" style={{ fontSize: 21, margin: "0 0 12px 0" }}>Needs attention</h3>
          <AttentionList title="Ready for pick-up" icon={<PhoneCall size={16} />} color="#7C5CBF" items={readyForPickup}

function toCSV(rows) {
  if (!rows.length) return "";
  const cols = Array.from(rows.reduce((set, r) => { Object.keys(r).forEach((k) => set.add(k)); return set; }, new Set()));
  const esc = (v) => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [cols.join(","), ...rows.map((r) => cols.map((c) => esc(r[c])).join(","))].join("\n");
}
function downloadText(name, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const fmtRentalMonth = (ym) => { const m = /^(\d{4})-(\d{2})$/.exec(ym || ""); return m ? ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][Number(m[2]) - 1] + " " + m[1] : ym; };
const fmtShortDate = (iso) => { const d = new Date(iso); if (isNaN(d.getTime())) return ""; const p = (n) => String(n).padStart(2, "0"); return `${p(d.getDate())}/${p(d.getMonth() + 1)}`; };

  const [loaded, setLoaded] = useState(false);
  const [drawer, setDrawer] = useState(null); // { type: 'order'|'service'|'pricing'|'accessory', data }
  const [confirm, setConfirm] = useState(null); // { type, id }

  const [syncError, setSyncError] = useState(null);
  const [changeLog, setChangeLog] = useState([]);
  const [toast, setToast] = useState(null);
  const [preset, setPreset] = useState(null);
  const [showName, setShowName] = useState(false);
  const [historyFor, setHistoryFor] = useState(null);
  const [customers, setCustomers] = useState([]);
  const [rentals, setRentals] = useState([]);
  const [jobCard, setJobCard] = useState(null);
  const [userName, setUserName] = useState(() => { try { return localStorage.getItem("rodi-user") || ""; } catch (e) { return ""; } });
  const userNameRef = useRef(userName);
  userNameRef.current = userName;
  const ordersRef = useRef(orders); ordersRef.current = orders;
  const servicesRef = useRef(services); servicesRef.current = services;
  const accessoriesRef = useRef(accessories); accessoriesRef.current = accessories;
  const pricingRef = useRef(pricing); pricingRef.current = pricing;
  const customersRef = useRef(customers); customersRef.current = customers;

  useEffect(() => {
    (async () => {
      try {
        let [o, s, p, a, n] = await Promise.all([
          sbList("orders"), sbList("services"), sbList("pricing"), sbList("accessories"), sbList("notes"),
        ]);
        // legacy upper-case WARRANTY value -> Warranty
        const fixW = (r) => (r.payment === "WARRANTY" ? { ...r, payment: "Warranty" } : r.paymentOwing === "WARRANTY" ? { ...r, paymentOwing: "Warranty" } : r);
        o = o.map(fixW); a = a.map(fixW);
        setOrders(o);
        setServices(s);
        setPricing(p);
        setAccessories(a);
        setCalendarNotes(n);
        setSyncError(null);
      } catch (e) {
        console.error(e);
        setSyncError("Couldn't load data from the database: " + e.message);
      } finally {
        setLoaded(true);
      }
      // Loaded separately so a shop that hasn't yet run the checklist_items
      // SQL doesn't break the rest of the app's data loading.
      try {
        setChecklistItems(await sbList("checklist_items"));
      } catch (e) {
        console.error(e);
      }
      // Saved customer details are optional too (needs the customers table).
      try {
        setCustomers(await sbList("customers"));
      } catch (e) {
        console.error(e);
      }
      // Hotel rentals (commission log) are optional too.
      try {
        setRentals(await sbList("rodi_rentals"));
      } catch (e) {
        console.error(e);
      }
      // Change history is optional too — if its table doesn't exist yet the app still works.
      try {
        setChangeLog(await sbList("change_log"));
      } catch (e) {
        console.error(e);
      }
    })();
  }, []);

  const toggleRentalPaid = useCallback(async (r) => {
    try {
      // Only the paid flag is sent, so this can never overwrite the deposit status.
      const saved = await sbPatch("rodi_rentals", r.id, { paid: !r.paid });
      setRentals((prev) => prev.map((x) => (x.id === r.id ? { ...x, ...saved } : x)));
    } catch (e) {
      setSyncError("Couldn't update the rental: " + e.message);
    }
  }, []);
  // "Deposit released" button: texts the guest once. The guest's phone number never reaches this app;
  // the server looks it up privately after checking the staff PIN.
  const [depositBusyId, setDepositBusyId] = useState(null);
  const depositReleased = useCallback(async (r) => {
    const PIN_KEY = "rodi-deposit-pin";
    const say = (text) => setToast({ id: uid(), text });
    const readPin = () => { try { return localStorage.getItem(PIN_KEY) || ""; } catch (e) { return ""; } };
    const keepPin = (v) => { try { localStorage.setItem(PIN_KEY, v); } catch (e) {} };
    const dropPin = () => { try { localStorage.removeItem(PIN_KEY); } catch (e) {} };
    setDepositBusyId(r.id);
    try {
      let pin = readPin();
      if (!pin) {
        const status = await depositCall({ action: "status" });
        if (status.ok && !status.pin_set) {
          const chosen = window.prompt("Choose a PIN for sending deposit texts (4 to 12 digits). You will need it on each new device.");
          if (chosen === null) return;
          if (!/^\d{4,12}$/.test(chosen.trim())) { say("The PIN needs to be 4 to 12 digits. Nothing was sent."); return; }
          const set = await depositCall({ action: "set_pin", pin: chosen.trim() });
          if (!set.ok) { say("Couldn't save the PIN. Nothing was sent."); return; }
          pin = chosen.trim();
          keepPin(pin);
        } else {
          const entered = window.prompt("Enter the deposit PIN");
          if (entered === null) return;
          pin = entered.trim();
        }
      }
      if (!window.confirm(`Text ${r.guestName || "this guest"} that their $100 deposit has been released? Release it in Booqable first.`)) return;

        keepPin(pin);
        setRentals((prev) => prev.map((x) => (x.id === r.id ? { ...x, depositReleasedAt: res.deposit_released_at } : x)));
        say("Text sent to " + (r.guestName || "the guest") + ".");
      } else if (res.error === "wrong_pin") { dropPin(); say("Wrong PIN. Nothing was sent."); }
      else if (res.error === "locked") { say("Too many wrong PINs. Try again in an hour."); }
      else if (res.error === "already_sent") {
        keepPin(pin);
        setRentals((prev) => prev.map((x) => (x.id === r.id ? { ...x, depositReleasedAt: res.deposit_released_at || new Date().toISOString() } : x)));
        say("This guest has already been texted.");
      }
      else if (res.error === "no_phone") { keepPin(pin); say("No phone number on file for this booking."); }
      else { say("Couldn't send the text. Nothing was sent; try again."); }
    } catch (e) {
      say("Couldn't reach the server. Nothing was sent; try again.");

      root.querySelectorAll(".rodi-scrollbar table").forEach((tb) => {
        const heads = Array.from(tb.querySelectorAll("thead th")).map((h) => h.textContent.replace(/[▲▼]/g, "").trim());

    const files = [["orders", orders], ["services", services], ["accessories", accessories], ["pricing", pricing]];
    files.forEach(([name, rows], i) => {
      setTimeout(() => downloadText(`rodi-${name}-${todayISO()}.csv`, toCSV(rows), "text/csv"), i * 400);
    });
  }, [orders, services, accessories, pricing]);

  const ctxValue = { records: { orders, services, accessories }, profiles: customers, viewCustomer: setHistoryFor, printJob: setJobCard, textJob: (job) => setFlow({ type: "text", id: job.id }) };

  return (
    <AppCtx.Provider value={ctxValue}>
    <div className="rodi-root" style={{ minHeight: "100%" }}>
      <GlobalStyle />
      <div className="rodi-shell">
      <aside className="rodi-side">
        <div className="rodi-brand">
          <div className="rodi-brand-mark" style={{ background: "#FFCC0A", overflow: "hidden" }}><img src={RODI_LOGO} alt="Rodi" style={{ width: "100%", height: "100%", display: "block" }} /></div>
          <div className="rodi-brand-text">
            <span style={{ fontFamily: "'Archivo', sans-serif", fontWeight: 700, fontSize: 20, letterSpacing: "0.04em", color: "#fff", lineHeight: 1.05 }}>RODI</span>
            <span style={{ fontSize: 10.5, letterSpacing: "0.28em", color: "#8E8F86", fontWeight: 600, lineHeight: 1.1 }}>ELECTRIC</span>
          </div>
        </div>
        <nav className="rodi-nav">
          {tabs.filter((t) => !t.hidden).map((t) => {
            const Icon = t.icon;
            const active = tab === t.id || (t.id === "orders" && tab === "accessories");
            return (
              <button key={t.id} onClick={() => navTo(t.id)} className={"rodi-btn rodi-navbtn" + (active ? " active" : "")} data-active={active ? "1" : "0"}>
                <Icon size={19} color={active ? "#FFCC0A" : "currentColor"} /> <span className="rodi-lbl" data-short={TAB_SHORT[t.id] || t.label}>{t.label}</span>
              </button>
            );
          })}
        </nav>
        <button type="button" data-testid="new-booking" className="rodi-btn rodi-newbtn" onClick={() => setDrawer({ type: "service", data: emptyService() })}><Plus size={16} /> New booking</button>
        <button onClick={() => setShowName(true)} title="Set your name" data-testid="user-chip" className="rodi-btn rodi-userchip">
          <span className="rodi-avatar">{(userName || "?").trim().charAt(0).toUpperCase() || "?"}</span>
          <span style={{ display: "flex", flexDirection: "column", lineHeight: 1.25, textAlign: "left" }}>
            <span style={{ color: "#fff", fontWeight: 600, fontSize: 13.5 }}>{userName || "Set name"}</span>
            <span style={{ fontSize: 12, color: "#8E8F86" }}>Workshop · Perth</span>
          </span>
        </button>
      </aside>
      <div className="rodi-content">
      <div className="rodi-topbar">
        <div className="rodi-mbrand" style={{ background: "#FFCC0A", overflow: "hidden" }}><img src={RODI_LOGO} alt="Rodi" style={{ width: "100%", height: "100%", display: "block" }} /></div>
        <div className="rodi-gs"><GlobalSearch orders={orders} services={services} accessories={accessories} onOpen={openRecordFromCalendar} /></div>
        <button onClick={() => setShowName(true)} title="Set your name" className="rodi-btn rodi-mchip" data-testid="user-chip-mobile">
          <span className="rodi-avatar">{(userName || "?").trim().charAt(0).toUpperCase() || "?"}</span>
        </button>
      </div>
      <div style={{ padding: "8px 44px 60px", display: "flex", justifyContent: "center" }} className="rodi-page">
      <div style={{ maxWidth: 1500, width: "100%" }}>
        {syncError && (
          <div style={{
            background: "#FBEAE8", border: "1px solid #E3B3AC", color: "#8A2E22", borderRadius: 10,
            padding: "10px 14px", marginBottom: 16, fontSize: 13.5, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12,
          }}>
            <span>{syncError}</span>
            <button onClick={() => setSyncError(null)} style={{ background: "none", border: "none", cursor: "pointer", color: "#8A2E22", fontWeight: 700, fontSize: 16, lineHeight: 1 }}>×</button>
          </div>
        )}
        {!loaded ? (
          <div style={{ padding: "80px 20px", textAlign: "center", color: "#8B9086", fontSize: 14.5 }}>
            Loading your data…
          </div>
        ) : (
          <>
            {tab === "dashboard" && (
              <DashboardTab
                orders={orders}
                services={services}
                accessories={accessories}
                checklistItems={checklistItems}
                onAddChecklistItem={addChecklistItem}
                onToggleChecklistItem={toggleChecklistItem}
                onDeleteChecklistItem={deleteChecklistItem}
                onEditChecklistItem={editChecklistItem}
                onExport={exportAllData}
                onExportCSV={exportCSV}
                goTo={goTo}
                onOpen={openRecordFromCalendar}
                onServiceStep={runServiceStep}
                onOrderStep={runOrderStep}
                rentals={rentals}
                onRentalStep={(r, act) => (act === "deposit" ? depositReleased(r) : setRentalStage(r, act))}
              />
            )}
            {(tab === "orders" || tab === "accessories") && (
              <div style={{ marginBottom: 14 }}>
                <SegTabs testid="orders-kind" value={tab} onPick={navTo} items={[
                  ["orders", "Bikes", new Set(orders.filter((o) => !o.archived && !(o.parentId && orders.some((p) => p.id === o.parentId && !p.archived))).map((o) => o.groupId || o.id)).size],
                  ["accessories", "Accessories & parts", accessories.filter((a) => !a.archived).length],
                ]} />
              </div>
            )}
            {tab === "orders" && (
              <OrdersTab
                orders={orders}
                onAdd={() => setDrawer({ type: "order", data: emptyOrder() })}
                onEdit={(o) => setDrawer({ type: "order", data: o })}
                onDelete={(id) => setConfirm({ type: "order", id })}
                onDuplicate={(o) => setDrawer({
                  type: "order",
                  data: {
                    ...emptyOrder(),
                    brand: o.brand, type: o.type, colour: o.colour, qty: o.qty,
                    fulfillment: o.fulfillment, forStock: o.forStock,
                  },
                })}
                onToggleArchive={toggleOrderArchive}
                onArchiveAllReceived={archiveAllReceivedOrders}
                onAdvanceStatus={advanceOrderStatus}
                onSetStatus={setOrderStatus}
                onStep={(o, act) => runOrderStep("orders", o, act)}
                onAllocate={(o) => setFlow({ type: "allocate", id: o.id })}
                onAddModel={addModelToOrder}
                preset={preset && preset.tab === "orders" ? preset : null}
              />
            )}
            {tab === "services" && (
              <ServicesTab
                services={services}
                onAdd={() => setDrawer({ type: "service", data: emptyService() })}
                onEdit={(s) => setDrawer({ type: "service", data: s })}
                onDelete={(id) => setConfirm({ type: "service", id })}
                onToggleArchive={toggleServiceArchive}
                onArchiveAllCompleted={archiveAllCompletedServices}
                onAdvanceStatus={advanceServiceStatus}
                onSetStatus={setServiceStatus}
                onAppendLog={appendServiceLog}
                onEditLogEntry={editServiceLogEntry}
                onToggleInvoiced={toggleServiceInvoiced}
                onStep={runServiceStep}
                onDeleteLogEntry={deleteServiceLogEntry}
                preset={preset && preset.tab === "services" ? preset : null}
              />
            )}
            {tab === "accessories" && (
              <AccessoriesTab
                accessories={accessories}
                onAdd={() => setDrawer({ type: "accessory", data: emptyAccessory() })}
                onEdit={(a) => setDrawer({ type: "accessory", data: a })}
                onDelete={(id) => setConfirm({ type: "accessory", id })}
                onDuplicate={(a) => setDrawer({
                  type: "accessory",
                  data: { ...emptyAccessory(), brand: a.brand, type: a.type, colour: a.colour, qty: a.qty, forStock: a.forStock },
                })}
                onToggleArchive={toggleAccessoryArchive}
                onArchiveAllReceived={archiveAllReceivedAccessories}
                onAdvanceStatus={advanceAccessoryStatus}
                onSetStatus={setAccessoryStatus}
                onStep={(a, act) => runOrderStep("accessories", a, act)}
              />
            )}
            {tab === "pricing" && (
              <PricingTab
                pricing={pricing}
                onAdd={() => setDrawer({ type: "pricing", data: emptyPricing() })}
                onEdit={(p) => setDrawer({ type: "pricing", data: p })}
                onDelete={(id) => setConfirm({ type: "pricing", id })}
              />
            )}
            {tab === "customers" && (
              <CustomersTab
                customers={buildCustomers(ctxValue.records, customers)}
                onOpen={(c) => setHistoryFor(c)}
                onAdd={() => setHistoryFor({ name: "", phone: "", isNew: true })}
              />
            )}
            {tab === "rentals" && <RentalsTab rentals={rentals} onTogglePaid={toggleRentalPaid} onDelete={deleteRental} onDepositReleased={depositReleased} onStage={setRentalStage} busyId={depositBusyId} />}
            {tab === "history" && <HistoryTab entries={changeLog} />}
            {tab === "calendar" && (
              <CalendarTab
                orders={orders}
                services={services}
                accessories={accessories}
                calendarNotes={calendarNotes}
                onAddNote={addCalendarNote}
                onEditNote={updateCalendarNote}
                onDeleteNote={deleteCalendarNote}
                onOpenRecord={openRecordFromCalendar}
                onScheduleDelivery={scheduleDeliveryFromCalendar}
                onScheduleService={scheduleServiceFromCalendar}
              />
            )}
          </>
        )}
      </div>
      </div>
      </div>
      </div>

      {drawer?.type === "order" && (
        <OrderForm initial={drawer.data} isNew={!orders.some((r) => r.id === drawer.data.id)} onAddModel={addModelToOrder} onSave={saveOrder} onClose={() => setDrawer(null)} onCreateService={createServiceFromOrder} />
      )}
      {drawer?.type === "delivery" && (
        <DeliveryForm initial={drawer.data} onSave={saveOrder} onClose={() => setDrawer(null)} />
      )}
      {drawer?.type === "service" && (
        <ServiceForm initial={drawer.data} isNew={!services.some((r) => r.id === drawer.data.id)} onSave={saveService} onClose={() => setDrawer(null)}
          onSaveCheckIn={async (form) => { const ok = await saveService(form); if (ok) setFlow({ type: "checkin", id: form.id }); }} />
      )}
      {drawer?.type === "pricing" && (
        <PricingForm initial={drawer.data} onSave={savePricing} onClose={() => setDrawer(null)} />
      )}
      {drawer?.type === "accessory" && (
        <AccessoryForm initial={drawer.data} onSave={saveAccessory} onClose={() => setDrawer(null)} />
      )}
      {confirm && (
        <ConfirmDialog
          text={
            confirm.type === "order" ? "Delete this order? This can't be undone."
              : confirm.type === "service" ? "Delete this service booking? This can't be undone."
              : confirm.type === "pricing" ? "Delete this price entry? This can't be undone."
              : "Delete this accessory order? This can't be undone."
          }
          onCancel={() => setConfirm(null)}
          onConfirm={async () => {
            const table = confirm.type === "order" ? "orders" : confirm.type === "service" ? "services" : confirm.type === "pricing" ? "pricing" : "accessories";
            const id = confirm.id;
            setConfirm(null);
            await deleteRecord(table, id);
          }}
        />
      )}
      <Toast toast={toast} onClose={() => setToast(null)} />
      {showName && <NameDialog current={userName} onSave={saveName} onClose={() => setShowName(false)} />}
      {historyFor && (
        <CustomerHistoryModal key={historyFor.isNew ? "new" : historyFor.name} customer={historyFor} records={ctxValue.records} profiles={customers} onSaveProfile={saveCustomer}
          onOpen={(kind, rec) => { setHistoryFor(null); openRecordFromCalendar(kind, rec); }} onClose={() => setHistoryFor(null)} />
      )}
      {jobCard && <JobCardModal job={jobCard} onClose={() => setJobCard(null)} />}
      {flowService && flow.type === "checkin" && (
        <CheckInSheet service={flowService} onClose={() => setFlow(null)} onSave={(notes) => {
          setFlow(null);
          patchRecord("services", flowService.id, { status: "In Progress", notes: logWithAdd(notes, arrivalMissing(notes).length ? "CHECKED IN. NOT RECEIVED: " + arrivalMissing(notes).join(", ") : "CHECKED IN") }, "edited", "checked in");
          stepDone("services", flowService, niceFirst(flowService.customer) + "'s bike checked in.");
        }} />
      )}
      {flowService && flow.type === "pickup" && (
        <PickupSheet service={flowService} onClose={() => setFlow(null)} onDone={(inv) => {
          setFlow(null);
          const withInv = withMeta(flowService.notes, { inv: invValue(inv, invoicedOf(flowService.notes)) });
          patchRecord("services", flowService.id, { status: "Completed", notes: logWithAdd(withInv, inv === "yes" ? "PICKED UP. INVOICED" : inv === "na" ? "PICKED UP. NO INVOICE NEEDED" : "PICKED UP. INVOICE STILL TO DO") }, "edited", "picked up");
          stepDone("services", flowService, niceFirst(flowService.customer) + "'s bike picked up.");
        }} />
      )}
      {flowService && (flow.type === "tell" || flow.type === "nudge") && (
        <ServiceTextSheet service={flowService} kind={flow.type} onClose={() => setFlow(null)} onSend={() => {
          const kind = flow.type;
          setFlow(null);
          sendServiceText(kind === "nudge" ? "pickup_reminder" : "ready", flowService);
          patchRecord("services", flowService.id, { notes: logWithAdd(flowService.notes, kind === "nudge" ? "PICKUP REMINDER TEXT SENT" : "CUSTOMER TOLD: READY TEXT SENT") }, "edited", kind === "nudge" ? "pickup reminder text sent" : "ready text sent to customer");
          setToast({ id: uid(), text: "Text sent to " + niceFirst(flowService.customer) + "." });
        }} />
      )}
      {flowService && flow.type === "text" && (
        <CustomTextSheet service={flowService} onClose={() => setFlow(null)} onSend={(message) => {
          setFlow(null);
          sendServiceText("custom", flowService, message);
          patchRecord("services", flowService.id, { notes: logWithAdd(flowService.notes, "TEXT SENT: " + message) }, "edited", "text sent to customer");
          setToast({ id: uid(), text: "Text sent to " + niceFirst(flowService.customer) + "." });
        }} />
      )}
      {flowService && flow.type === "parts" && (
        <PartsSheet service={flowService} accessories={accessories} onClose={() => setFlow(null)} onPick={(a) => {
          setFlow(null);
          patchRecord("services", flowService.id, { status: "Awaiting Parts", notes: logWithAdd(withMeta(flowService.notes, { wait: a ? a.id : "" }), a ? "WAITING ON " + partName(a).toUpperCase() : "WAITING ON PARTS") }, "edited", "awaiting parts");
          stepDone("services", flowService, niceFirst(flowService.customer) + "'s bike is awaiting parts.");
        }} />
      )}
      {flowStock && (
        <AllocateSheet order={flowStock} free={stockCount(flowStock, orders).free} onClose={() => setFlow(null)} onSave={async (f) => {
          setFlow(null);
          const child = { ...emptyOrder(), parentId: flowStock.id, status: flowStock.status, orderDate: flowStock.orderDate, brand: flowStock.brand, type: flowStock.type, colour: flowStock.colour, qty: 1, eta: flowStock.eta, tracking: flowStock.tracking, receivedDate: flowStock.receivedDate, assemblyStatus: flowStock.assemblyStatus, forStock: true, customer: f.customer.trim().toUpperCase(), phone: f.phone.trim(), payment: f.payment, fulfillment: f.fulfillment };
          const ok = await saveRecord("orders", child, "order");
          if (ok) { const left = stockCount(flowStock, [...tableCfg.orders.ref.current.filter((r) => r.id !== child.id), child]).free; setToast({ id: uid(), text: "Allocated to " + niceFirst(child.customer) + ". " + left + " of " + (Number(flowStock.qty) || 1) + " still free.", undo: () => deleteRecord("orders", child.id) }); }
        }} />
      )}
      {flowOrder && (
        <NotifySheet order={flowOrder} onClose={() => setFlow(null)} onSend={() => {
          setFlow(null);
          notifyCustomerReady(flowOrder);
          patchRecord("orders", flowOrder.id, { notified: true }, "edited", "ready text sent to customer");
          setToast({ id: uid(), text: "Text sent to " + niceFirst(flowOrder.customer) + "." });
        }} />
      )}
    </div>
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<RodiTracker />);

</script>
<script>
  (function () {
    try {
      var source = document.getElementById('app-source').textContent;
      var output = Babel.transform(source, {
        presets: [['react', { runtime: 'classic' }]]
      }).code;
      var script = document.createElement('script');
      script.textContent = output;
      document.body.appendChild(script);
    } catch (err) {
      document.getElementById('root').innerHTML =
        '<div id="boot-error">Something went wrong loading the app:\n' +
        (err && err.message ? err.message : err) + '</div>';
      console.error(err);
    }
  })();
</script>
</body>
</html>
