function camelToSnake(obj) {
  const out = {};
  Object.keys(obj).forEach((k) => {
    const snake = k.replace(/[A-Z]/g, (m) => "_" + m.toLowerCase());
    out[snake] = obj[k];
  });
  return out;
}
function snakeToCamel(obj) {
  const out = {};
  Object.keys(obj).forEach((k) => {
    const camel = k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
    out[camel] = obj[k];
  });
  return out;
}

async function sbList(table) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?select=*&order=created_at.asc", {
    headers: sbHeaders,
  });
  if (!res.ok) throw new Error("Failed to load " + table + " (" + res.status + ")");
  const rows = await res.json();
  return rows.map(snakeToCamel);
}

async function sbUpsert(table, obj) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?on_conflict=id", {
    method: "POST",
    headers: { ...sbHeaders, Prefer: "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify(camelToSnake(obj)),
  });
  if (!res.ok) throw new Error("Failed to save to " + table + " (" + res.status + ")");
  const rows = await res.json();
  return rows[0] ? snakeToCamel(rows[0]) : obj;
}

async function sbDelete(table, id) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?id=eq." + encodeURIComponent(id), {
    method: "DELETE",
    headers: sbHeaders,
  });
  if (!res.ok) throw new Error("Failed to delete from " + table + " (" + res.status + ")");
  return true;
}

async function sbBulkArchive(table, statusValue) {
  const res = await fetch(
    SUPABASE_URL + "/rest/v1/" + table + "?status=eq." + encodeURIComponent(statusValue) + "&archived=eq.false",
    {
      method: "PATCH",
      headers: { ...sbHeaders, Prefer: "return=representation" },
      body: JSON.stringify({ archived: true }),
    }
  );
  if (!res.ok) throw new Error("Bulk archive failed (" + res.status + ")");
  const rows = await res.json();
  return rows.map(snakeToCamel);
}

// Displays a stored ISO date (YYYY-MM-DD) as Australian format with weekday, e.g. "Wed 23/09/2026". Storage format is unchanged.
function formatAU(dateStr) {
  if (!dateStr) return "";
  const parts = dateStr.split("-");
  if (parts.length !== 3) return dateStr;
  const [y, m, d] = parts;
  const dateObj = new Date(Number(y), Number(m) - 1, Number(d));
  if (isNaN(dateObj.getTime())) return `${d}/${m}/${y}`;
  const weekday = dateObj.toLocaleDateString("en-AU", { weekday: "short" });
  return `${weekday} ${d}/${m}/${y}`;
}

function getCourierName(url) {
  try {
    const host = new URL(url).hostname.replace(/^www\./, "");
    for (const domain of Object.keys(COURIER_DOMAINS)) {
      if (host === domain || host.endsWith("." + domain)) return COURIER_DOMAINS[domain];
    }
    const parts = host.split(".");
    const core = parts.length >= 2 ? parts[parts.length - 2] : parts[0];
    return core.charAt(0).toUpperCase() + core.slice(1);
  } catch (e) {
    return "Track";
  }
}

// Renders a tracking value as a clickable link (showing the courier name) when it looks like a URL, otherwise plain text.
function TrackingCell({ value }) {
  if (!value) return "—";
  const isUrl = /^https?:\/\//i.test(value.trim());
  if (!isUrl) return value;
  const trimmed = value.trim();
  return (
    <a href={trimmed} target="_blank" rel="noopener noreferrer"
      style={{ color: "#3A7CA5", textDecoration: "underline" }}
      onClick={(e) => e.stopPropagation()}
    >
      {getCourierName(trimmed)} ↗
    </a>
  );
}

function escapeICS(s) {
  return String(s || "").replace(/[\\;,]/g, (m) => "\\" + m).replace(/\n/g, "\\n");
}
function buildICS(events) {
  let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//RODI Tracker//EN\n";
  events.forEach((ev) => {
    const dt = ev.date.replace(/-/g, "");
    ics += `BEGIN:VEVENT\nUID:${uid()}@rodi-tracker\nDTSTAMP:${dt}T090000Z\nDTSTART;VALUE=DATE:${dt}\nSUMMARY:${escapeICS(ev.title)}\nDESCRIPTION:${escapeICS(ev.description)}\nEND:VEVENT\n`;
  });
  ics += "END:VCALENDAR";
  return ics;
}
function downloadICS(orders, services, accessories, calendarNotes) {
  const events = [];
  orders.forEach((o) => {
    if (o.eta) {
      events.push({
        title: `${o.brand || "Order"} ${o.type || ""} arriving`.trim(),
        date: o.eta,
        description: `Customer: ${o.customer || "—"} | Tracking: ${o.tracking || "—"}`,
      });
    }
  });
  services.forEach((s) => {
    if (s.bookedDate) {
      events.push({
        title: `Service — ${s.customer || "Customer"} (${s.bike || "bike"})`,
        date: s.bookedDate,
        description: s.serviceType || "",
      });
    }
  });
  (accessories || []).forEach((a) => {
    if (a.eta) {
      events.push({
        title: `Restock arriving — ${a.brand || ""} ${a.type || "accessory"}`.trim(),
        date: a.eta,
        description: `Qty: ${a.qty || "—"} | Customer: ${a.customer || "—"} | Tracking: ${a.tracking || "—"}`,
      });
    }
  });
  (calendarNotes || []).forEach((n) => {
    if (n.date) {
      events.push({ title: n.text, date: n.date, description: "" });
    }
  });
  if (events.length === 0) return false;
  const blob = new Blob([buildICS(events)], { type: "text/calendar" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "rodi-schedule.ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return true;
}

function OrdersTab({ orders, onAdd, onEdit, onDelete, onToggleArchive, onArchiveAllReceived }) {
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("All");
  const [stockOnly, setStockOnly] = useState(false);
  const [needsAssembly, setNeedsAssembly] = useState(false);
  const [view, setView] = useState("active");

  const archivedCount = useMemo(() => orders.filter((o) => o.archived).length, [orders]);
  const eligibleToArchive = useMemo(() => orders.filter((o) => !o.archived && o.status === "Received").length, [orders]);

  const filtered = useMemo(() => {
    return orders.filter((o) => {
      const matchesView = view === "archived" ? o.archived : !o.archived;
      const matchesStatus = statusFilter === "All" || o.status === statusFilter;
      const matchesStock = !stockOnly || o.forStock;
      const matchesAssembly = !needsAssembly || (o.assemblyStatus !== "Assembled" && o.status === "Received");
      const q = search.toLowerCase();
      const matchesSearch = !q || [o.brand, o.type, o.customer, o.tracking, o.colour].join(" ").toLowerCase().includes(q);
      return matchesView && matchesStatus && matchesStock && matchesAssembly && matchesSearch;
    });
  }, [orders, search, statusFilter, stockOnly, needsAssembly, view]);

  const counts = useMemo(() => {
    const c = {};
    ORDER_STATUSES.forEach((s) => (c[s] = 0));
    orders.filter((o) => (view === "archived" ? o.archived : !o.archived)).forEach((o) => { c[o.status] = (c[o.status] || 0) + 1; });
    return c;
  }, [orders, view]);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", gap: 6, background: "#EFF0EC", padding: 4, borderRadius: 9 }}>
          <button onClick={() => setView("active")} className="rodi-btn" style={{
            border: "none", borderRadius: 6, padding: "6px 14px", cursor: "pointer", fontSize: 13, fontWeight: 600,
            background: view === "active" ? "#fff" : "transparent", color: view === "active" ? "#191B18" : "#8B9086",
          }}>Active</button>
          <button onClick={() => setView("archived")} className="rodi-btn" style={{
            border: "none", borderRadius: 6, padding: "6px 14px", cursor: "pointer", fontSize: 13, fontWeight: 600,
            background: view === "archived" ? "#fff" : "transparent", color: view === "archived" ? "#191B18" : "#8B9086",
          }}>Archived ({archivedCount})</button>
        </div>
        {view === "active" && eligibleToArchive > 0 && (
          <button onClick={onArchiveAllReceived} className="rodi-btn" style={{
            border: "1px solid #D8DAD1", background: "#fff", borderRadius: 8, padding: "7px 12px",
            display: "flex", alignItems: "center", gap: 6, cursor: "pointer", fontSize: 12.5, fontWeight: 600, color: "#565C54",
          }}>
            <Archive size={13} /> Archive {eligibleToArchive} received
          </button>
        )}
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
        {ORDER_STATUSES.map((s) => (
          <button key={s} onClick={() => setStatusFilter(statusFilter === s ? "All" : s)}
            className="rodi-btn"
            style={{
              border: statusFilter === s ? `2px solid ${ORDER_COLORS[s]}` : "1px solid #D8DAD1",
              background: "#fff", borderRadius: 999, padding: "6px 12px", cursor: "pointer",
              fontSize: 13, display: "flex", alignItems: "center", gap: 7, fontWeight: 500,
            }}>
            <span style={{ width: 8, height: 8, borderRadius: 999, background: ORDER_COLORS[s] }} />
            {s} <span style={{ color: "#8B9086" }}>{counts[s]}</span>
          </button>
        ))}
        <button onClick={() => setStockOnly((v) => !v)} className="rodi-btn"
          style={{
            border: stockOnly ? "2px solid #2E8B77" : "1px solid #D8DAD1",
            background: "#fff", borderRadius: 999, padding: "6px 12px", cursor: "pointer",
            fontSize: 13, display: "flex", alignItems: "center", gap: 7, fontWeight: 500,
          }}>
          <span style={{ width: 8, height: 8, borderRadius: 999, background: "#2E8B77" }} />
          Shop stock only
        </button>
        <button onClick={() => setNeedsAssembly((v) => !v)} className="rodi-btn"
          style={{
            border: needsAssembly ? "2px solid #D98B3D" : "1px solid #D8DAD1",
            background: "#fff", borderRadius: 999, padding: "6px 12px", cursor: "pointer",
            fontSize: 13, display: "flex", alignItems: "center", gap: 7, fontWeight: 500,
          }}>
          <span style={{ width: 8, height: 8, borderRadius: 999, background: "#D98B3D" }} />
          Needs assembly
        </button>
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: "1 1 220px" }}>
          <Search size={15} style={{ position: "absolute", left: 10, top: 11, color: "#8B9086" }} />
          <input placeholder="Search brand, model, customer, tracking…" value={search} onChange={(e) => setSearch(e.target.value)}
            style={{ ...inputStyle, width: "100%", paddingLeft: 32 }} />
        </div>
        <button onClick={onAdd} className="rodi-btn" style={{
          background: "#F6BD1B", color: "#191B18", border: "2px solid #191B18", borderRadius: 8,
          padding: "0 16px", display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontWeight: 700, fontSize: 14,
        }}>
          <Plus size={16} /> Add order
        </button>
      </div>

      <div className="rodi-scrollbar" style={{ overflowX: "auto", border: "2px solid #191B18", borderRadius: 12, background: "#fff" }}>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead>
            <tr style={{ textAlign: "left", borderBottom: "1px solid #E3E4DD", background: "#FAFAF7" }}>
              {["Status", "Brand", "Type", "Colour", "Qty", "ETA", "Tracking", "Customer", "Payment", "Fulfillment", "Received", ""].map((h) => (
                <th key={h} style={{ padding: "9px 10px", fontSize: 12.5, color: "#565C54", fontWeight: 600 }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr><td colSpan={12} style={{ padding: 28, textAlign: "center", color: "#8B9086", fontSize: 14 }}>
                {view === "archived" ? "No archived orders yet." : "No orders match — add one to get started."}
              </td></tr>
            )}
            {filtered.map((o) => (
              <tr key={o.id} className="rodi-row" onClick={() => onEdit(o)} style={{ borderBottom: "1px solid #EFEFEA", cursor: "pointer" }}>
                <td style={{ padding: "8px 10px" }}><StatusBadge label={o.status} color={ORDER_COLORS[o.status]} /></td>
                <td style={{ padding: "8px 10px", fontWeight: 600 }}>{o.brand}</td>
                <td style={{ padding: "8px 10px" }}>{o.type}</td>
                <td style={{ padding: "8px 10px" }}>{o.colour}</td>
                <td style={{ padding: "8px 10px" }}>{o.qty}</td>
                <td style={{ padding: "8px 10px" }}>{formatAU(o.eta) || "—"}</td>
                <td style={{ padding: "8px 10px", fontFamily: "monospace", fontSize: 13 }}><TrackingCell value={o.tracking} /></td>
                <td style={{ padding: "8px 10px" }}>
                  <div>{o.forStock ? <span style={{ fontStyle: "italic", color: "#8B9086" }}>Shop stock</span> : (o.customer || "—")}</div>
                  <div style={{ display: "flex", gap: 8, marginTop: 2 }}>
                    {o.forStock && <span style={{ fontSize: 10.5, color: "#2E8B77", fontWeight: 700 }}>STOCK</span>}
                    {o.notified && <span style={{ fontSize: 10.5, color: "#3A7CA5", fontWeight: 600 }}>Texted</span>}
                    {o.status === "Received" && (o.assemblyStatus === "Assembled"
                      ? <span style={{ fontSize: 10.5, color: "#4C9A6A", fontWeight: 600 }}>Assembled</span>
                      : <span style={{ fontSize: 10.5, color: "#D98B3D", fontWeight: 700 }}>For assembly</span>)}
                  </div>
                </td>
                <td style={{ padding: "8px 10px", fontSize: 13 }}>{o.payment || "—"}</td>
                <td style={{ padding: "8px 10px", fontSize: 13 }}>{o.fulfillment || "—"}</td>
                <td style={{ padding: "8px 10px", fontSize: 13 }}>{formatAU(o.receivedDate) || "—"}</td>
                <td style={{ padding: "8px 10px" }}>
                  <div style={{ display: "flex", gap: 6 }}>
                    <IconBtn onClick={(e) => { e.stopPropagation(); onEdit(o); }} title="Edit"><Pencil size={14} /></IconBtn>
                    <IconBtn onClick={(e) => { e.stopPropagation(); onToggleArchive(o.id); }} title={o.archived ? "Restore" : "Archive"}>
                      {o.archived ? <RotateCcw size={14} /> : <Archive size={14} />}
                    </IconBtn>
                    <IconBtn onClick={(e) => { e.stopPropagation(); onDelete(o.id); }} title="Delete" danger><Trash2 size={14} /></IconBtn>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function PricingTab({ pricing, onAdd, onEdit, onDelete }) {
  const [search, setSearch] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("All");

  const filtered = useMemo(() => {
    const q = search.toLowerCase();
    return pricing.filter((p) => {
      const matchesSearch = !q || [p.brand, p.model].join(" ").toLowerCase().includes(q);
      const matchesCategory = categoryFilter === "All" || (p.category || "E-Bike") === categoryFilter;
      return matchesSearch && matchesCategory;
    });
  }, [pricing, search, categoryFilter]);

  const grouped = useMemo(() => {
    const groups = {};
    PRICING_CATEGORIES.forEach((c) => { groups[c] = []; });
    filtered.forEach((p) => {
      const cat = p.category || "E-Bike";
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(p);
    });
    Object.keys(groups).forEach((cat) => {
      groups[cat].sort((a, b) => (a.brand + a.model).localeCompare(b.brand + b.model));
    });
    return groups;

  const renderTable = (rows) => (
    <div className="rodi-scrollbar" style={{ overflowX: "auto", border: "2px solid #191B18", borderRadius: 12, background: "#fff" }}>

              : "—";
            const grossProfit = p.cost !== "" && p.rrp !== "" ? money(Number(p.rrp) - Number(p.cost)) : "—";
            return (
              <tr key={p.id} className="rodi-row" onClick={() => onEdit(p)} style={{ borderBottom: "1px solid #EFEFEA", cursor: "pointer" }}>

                <td style={{ padding: "8px 10px" }}>{p.model}</td>

        }}>All</button>
        {PRICING_CATEGORIES.map((c) => (
          <button key={c} onClick={() => setCategoryFilter(c)} className="rodi-btn" style={{
            border: categoryFilter === c ? "2px solid #191B18" : "1px solid #D8DAD1",

        </div>
        <button onClick={onAdd} className="rodi-btn" style={{
          background: "#F6BD1B", color: "#191B18", border: "2px solid #191B18", borderRadius: 8,

const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

function CalendarTab({ orders, services, accessories, calendarNotes, onAddNote, onDeleteNote, onEditNote }) {
  const [month, setMonth] = useState(() => { const d = new Date(); d.setDate(1); return d; });
  const [selected, setSelected] = useState(null);
  const [noteText, setNoteText] = useState("");
  const [editingNote, setEditingNote] = useState(null); // { id, date, text }

  const activeOrders = useMemo(() => orders.filter((o) => !o.archived), [orders]);
  const activeServices = useMemo(() => services.filter((s) => !s.archived), [services]);
  const activeAccessories = useMemo(() => accessories.filter((a) => !a.archived), [accessories]);

  const eventsByDate = useMemo(() => {
    const map = {};
    activeOrders.forEach((o) => {
      if (!o.eta) return;
      (map[o.eta] = map[o.eta] || []).push({ kind: "order", title: `${o.brand} ${o.type}`.trim(), color: "#33506B", ref: o });
    });
    activeServices.forEach((s) => {
      if (!s.bookedDate) return;
      (map[s.bookedDate] = map[s.bookedDate] || []).push({ kind: "service", title: `${s.customer || "Service"}`, color: "#F6BD1B", ref: s });
    });
    activeAccessories.forEach((a) => {
      if (!a.eta) return;
      (map[a.eta] = map[a.eta] || []).push({ kind: "accessory", title: `${a.brand || "Order"}: ${a.type || "item"}`, color: "#7C5CBF", ref: a });
    });
    (calendarNotes || []).forEach((n) => {
      if (!n.date) return;
      (map[n.date] = map[n.date] || []).push({ kind: "note", title: n.text, color: "#191B18", ref: n });
    });
    return map;
  }, [activeOrders, activeServices, activeAccessories, calendarNotes]);

  const cells = useMemo(() => {
    const year = month.getFullYear(), m = month.getMonth();
    const first = new Date(year, m, 1);
    const startOffset = (first.getDay() + 6) % 7; // Monday-first
    const daysInMonth = new Date(year, m + 1, 0).getDate();
    const arr = [];
    for (let i = 0; i < startOffset; i++) arr.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      arr.push(dateStr);
    }
    return arr;
  }, [month]);

  const monthLabel = month.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const todayStr = new Date().toISOString().slice(0, 10);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <IconBtn onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() - 1, 1))} title="Previous"><ChevronLeft size={15} /></IconBtn>
          <h2 className="rodi-display" style={{ fontSize: 24, fontWeight: 600, margin: 0, minWidth: 190 }}>{monthLabel}</h2>
          <IconBtn onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() + 1, 1))} title="Next"><ChevronRight size={15} /></IconBtn>
        </div>
        <button
          onClick={() => { const ok = downloadICS(activeOrders, activeServices, activeAccessories, calendarNotes); if (!ok) alert("Add an ETA or booking date first — nothing to export yet."); }}
          className="rodi-btn"
          style={{ background: "#fff", border: "1px solid #D8DAD1", borderRadius: 8, padding: "9px 14px", display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontWeight: 600, fontSize: 13.5 }}
        >
          <Download size={15} /> Export to calendar (.ics)
        </button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6, marginBottom: 6 }}>
        {WEEKDAYS.map((d) => (
          <div key={d} style={{ textAlign: "center", fontSize: 12, color: "#8B9086", fontWeight: 600, padding: "4px 0" }}>{d}</div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6 }}>
        {cells.map((dateStr, i) => {
          if (!dateStr) return <div key={i} />;
          const evs = eventsByDate[dateStr] || [];
          const dayNum = Number(dateStr.slice(-2));
          const isToday = dateStr === todayStr;
          return (
            <div
              key={dateStr}
              onClick={() => setSelected(dateStr)}
              className="rodi-cal-cell"
              style={{
                minHeight: 84, border: isToday ? "2px solid #F6BD1B" : "1px solid #E3E4DD",
                borderRadius: 10, background: selected === dateStr ? "#EFF3EE" : "#fff",
                padding: 7, cursor: "pointer", display: "flex", flexDirection: "column", gap: 4,
              }}
            >
              <span style={{ fontSize: 12.5, fontWeight: isToday ? 700 : 500, color: isToday ? "#33506B" : "#565C54" }}>{dayNum}</span>
              {evs.slice(0, 2).map((ev, idx) => (
                <span key={idx} style={{
                  fontSize: 10.5, background: ev.color, color: "#fff", borderRadius: 5,
                  padding: "2px 5px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                }}>{ev.title}</span>
              ))}
              {evs.length > 2 && <span style={{ fontSize: 10, color: "#8B9086" }}>+{evs.length - 2} more</span>}
            </div>
          );
        })}
      </div>

      {selected && (
        <div style={{ marginTop: 18, background: "#fff", border: "2px solid #191B18", borderRadius: 12, padding: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <h3 className="rodi-display" style={{ margin: 0, fontSize: 19, fontWeight: 600 }}>{formatAU(selected)}</h3>
            <IconBtn onClick={() => setSelected(null)} title="Close"><X size={14} /></IconBtn>
          </div>
          {(eventsByDate[selected] || []).length === 0 && <p style={{ color: "#8B9086", fontSize: 14 }}>Nothing scheduled this day.</p>}
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
            {(eventsByDate[selected] || []).map((ev, idx) => {
              if (ev.kind === "note" && editingNote && editingNote.id === ev.ref.id) {
                return (
                  <form
                    key={idx}
                    onSubmit={(e) => {
                      e.preventDefault();
                      if (!editingNote.text.trim()) return;
                      onEditNote(editingNote.id, editingNote.date, editingNote.text.trim());
                      setEditingNote(null);
                    }}
                    style={{ display: "flex", gap: 8, alignItems: "center", background: "#FFF8E1", padding: 8, borderRadius: 8 }}
                  >
                    <input type="date" value={editingNote.date} onChange={(e) => setEditingNote({ ...editingNote, date: e.target.value })} style={{ ...inputStyle, width: 150 }} />
                    <input value={editingNote.text} onChange={(e) => setEditingNote({ ...editingNote, text: e.target.value })} style={{ ...inputStyle, flex: 1 }} />
                    <button type="submit" className="rodi-btn" style={{ background: "#F6BD1B", color: "#191B18", border: "2px solid #191B18", borderRadius: 8, padding: "8px 12px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}>Save</button>
                    <button type="button" onClick={() => setEditingNote(null)} style={{ background: "#fff", border: "1px solid #D8DAD1", borderRadius: 8, padding: "8px 12px", cursor: "pointer", fontSize: 13 }}>Cancel</button>
                  </form>
                );
              }
              return (
                <div key={idx} style={{ display: "flex", gap: 10, alignItems: "center", fontSize: 14 }}>
                  {ev.kind === "order" ? <Package size={15} color="#33506B" />
                    : ev.kind === "service" ? <Wrench size={15} color="#F6BD1B" />
                    : ev.kind === "note" ? <Tag size={15} color="#191B18" />
                    : <Boxes size={15} color="#7C5CBF" />}
                  <span
                    style={{ fontWeight: 600, cursor: ev.kind === "note" ? "pointer" : "default" }}
                    onClick={() => { if (ev.kind === "note") setEditingNote({ id: ev.ref.id, date: ev.ref.date, text: ev.ref.text }); }}
                  >
                    {ev.title}
                  </span>
                  <span style={{ color: "#8B9086", fontSize: 12.5 }}>
                    {ev.kind === "order" ? `for ${ev.ref.customer || "—"}`
                      : ev.kind === "service" ? ev.ref.serviceType || ""
                      : ev.kind === "note" ? "note — click to edit"
                      : `qty ${ev.ref.qty || "—"} for ${ev.ref.customer || "—"}`}
                  </span>
                  {ev.kind === "note" && (
                    <div style={{ marginLeft: "auto", display: "flex", gap: 4 }}>
                      <IconBtn onClick={() => setEditingNote({ id: ev.ref.id, date: ev.ref.date, text: ev.ref.text })} title="Edit note"><Pencil size={13} /></IconBtn>
                      <IconBtn onClick={() => onDeleteNote(ev.ref.id)} title="Delete note" danger><Trash2 size={13} /></IconBtn>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          <form
            onSubmit={(e) => {
              e.preventDefault();
              if (!noteText.trim()) return;
              onAddNote(selected, noteText.trim());
              setNoteText("");
            }}
            style={{ display: "flex", gap: 8 }}
          >
            <input
              value={noteText}
              onChange={(e) => setNoteText(e.target.value)}
              placeholder="e.g. DECLAN P/UP ORDER — check assembled"
              style={{ ...inputStyle, flex: 1 }}
            />
            <button type="submit" className="rodi-btn" style={{
              background: "#F6BD1B", color: "#191B18", border: "2px solid #191B18", borderRadius: 8,
              padding: "0 16px", cursor: "pointer", fontWeight: 700, fontSize: 13.5,
            }}>
              Add note
            </button>
          </form>
        </div>
      )}
    </div>
  );
}

function RodiTracker() {
  const [tab, setTab] = useState("orders");
  const [orders, setOrders] = useState([]);
  const [services, setServices] = useState([]);
  const [pricing, setPricing] = useState([]);
  const [accessories, setAccessories] = useState([]);
  const [calendarNotes, setCalendarNotes] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [drawer, setDrawer] = useState(null); // { type: 'order'|'service'|'pricing'|'accessory', data }
  const [confirm, setConfirm] = useState(null); // { type, id }

  const [syncError, setSyncError] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const [o, s, p, a, n] = await Promise.all([
          sbList("orders"), sbList("services"), sbList("pricing"), sbList("accessories"), sbList("notes"),
        ]);
        setOrders(o);
        setServices(s);
        setPricing(p);
        setAccessories(a);
        setCalendarNotes(n);
        setSyncError(null);
      } catch (e) {
        console.error(e);
        setSyncError("Couldn't load data from the database: " + e.message);
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  const addCalendarNote = useCallback(async (date, text) => {
    const note = { id: uid(), date, text };
    try {
      const saved = await sbUpsert("notes", note);
      setCalendarNotes((prev) => [...prev, saved]);
    } catch (e) {
      setSyncError("Couldn't save the note: " + e.message);
    }
  }, []);
  const updateCalendarNote = useCallback(async (id, date, text) => {
    try {
      const saved = await sbUpsert("notes", { id, date, text });
      setCalendarNotes((prev) => prev.map((n) => (n.id === id ? saved : n)));
    } catch (e) {
      setSyncError("Couldn't update the note: " + e.message);
    }
  }, []);
  const deleteCalendarNote = useCallback(async (id) => {
    try {
      await sbDelete("notes", id);
      setCalendarNotes((prev) => prev.filter((n) => n.id !== id));
    } catch (e) {
      setSyncError("Couldn't delete the note: " + e.message);
    }
  }, []);

  const saveOrder = useCallback(async (form) => {
    try {
      const saved = await sbUpsert("orders", form);
      setOrders((prev) => {
        const exists = prev.some((o) => o.id === saved.id);
        return exists ? prev.map((o) => (o.id === saved.id ? saved : o)) : [...prev, saved];
      });
      setDrawer(null);
    } catch (e) {
      setSyncError("Couldn't save the order: " + e.message);
    }
  }, []);
  const saveService = useCallback(async (form) => {
    try {
      const saved = await sbUpsert("services", form);
      setServices((prev) => {
        const exists = prev.some((s) => s.id === saved.id);
        return exists ? prev.map((s) => (s.id === saved.id ? saved : s)) : [...prev, saved];
      });
      setDrawer(null);
    } catch (e) {
      setSyncError("Couldn't save the booking: " + e.message);
    }
  }, []);
  const savePricing = useCallback(async (form) => {
    try {
      const saved = await sbUpsert("pricing", form);
      setPricing((prev) => {
        const exists = prev.some((p) => p.id === saved.id);
        return exists ? prev.map((p) => (p.id === saved.id ? saved : p)) : [...prev, saved];
      });
      setDrawer(null);
    } catch (e) {
      setSyncError("Couldn't save the price: " + e.message);
    }
  }, []);
  const saveAccessory = useCallback(async (form) => {
    try {
      const saved = await sbUpsert("accessories", form);
      setAccessories((prev) => {
        const exists = prev.some((a) => a.id === saved.id);
        return exists ? prev.map((a) => (a.id === saved.id ? saved : a)) : [...prev, saved];
      });
      setDrawer(null);
    } catch (e) {
      setSyncError("Couldn't save the accessory order: " + e.message);
    }
  }, []);

  const toggleOrderArchive = useCallback((id) => {
    setOrders((prev) => {
      const target = prev.find((o) => o.id === id);
      if (!target) return prev;
      const updated = { ...target, archived: !target.archived };
      sbUpsert("orders", updated).catch((e) => setSyncError("Couldn't update archive status: " + e.message));
      return prev.map((o) => (o.id === id ? updated : o));
    });
  }, []);
  const toggleServiceArchive = useCallback((id) => {
    setServices((prev) => {
      const target = prev.find((s) => s.id === id);
      if (!target) return prev;
      const updated = { ...target, archived: !target.archived };
      sbUpsert("services", updated).catch((e) => setSyncError("Couldn't update archive status: " + e.message));
      return prev.map((s) => (s.id === id ? updated : s));
    });
  }, []);
  const toggleAccessoryArchive = useCallback((id) => {
    setAccessories((prev) => {
      const target = prev.find((a) => a.id === id);
      if (!target) return prev;
      const updated = { ...target, archived: !target.archived };
      sbUpsert("accessories", updated).catch((e) => setSyncError("Couldn't update archive status: " + e.message));
      return prev.map((a) => (a.id === id ? updated : a));
    });
  }, []);
  const archiveAllReceivedOrders = useCallback(async () => {
    try {
      const updated = await sbBulkArchive("orders", "Received");
      const ids = new Set(updated.map((r) => r.id));
      setOrders((prev) => prev.map((o) => (ids.has(o.id) ? { ...o, archived: true } : o)));
    } catch (e) {
      setSyncError("Couldn't archive received orders: " + e.message);
    }
  }, []);
  const archiveAllCompletedServices = useCallback(async () => {
    try {
      const updated = await sbBulkArchive("services", "Completed");
      const ids = new Set(updated.map((r) => r.id));
      setServices((prev) => prev.map((s) => (ids.has(s.id) ? { ...s, archived: true } : s)));
    } catch (e) {
      setSyncError("Couldn't archive completed services: " + e.message);
    }
  }, []);
  const archiveAllReceivedAccessories = useCallback(async () => {
    try {
      const updated = await sbBulkArchive("accessories", "Received");
      const ids = new Set(updated.map((r) => r.id));
      setAccessories((prev) => prev.map((a) => (ids.has(a.id) ? { ...a, archived: true } : a)));
    } catch (e) {
      setSyncError("Couldn't archive received accessories: " + e.message);
    }
  }, []);

  const tabs = [
    { id: "orders", label: "Inventory & orders", icon: Package },
    { id: "accessories", label: "Accessories & parts", icon: Boxes },
    { id: "services", label: "Services", icon: Wrench },
    { id: "calendar", label: "Calendar", icon: CalendarDays },
    { id: "pricing", label: "Stock pricing", icon: Tag },
  ];

  return (
    <div className="rodi-root" style={{ minHeight: "100%" }}>
      <GlobalStyle />
      <div style={{
        background: "#191B18", padding: "22px 20px", borderBottom: "4px solid #F6BD1B",
        display: "flex", justifyContent: "center",
      }}>
        <div style={{ maxWidth: 1600, width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 14 }}>
          <div>
            <h1 className="rodi-display" style={{
              margin: 0, fontSize: 34, lineHeight: 0.95, color: "#F6BD1B",
              letterSpacing: "0.005em", WebkitTextStroke: "1px #0B0C0A", paintOrder: "stroke fill",
            }}>RODI ELECTRIC</h1>
            <span style={{ fontSize: 12.5, color: "#C9CBC3" }}>Inventory, orders & servicing</span>
          </div>
          <nav style={{ display: "flex", gap: 6, background: "#2A2D28", padding: 5, borderRadius: 11, border: "2px solid #F6BD1B" }}>
            {tabs.map((t) => {
              const Icon = t.icon;
              const active = tab === t.id;
              return (
                <button key={t.id} onClick={() => setTab(t.id)} className="rodi-btn"
                  style={{
                    display: "flex", alignItems: "center", gap: 7, padding: "8px 14px", borderRadius: 8,
                    border: "none", cursor: "pointer", fontSize: 13.5, fontWeight: 700,
                    background: active ? "#F6BD1B" : "transparent", color: active ? "#191B18" : "#C9CBC3",
                  }}>
                  <Icon size={15} /> {t.label}
                </button>
              );
            })}
          </nav>
        </div>
      </div>
      <div style={{ padding: "20px 20px 60px", display: "flex", justifyContent: "center" }}>
      <div style={{ maxWidth: 1600, width: "100%" }}>
        {syncError && (
          <div style={{
            background: "#FBEAE8", border: "1px solid #E3B3AC", color: "#8A2E22", borderRadius: 10,
            padding: "10px 14px", marginBottom: 16, fontSize: 13.5, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12,
          }}>
            <span>{syncError}</span>
            <button onClick={() => setSyncError(null)} style={{ background: "none", border: "none", cursor: "pointer", color: "#8A2E22", fontWeight: 700, fontSize: 16, lineHeight: 1 }}>×</button>
          </div>
        )}
        {!loaded ? (
          <div style={{ padding: "80px 20px", textAlign: "center", color: "#8B9086", fontSize: 14.5 }}>
            Loading your data…
          </div>
        ) : (
          <>
            {tab === "orders" && (
              <OrdersTab
                orders={orders}
                onAdd={() => setDrawer({ type: "order", data: emptyOrder() })}
                onEdit={(o) => setDrawer({ type: "order", data: o })}
                onDelete={(id) => setConfirm({ type: "order", id })}
                onToggleArchive={toggleOrderArchive}
                onArchiveAllReceived={archiveAllReceivedOrders}
              />
            )}
            {tab === "services" && (
              <ServicesTab
                services={services}
                onAdd={() => setDrawer({ type: "service", data: emptyService() })}
                onEdit={(s) => setDrawer({ type: "service", data: s })}
                onDelete={(id) => setConfirm({ type: "service", id })}
                onToggleArchive={toggleServiceArchive}
                onArchiveAllCompleted={archiveAllCompletedServices}
              />
            )}
            {tab === "accessories" && (
              <AccessoriesTab
                accessories={accessories}
                onAdd={() => setDrawer({ type: "accessory", data: emptyAccessory() })}
                onEdit={(a) => setDrawer({ type: "accessory", data: a })}
                onDelete={(id) => setConfirm({ type: "accessory", id })}
                onToggleArchive={toggleAccessoryArchive}
                onArchiveAllReceived={archiveAllReceivedAccessories}
              />
            )}
            {tab === "pricing" && (
              <PricingTab
                pricing={pricing}
                onAdd={() => setDrawer({ type: "pricing", data: emptyPricing() })}
                onEdit={(p) => setDrawer({ type: "pricing", data: p })}
                onDelete={(id) => setConfirm({ type: "pricing", id })}
              />
            )}
            {tab === "calendar" && (
              <CalendarTab
                orders={orders}
                services={services}
                accessories={accessories}
                calendarNotes={calendarNotes}
                onAddNote={addCalendarNote}
                onEditNote={updateCalendarNote}
                onDeleteNote={deleteCalendarNote}
              />
            )}
          </>
        )}
      </div>
      </div>

      {drawer?.type === "order" && (
        <OrderForm initial={drawer.data} onSave={saveOrder} onClose={() => setDrawer(null)} />
      )}
      {drawer?.type === "service" && (
        <ServiceForm initial={drawer.data} onSave={saveService} onClose={() => setDrawer(null)} />
      )}
      {drawer?.type === "pricing" && (
        <PricingForm initial={drawer.data} onSave={savePricing} onClose={() => setDrawer(null)} />
      )}
      {drawer?.type === "accessory" && (
        <AccessoryForm initial={drawer.data} onSave={saveAccessory} onClose={() => setDrawer(null)} />
      )}
      {confirm && (
        <ConfirmDialog
          text={
            confirm.type === "order" ? "Delete this order? This can't be undone."
              : confirm.type === "service" ? "Delete this service booking? This can't be undone."
              : confirm.type === "pricing" ? "Delete this price entry? This can't be undone."
              : "Delete this accessory order? This can't be undone."
          }
          onCancel={() => setConfirm(null)}
          onConfirm={async () => {
            const table = confirm.type === "order" ? "orders" : confirm.type === "service" ? "services" : confirm.type === "pricing" ? "pricing" : "accessories";
            try {
              await sbDelete(table, confirm.id);
              if (confirm.type === "order") setOrders((prev) => prev.filter((o) => o.id !== confirm.id));
              else if (confirm.type === "service") setServices((prev) => prev.filter((s) => s.id !== confirm.id));
              else if (confirm.type === "pricing") setPricing((prev) => prev.filter((p) => p.id !== confirm.id));
              else setAccessories((prev) => prev.filter((a) => a.id !== confirm.id));
            } catch (e) {
              setSyncError("Couldn't delete: " + e.message);
            }
            setConfirm(null);
          }}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<RodiTracker />);

</script>
<script>
  (function () {
    try {
      var source = document.getElementById('app-source').textContent;
      var output = Babel.transform(source, {
        presets: [['react', { runtime: 'classic' }]]
      }).code;
      var script = document.createElement('script');
      script.textContent = output;
      document.body.appendChild(script);
    } catch (err) {
      document.getElementById('root').innerHTML =
        '<div id="boot-error">Something went wrong loading the app:\n' +
        (err && err.message ? err.message : err) + '</div>';
      console.error(err);
    }
  })();
</script>
</body>
</html>
