}

function AttentionList({ title, icon, color, items, renderItem, emptyText }) {
  if (items.length === 0) return null;
  return (
    <div style={{ background: "#fff", border: "1px solid #E7E4DB", borderRadius: 18, boxShadow: "0 1px 2px rgba(20,20,15,0.04)", padding: 14, marginBottom: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <span style={{ color }}>{icon}</span>
        <h4 style={{ margin: 0, fontSize: 14, fontWeight: 700 }}>{title} ({items.length})</h4>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {items.map(renderItem)}
      </div>
    </div>
  );
}

function ChecklistWidget({ items, onAdd, onToggle, onDelete, onEdit }) {
  const [text, setText] = useState("");
  const [editing, setEditing] = useState(null); // { id, text }
  const saveEdit = () => { if (editing && editing.text.trim() && onEdit) onEdit(editing.id, editing.text.trim()); setEditing(null); };
  const sorted = useMemo(() => {
    const arr = [...items];
    arr.sort((a, b) => {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      return (a.createdAt || "").localeCompare(b.createdAt || "");
    });
    return arr;
  }, [items]);
  return (
    <div style={{ background: "#fff", border: "1px solid #E7E4DB", borderRadius: 18, boxShadow: "0 1px 2px rgba(20,20,15,0.04)", padding: 14 }}>
      <form
        onSubmit={(e) => {
          e.preventDefault();
          if (!text.trim()) return;
          onAdd(text.trim());
          setText("");
        }}
        style={{ display: "flex", gap: 8, marginBottom: sorted.length ? 12 : 0 }}
      >
        <input
          value={text}
          onChange={(e) => setText(e.target.value.toUpperCase())}
          placeholder="Add a to-do…"
          style={{ ...inputStyle, flex: 1 }}
        />
        <button type="submit" className="rodi-btn" style={{
          background: "#F6BD1B", color: "#191B18", border: "none", borderRadius: 8,
          padding: "0 14px", cursor: "pointer", fontWeight: 700, fontSize: 13.5,
        }}>
          <Plus size={15} />
        </button>
      </form>
      {sorted.length === 0 && <p style={{ color: "#8B9086", fontSize: 14, margin: 0 }}>Nothing on the list — add a reminder above.</p>}
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {sorted.map((item) => (
          <div key={item.id} style={{
            display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: "1px solid #EFEFEA",
          }}>
            <input
              type="checkbox"
              checked={!!item.done}
              onChange={() => onToggle(item.id)}
              style={{ width: 16, height: 16, cursor: "pointer", flexShrink: 0 }}
            />
            {editing && editing.id === item.id ? (
              <input data-testid="checklist-edit-input" autoFocus value={editing.text}
                onChange={(e) => setEditing({ id: item.id, text: e.target.value.toUpperCase() })}
                onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); saveEdit(); } if (e.key === "Escape") setEditing(null); }}
                onBlur={saveEdit}
                style={{ ...inputStyle, flex: 1, padding: "5px 8px", fontSize: 13.5 }} />
            ) : (
              <span data-testid="checklist-text" title="Click to edit" onClick={() => setEditing({ id: item.id, text: item.text })} style={{
                flex: 1, fontSize: 13.5, cursor: "text",
                color: item.done ? "#8B9086" : "#191B18",
                textDecoration: item.done ? "line-through" : "none",
              }}>
                {item.text}
              </span>
            )}
            <IconBtn onClick={() => setEditing({ id: item.id, text: item.text })} title="Edit"><Pencil size={13} /></IconBtn>
            <IconBtn onClick={() => onDelete(item.id)} title="Delete" danger><Trash2 size={13} /></IconBtn>
          </div>
        ))}
      </div>
    </div>
  );
}

function DashboardTab({ orders, services, accessories, checklistItems, onAddChecklistItem, onToggleChecklistItem, onDeleteChecklistItem, onEditChecklistItem, onExport, onExportCSV, goTo, onOpen }) {
  const [customerQuery, setCustomerQuery] = useState("");

  const activeOrders = useMemo(() => orders.filter((o) => !o.archived), [orders]);
  const activeServices = useMemo(() => services.filter((s) => !s.archived), [services]);
  const activeAccessories = useMemo(() => accessories.filter((a) => !a.archived), [accessories]);

  const ordersThisWeek = useMemo(() => activeOrders.filter((o) => {
    const d = daysFromToday(o.eta);
    return d !== null && d >= 0 && d <= 7;
  }), [activeOrders]);
  const overdueOrders = useMemo(() => activeOrders.filter((o) => isPastDate(o.eta) && o.status !== "Received"), [activeOrders]);
  const servicesToday = useMemo(() => activeServices.filter((s) => s.bookedDate === todayISO()), [activeServices]);
  const servicesThisWeek = useMemo(() => activeServices.filter((s) => {
    const d = daysFromToday(s.bookedDate);
    return d !== null && d >= 0 && d <= 7;
  }), [activeServices]);
  const overdueServices = useMemo(() => activeServices.filter((s) =>
    isPastDate(s.bookedDate) && s.status === "Booked"
  ), [activeServices]);
  const needsAssembly = useMemo(() => activeOrders.filter((o) => o.status === "Received" && o.assemblyStatus !== "Assembled"), [activeOrders]);
  const overdueAccessories = useMemo(() => activeAccessories.filter((a) => isPastDate(a.eta) && a.status !== "Received"), [activeAccessories]);
  const deliveriesThisWeek = useMemo(() => activeOrders.filter((o) => {
    if (o.fulfillment !== "Delivery") return false;
    const d = daysFromToday(o.deliveryDate);
    return d !== null && d >= 0 && d <= 7;
  }), [activeOrders]);

  const readyForPickup = useMemo(() => [
    ...activeServices.filter((s) => s.status === "Ready for Pickup").map((s) => ({ kind: "service", rec: s })),
    ...activeOrders.filter((o) => orderQuickMatch(o, "pickup")).map((o) => ({ kind: "order", rec: o })),
  ], [activeServices, activeOrders]);

  const chasing = useMemo(() => staleItems(orders, services, accessories), [orders, services, accessories]);

  const customerResults = useMemo(() => {
    const q = customerQuery.trim().toLowerCase();
    if (!q) return null;
    return {
      orders: activeOrders.filter((o) => (o.customer || "").toLowerCase().includes(q)),
      services: activeServices.filter((s) => (s.customer || "").toLowerCase().includes(q)),
      accessories: activeAccessories.filter((a) => (a.customer || "").toLowerCase().includes(q)),
    };
  }, [customerQuery, activeOrders, activeServices, activeAccessories]);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <div>
          <div style={{ fontSize: 13, fontWeight: 600, letterSpacing: "0.14em", color: "#8A8C82", textTransform: "uppercase" }}>{new Date().toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long" })}</div>
          <h2 className="rodi-display" style={{ fontSize: 38, margin: "6px 0 0", letterSpacing: "-0.02em" }}>Today at a glance</h2>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <button onClick={onExport} className="rodi-btn" style={{
          background: "#fff", border: "1px solid #D8DAD1", borderRadius: 8, padding: "9px 14px",
          display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontWeight: 600, fontSize: 13.5,
        }}>
          <Download size={15} /> Export all data
        </button>
        <button onClick={onExportCSV} className="rodi-btn" data-testid="export-csv" style={{
          background: "#fff", border: "1px solid #D8DAD1", borderRadius: 8, padding: "9px 14px",
          display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontWeight: 600, fontSize: 13.5,
        }}>
          <Download size={15} /> Export CSV
        </button>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 16, marginBottom: 28 }}>
        <div onClick={() => goTo("orders", "week")} style={{ cursor: "pointer" }}>
          <StatCard icon={<Package size={18} />} label="Arriving this week" value={ordersThisWeek.length} color="#33506B" />
        </div>
        <div onClick={() => goTo("orders", "overdue")} style={{ cursor: "pointer" }}>
          <StatCard icon={<AlertOctagon size={18} />} label="Overdue orders" value={overdueOrders.length} color="#C1483A" />
        </div>
        <div onClick={() => goTo("services", "today")} style={{ cursor: "pointer" }}>
          <StatCard icon={<Wrench size={18} />} label="Services today" value={servicesToday.length} color="#191B18" />
        </div>
        <div onClick={() => goTo("services", "week")} style={{ cursor: "pointer" }}>
          <StatCard icon={<CalendarDays size={18} />} label="Services this week" value={servicesThisWeek.length} color="#3A7CA5" />
        </div>
        <div onClick={() => goTo("orders", "assembly")} style={{ cursor: "pointer" }}>
          <StatCard icon={<AlertTriangle size={18} />} label="Needs assembly" value={needsAssembly.length} color="#D98B3D" />
        </div>
        <div onClick={() => goTo("orders", "deliveries")} style={{ cursor: "pointer" }}>
          <StatCard icon={<Boxes size={18} />} label="Deliveries this week" value={deliveriesThisWeek.length} color="#2E8B77" />
        </div>
      </div>

      <div className="rodi-two-col" style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 24, alignItems: "start" }}>
        <div>
          <h3 className="rodi-display" style={{ fontSize: 21, margin: "0 0 12px 0" }}>Needs attention</h3>
          <AttentionList title="Chasing needed" icon={<AlertOctagon size={16} />} color="#C1483A" items={chasing}
            renderItem={(it) => (
              <div key={it.kind + it.rec.id} data-testid="chasing-item" onClick={() => onOpen(it.kind, it.rec)} style={{ fontSize: 13.5, padding: "6px 0", borderBottom: "1px solid #EFEFEA", cursor: "pointer" }}>
                <strong>{it.kind === "service" ? `${it.rec.customer || "—"} — ${it.rec.bike || ""}` : `${it.rec.brand} ${it.rec.type}${it.rec.customer ? " — " + it.rec.customer : ""}`}</strong>
                {" "}<span style={{ color: "#C1483A" }}>{it.reason}</span>
              </div>
            )} />
          <AttentionList title="Ready for pick-up" icon={<PhoneCall size={16} />} color="#7C5CBF" items={readyForPickup}
            renderItem={(it) => (
              <div key={it.kind + it.rec.id} onClick={() => onOpen(it.kind, it.rec)} style={{ fontSize: 13.5, padding: "6px 0", borderBottom: "1px solid #EFEFEA", cursor: "pointer" }}>
                <strong>{it.kind === "service" ? `${it.rec.customer || "—"} — ${it.rec.bike || ""}` : `${it.rec.customer} — ${it.rec.brand} ${it.rec.type}`}</strong>
                {" "}<span style={{ color: "#8B9086" }}>{it.kind === "service" ? "service" : "order"}</span>
                {it.kind === "order" && it.rec.notified && <span style={{ color: "#3A7CA5", fontSize: 11, fontWeight: 600 }}> · Texted</span>}
              </div>
            )} />
          <AttentionList title="Overdue orders" icon={<AlertOctagon size={16} />} color="#C1483A" items={overdueOrders}
            renderItem={(o) => (
              <div key={o.id} onClick={() => onOpen("order", o)} style={{ fontSize: 13.5, padding: "6px 0", borderBottom: "1px solid #EFEFEA", cursor: "pointer" }}>
                <strong>{o.brand} {o.type}</strong> — ETA {formatAU(o.eta)} — {o.customer || "shop stock"}
              </div>
            )} />
          <AttentionList title="Overdue services" icon={<AlertOctagon size={16} />} color="#C1483A" items={overdueServices}
            renderItem={(s) => (
              <div key={s.id} onClick={() => onOpen("service", s)} style={{ fontSize: 13.5, padding: "6px 0", borderBottom: "1px solid #EFEFEA", cursor: "pointer" }}>
                <strong>{s.customer}</strong> — {s.bike} — booked {formatAU(s.bookedDate)}
              </div>
            )} />
          <AttentionList title="Overdue accessory orders" icon={<AlertOctagon size={16} />} color="#C1483A" items={overdueAccessories}
            renderItem={(a) => (
              <div key={a.id} onClick={() => onOpen("accessory", a)} style={{ fontSize: 13.5, padding: "6px 0", borderBottom: "1px solid #EFEFEA", cursor: "pointer" }}>
                <strong>{a.brand} {a.type}</strong> — ETA {formatAU(a.eta)} — {a.customer || "shop stock"}
              </div>
            )} />
          <AttentionList title="Needs assembly" icon={<AlertTriangle size={16} />} color="#D98B3D" items={needsAssembly}
            renderItem={(o) => (
              <div key={o.id} onClick={() => onOpen("order", o)} style={{ fontSize: 13.5, padding: "6px 0", borderBottom: "1px solid #EFEFEA", cursor: "pointer" }}>
                <strong>{o.brand} {o.type}</strong> — {o.customer || "shop stock"}
              </div>
            )} />
          <AttentionList title="Booked today" icon={<Wrench size={16} />} color="#191B18" items={servicesToday}
            renderItem={(s) => (
              <div key={s.id} onClick={() => onOpen("service", s)} style={{ fontSize: 13.5, padding: "6px 0", borderBottom: "1px solid #EFEFEA", cursor: "pointer" }}>
                <strong>{s.customer}</strong> — {s.bike} — {s.serviceType || "—"}
              </div>
            )} />
          {overdueOrders.length === 0 && overdueServices.length === 0 && overdueAccessories.length === 0 && needsAssembly.length === 0 && servicesToday.length === 0 && readyForPickup.length === 0 && chasing.length === 0 && (
            <p style={{ color: "#8B9086", fontSize: 14 }}>Nothing urgent right now — nice.</p>
          )}
        </div>

        <div>
          <h3 className="rodi-display" style={{ fontSize: 21, margin: "0 0 12px 0" }}>Customer lookup</h3>
          <div style={{ position: "relative", marginBottom: 14 }}>
            <Users size={15} style={{ position: "absolute", left: 10, top: 11, color: "#8B9086" }} />
            <input
              placeholder="Search a customer name…"
              value={customerQuery}
              onChange={(e) => setCustomerQuery(e.target.value)}
              style={{ ...inputStyle, width: "100%", paddingLeft: 32 }}
            />
          </div>
          {customerResults && (
            <div style={{ background: "#fff", border: "1px solid #E7E4DB", borderRadius: 18, boxShadow: "0 1px 2px rgba(20,20,15,0.04)", padding: 14 }}>
              {customerResults.orders.length === 0 && customerResults.services.length === 0 && customerResults.accessories.length === 0 && (
                <p style={{ color: "#8B9086", fontSize: 14, margin: 0 }}>No matches for "{customerQuery}".</p>
              )}
              {customerResults.orders.length > 0 && (
                <div style={{ marginBottom: 12 }}>
                  <h4 style={{ fontSize: 12.5, color: "#565C54", margin: "0 0 6px 0", textTransform: "uppercase" }}>Orders ({customerResults.orders.length})</h4>
                  {customerResults.orders.map((o) => (
                    <div key={o.id} onClick={() => onOpen("order", o)} style={{ fontSize: 13.5, padding: "6px 0", borderBottom: "1px solid #EFEFEA", cursor: "pointer" }}>
                      <strong>{o.brand} {o.type}</strong> — <StatusBadge label={o.status} color={ORDER_COLORS[o.status]} />
                    </div>
                  ))}
                </div>
              )}
              {customerResults.services.length > 0 && (
                <div style={{ marginBottom: 12 }}>
                  <h4 style={{ fontSize: 12.5, color: "#565C54", margin: "0 0 6px 0", textTransform: "uppercase" }}>Services ({customerResults.services.length})</h4>
                  {customerResults.services.map((s) => (
                    <div key={s.id} onClick={() => onOpen("service", s)} style={{ fontSize: 13.5, padding: "6px 0", borderBottom: "1px solid #EFEFEA", cursor: "pointer" }}>
                      <strong>{s.bike}</strong> — {s.serviceType || "—"} — <StatusBadge label={s.status} color={SERVICE_COLORS[s.status]} />
                    </div>
                  ))}
                </div>
              )}
              {customerResults.accessories.length > 0 && (
                <div>
                  <h4 style={{ fontSize: 12.5, color: "#565C54", margin: "0 0 6px 0", textTransform: "uppercase" }}>Accessories ({customerResults.accessories.length})</h4>
                  {customerResults.accessories.map((a) => (
                    <div key={a.id} onClick={() => onOpen("accessory", a)} style={{ fontSize: 13.5, padding: "6px 0", borderBottom: "1px solid #EFEFEA", cursor: "pointer" }}>
                      <strong>{a.brand} {a.type}</strong> — <StatusBadge label={a.status} color={ACCESSORY_COLORS[a.status]} />
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          <h3 className="rodi-display" style={{ fontSize: 20, margin: "22px 0 10px 0" }}>Notes &amp; checklist</h3>
          <ChecklistWidget
            items={checklistItems}
            onAdd={onAddChecklistItem}
            onToggle={onToggleChecklistItem}
            onDelete={onDeleteChecklistItem}
            onEdit={onEditChecklistItem}
          />
        </div>
      </div>

    </div>
  );
}

function toCSV(rows) {
  if (!rows.length) return "";
  const cols = Array.from(rows.reduce((set, r) => { Object.keys(r).forEach((k) => set.add(k)); return set; }, new Set()));
  const esc = (v) => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [cols.join(","), ...rows.map((r) => cols.map((c) => esc(r[c])).join(","))].join("\n");
}
function downloadText(name, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function RodiTracker() {
  const [tab, setTab] = usePersisted("tab", "dashboard");
  const [orders, setOrders] = useState([]);
  const [services, setServices] = useState([]);
  const [pricing, setPricing] = useState([]);
  const [accessories, setAccessories] = useState([]);
  const [calendarNotes, setCalendarNotes] = useState([]);
  const [checklistItems, setChecklistItems] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [drawer, setDrawer] = useState(null); // { type: 'order'|'service'|'pricing'|'accessory', data }
  const [confirm, setConfirm] = useState(null); // { type, id }

  const [syncError, setSyncError] = useState(null);
  const [changeLog, setChangeLog] = useState([]);
  const [toast, setToast] = useState(null);
  const [preset, setPreset] = useState(null);
  const [showName, setShowName] = useState(false);
  const [historyFor, setHistoryFor] = useState(null);
  const [customers, setCustomers] = useState([]);
  const [jobCard, setJobCard] = useState(null);
  const [userName, setUserName] = useState(() => { try { return localStorage.getItem("rodi-user") || ""; } catch (e) { return ""; } });
  const userNameRef = useRef(userName);
  userNameRef.current = userName;
  const ordersRef = useRef(orders); ordersRef.current = orders;
  const servicesRef = useRef(services); servicesRef.current = services;
  const accessoriesRef = useRef(accessories); accessoriesRef.current = accessories;
  const pricingRef = useRef(pricing); pricingRef.current = pricing;
  const customersRef = useRef(customers); customersRef.current = customers;

  useEffect(() => {
    (async () => {
      try {
        let [o, s, p, a, n] = await Promise.all([
          sbList("orders"), sbList("services"), sbList("pricing"), sbList("accessories"), sbList("notes"),
        ]);
        // legacy upper-case WARRANTY value -> Warranty
        const fixW = (r) => (r.payment === "WARRANTY" ? { ...r, payment: "Warranty" } : r.paymentOwing === "WARRANTY" ? { ...r, paymentOwing: "Warranty" } : r);
        o = o.map(fixW); a = a.map(fixW);
        setOrders(o);
        setServices(s);
        setPricing(p);
        setAccessories(a);
        setCalendarNotes(n);
        setSyncError(null);
      } catch (e) {
        console.error(e);
        setSyncError("Couldn't load data from the database: " + e.message);
      } finally {
        setLoaded(true);
      }
      // Loaded separately so a shop that hasn't yet run the checklist_items
      // SQL doesn't break the rest of the app's data loading.
      try {
        setChecklistItems(await sbList("checklist_items"));
      } catch (e) {
        console.error(e);
      }
      // Saved customer details are optional too (needs the customers table).
      try {
        setCustomers(await sbList("customers"));
      } catch (e) {
        console.error(e);
      }
      // Change history is optional too — if its table doesn't exist yet the app still works.
      try {
        setChangeLog(await sbList("change_log"));
      } catch (e) {
        console.error(e);
      }
    })();
  }, []);

  const addCalendarNote = useCallback(async (date, text) => {
    const note = { id: uid(), date, text };
    try {
      const saved = await sbUpsert("notes", note);
      setCalendarNotes((prev) => [...prev, saved]);
    } catch (e) {
      setSyncError("Couldn't save the note: " + e.message);
    }
  }, []);
  const updateCalendarNote = useCallback(async (id, date, text) => {
    try {
      const saved = await sbUpsert("notes", { id, date, text });
      setCalendarNotes((prev) => prev.map((n) => (n.id === id ? saved : n)));
    } catch (e) {
      setSyncError("Couldn't update the note: " + e.message);
    }
  }, []);
  const deleteCalendarNote = useCallback(async (id) => {
    try {
      await sbDelete("notes", id);
      setCalendarNotes((prev) => prev.filter((n) => n.id !== id));
    } catch (e) {
      setSyncError("Couldn't delete the note: " + e.message);
    }
  }, []);

  const addChecklistItem = useCallback(async (text) => {
    const item = { id: uid(), text, done: false };
    try {
      const saved = await sbUpsert("checklist_items", item);
      setChecklistItems((prev) => [...prev, saved]);
    } catch (e) {
      setSyncError("Couldn't save the checklist item — has the checklist_items table been created yet? (" + e.message + ")");
    }
  }, []);
  const toggleChecklistItem = useCallback((id) => {
    setChecklistItems((prev) => {
      const target = prev.find((i) => i.id === id);
      if (!target) return prev;
      const updated = { ...target, done: !target.done };
      sbUpsert("checklist_items", updated).catch((e) => setSyncError("Couldn't update the checklist item: " + e.message));
      return prev.map((i) => (i.id === id ? updated : i));
    });
  }, []);
  const editChecklistItem = useCallback((id, text) => {
    setChecklistItems((prev) => {
      const target = prev.find((i) => i.id === id);
      if (!target) return prev;
      const updated = { ...target, text };
      sbUpsert("checklist_items", updated).catch((e) => setSyncError("Couldn't update the checklist item: " + e.message));
      return prev.map((i) => (i.id === id ? updated : i));
    });
  }, []);
  const deleteChecklistItem = useCallback(async (id) => {
    try {
      await sbDelete("checklist_items", id);
      setChecklistItems((prev) => prev.filter((i) => i.id !== id));
    } catch (e) {
      setSyncError("Couldn't delete the checklist item: " + e.message);
    }
  }, []);

  const tableCfg = {
    orders: { ref: ordersRef, set: setOrders },
    services: { ref: servicesRef, set: setServices },
    accessories: { ref: accessoriesRef, set: setAccessories },
    pricing: { ref: pricingRef, set: setPricing },
  };

  const logChange = useCallback((table, rec, action, summary) => {
    const entry = {
      id: uid(), at: new Date().toISOString(), tableName: table, recordId: rec ? rec.id : "",
      label: recordLabel(table, rec), action, summary: summary || "", who: userNameRef.current || "",
    };
    setChangeLog((prev) => [...prev, entry]);
    sbUpsert("change_log", entry).catch(() => {});
  }, []);

  const saveRecord = useCallback(async (table, form, noun) => {
    const cfg = tableCfg[table];
    const before = cfg.ref.current.find((r) => r.id === form.id);
    try {
      const saved = await sbUpsert(table, form);
      cfg.set((prev) => (prev.some((r) => r.id === saved.id) ? prev.map((r) => (r.id === saved.id ? saved : r)) : [...prev, saved]));
      setDrawer(null);
      if (!before) logChange(table, saved, "created", "");
      else { const sum = diffRecords(before, saved, table); if (sum) logChange(table, saved, "edited", sum); }
      return true;
    } catch (e) {
      setSyncError(`Couldn't save the ${noun}: ` + e.message);
      return false;
    }
  }, []);
  const saveOrder = useCallback((form) => saveRecord("orders", form, "order"), []);
  const saveService = useCallback((form) => saveRecord("services", form, "booking"), []);
  const savePricing = useCallback((form) => saveRecord("pricing", form, "price"), []);
  const saveAccessory = useCallback((form) => saveRecord("accessories", form, "accessory order"), []);

  // Optimistic partial update of one record, logged to the history.
  const patchRecord = useCallback(async (table, id, patch, action, summary) => {
    const cfg = tableCfg[table];
    const target = cfg.ref.current.find((r) => r.id === id);
    if (!target) return false;
    const updated = { ...target, ...patch };
    cfg.set((prev) => prev.map((r) => (r.id === id ? updated : r)));
    cfg.ref.current = cfg.ref.current.map((r) => (r.id === id ? updated : r));
    try {
      await sbUpsert(table, updated);
      logChange(table, updated, action, summary);
      return true;
    } catch (e) {
      cfg.set((prev) => prev.map((r) => (r.id === id ? target : r)));
      setSyncError("Couldn't update the record: " + e.message);
      return false;
    }
  }, []);

  const toggleArchive = useCallback(async (table, id, silent) => {
    const t = tableCfg[table].ref.current.find((r) => r.id === id);
    if (!t) return;
    const nowArchived = !t.archived;
    const ok = await patchRecord(table, id, { archived: nowArchived }, nowArchived ? "archived" : "restored", "");
    if (ok && !silent) setToast({ id: uid(), text: nowArchived ? "Archived." : "Restored.", undo: () => toggleArchive(table, id, true) });
  }, []);
  const toggleOrderArchive = useCallback((id) => toggleArchive("orders", id), []);
  const toggleServiceArchive = useCallback((id) => toggleArchive("services", id), []);
  const toggleAccessoryArchive = useCallback((id) => toggleArchive("accessories", id), []);

  const bulkArchive = useCallback(async (table, statusValue, noun) => {
    try {
      const updated = await sbBulkArchive(table, statusValue);
      const ids = new Set(updated.map((r) => r.id));
      tableCfg[table].set((prev) => prev.map((r) => (ids.has(r.id) ? { ...r, archived: true } : r)));
      if (updated.length) logChange(table, null, "archived", `${updated.length} ${noun} archived`);
    } catch (e) {
      setSyncError(`Couldn't archive ${noun}: ` + e.message);
    }
  }, []);
  const archiveAllReceivedOrders = useCallback(() => bulkArchive("orders", "Received", "received orders"), []);
  const archiveAllCompletedServices = useCallback(() => bulkArchive("services", "Completed", "completed services"), []);
  const archiveAllReceivedAccessories = useCallback(() => bulkArchive("accessories", "Received", "received accessories"), []);

  const STATUS_LISTS = { orders: ORDER_STATUSES, services: SERVICE_STATUSES, accessories: ACCESSORY_STATUSES };
  const setStatus = useCallback((table, id, status) => {
    const t = tableCfg[table].ref.current.find((r) => r.id === id);
    if (!t || t.status === status) return;
    patchRecord(table, id, { status }, "edited", `status: ${t.status} → ${status}`);
  }, []);
  const advanceStatus = useCallback((table, id) => {
    const t = tableCfg[table].ref.current.find((r) => r.id === id);
    const next = t && nextStatus(t.status, STATUS_LISTS[table]);
    if (next) setStatus(table, id, next);
  }, []);
  const advanceOrderStatus = useCallback((id) => advanceStatus("orders", id), []);
  const advanceServiceStatus = useCallback((id) => advanceStatus("services", id), []);
  const advanceAccessoryStatus = useCallback((id) => advanceStatus("accessories", id), []);
  const setOrderStatus = useCallback((id, st) => setStatus("orders", id, st), []);
  const setServiceStatus = useCallback((id, st) => setStatus("services", id, st), []);
  const setAccessoryStatus = useCallback((id, st) => setStatus("accessories", id, st), []);

  const appendServiceLog = useCallback((id, text) => {
    const t = servicesRef.current.find((r) => r.id === id);
    if (!t) return;
    patchRecord("services", id, { notes: logWithAdd(t.notes, text) }, "edited", "log entry: " + text.slice(0, 40));
  }, []);

  const editServiceLogEntry = useCallback((id, idx, text) => {
    const t = servicesRef.current.find((r) => r.id === id);
    if (t) patchRecord("services", id, { notes: logWithEdit(t.notes, idx, text) }, "edited", "log entry edited");
  }, []);
  const deleteServiceLogEntry = useCallback((id, idx) => {
    const t = servicesRef.current.find((r) => r.id === id);
    if (t) patchRecord("services", id, { notes: logWithout(t.notes, idx) }, "edited", "log entry deleted");
  }, []);

  const saveCustomer = useCallback(async (profile, isNew, oldName) => {
    const oldKey = (oldName || "").trim().toLowerCase();
    const before = customersRef.current.find((c) => c.id === profile.id) || customersRef.current.find((c) => (c.name || "").trim().toLowerCase() === oldKey);
    const renamed = !isNew && !!oldKey && profile.name.trim().toLowerCase() !== oldKey;
    try {
      const saved = await sbUpsert("customers", before ? { ...profile, id: before.id } : profile);
      setCustomers((prev) => (prev.some((c) => c.id === saved.id) ? prev.map((c) => (c.id === saved.id ? saved : c)) : [...prev, saved]));
      if (!before) logChange("customers", saved, "created", "");
      else { const sum = diffRecords(before, saved); if (sum) logChange("customers", saved, "edited", sum); }
      // Keep their orders / services / accessories in step with the profile (name, and phone where it was empty or the old number).
      if (!isNew && oldKey) {
        const oldPhone = before ? before.phone || "" : "";
        [["orders", ordersRef], ["services", servicesRef], ["accessories", accessoriesRef]].forEach(([table, ref]) => {
          ref.current.filter((r) => (r.customer || "").trim().toLowerCase() === oldKey).forEach((r) => {
            const patch = {};
            if (renamed) patch.customer = saved.name;
            if (saved.phone && r.phone !== saved.phone && (!r.phone || r.phone === oldPhone)) patch.phone = saved.phone;
            if (Object.keys(patch).length) patchRecord(table, r.id, patch, "edited", renamed ? `customer renamed to ${saved.name}` : "phone updated from customer profile");
          });
        });
      }
      if (isNew || renamed) setHistoryFor({ name: saved.name, phone: saved.phone || "" });
      return true;
    } catch (e) {
      setSyncError("Couldn't save the customer details — has the customers table been created yet? (" + e.message + ")");
      return false;
    }
  }, []);

  const deleteRecord = useCallback(async (table, id) => {
    const cfg = tableCfg[table];
    const rec = cfg.ref.current.find((r) => r.id === id);
    try {
      await sbDelete(table, id);
      cfg.set((prev) => prev.filter((r) => r.id !== id));
      cfg.ref.current = cfg.ref.current.filter((r) => r.id !== id);
      logChange(table, rec, "deleted", "");
      if (rec) {
        setToast({
          id: uid(), text: "Deleted.",
          undo: async () => {
            try {
              const back = await sbUpsert(table, rec);
              cfg.set((prev) => [...prev, back]);
              logChange(table, back, "restored", "undo delete");
            } catch (e) {
              setSyncError("Couldn't undo the delete: " + e.message);
            }
          },
        });
      }
    } catch (e) {
      setSyncError("Couldn't delete: " + e.message);
    }
  }, []);

  // "Save & create service booking" from an order's drawer.
  const createServiceFromOrder = useCallback(async (form) => {
    const ok = await saveRecord("orders", form, "order");
    if (!ok) return;
    setDrawer({
      type: "service",
      data: { ...emptyService(), customer: form.customer || "", phone: form.phone || "", bike: `${form.brand} ${form.type}`.trim(), serviceType: "PRE-DELIVERY SERVICE", bookedDate: todayISO() },
    });
  }, []);

  const goTo = useCallback((t, quick) => { setTab(t); setPreset(quick ? { key: Date.now(), quick, tab: t } : null); }, []);
  const navTo = useCallback((t) => { setTab(t); setPreset(null); }, []);
  const saveName = (name) => {
    setUserName(name);
    try { localStorage.setItem("rodi-user", name); } catch (e) { /* ignore */ }
    setShowName(false);
  };

  // Mobile card layout: copy each column header onto its cells as a data-label (used by the CSS).
  useEffect(() => {
    const root = document.querySelector(".rodi-root");
    if (!root || typeof MutationObserver === "undefined") return undefined;
    let timer = 0;
    const label = () => {
      root.querySelectorAll(".rodi-scrollbar table").forEach((tb) => {
        const heads = Array.from(tb.querySelectorAll("thead th")).map((h) => h.textContent.replace(/[▲▼]/g, "").trim());
        tb.querySelectorAll("tbody tr").forEach((tr) => {
          Array.from(tr.children).forEach((td, i) => {
            if (td.colSpan > 1) return;
            const l = heads[i];
            if (l && td.getAttribute("data-label") !== l) td.setAttribute("data-label", l);
          });
        });
      });
    };
    const obs = new MutationObserver(() => { clearTimeout(timer); timer = setTimeout(label, 0); });
    obs.observe(root, { childList: true, subtree: true });
    label();
    return () => { obs.disconnect(); clearTimeout(timer); };
  }, []);

  // Opens the edit drawer for a record clicked on the Calendar day panel.
  const openRecordFromCalendar = useCallback((kind, ref) => {
    if (kind === "order") setDrawer({ type: "order", data: ref });
    else if (kind === "service") setDrawer({ type: "service", data: ref });
    else if (kind === "accessory") setDrawer({ type: "accessory", data: ref });
  }, []);

  // "Schedule delivery" from the Calendar — always starts a fresh delivery order via the
  // simplified DeliveryForm, pre-dated to whichever day was selected.
  const scheduleDeliveryFromCalendar = useCallback((dateStr) => {
    setDrawer({
      type: "delivery",
      // Scheduled straight from the calendar means it's coming out of floor stock, so it's
      // already physically in the shop — default "Shop stock only" on and the status to
      // "Received" (the bike isn't "Pre-ordered", it's sitting there ready to go out).
      // The customer's name is unaffected by "Shop stock only" — that just adds a STOCK tag.
      data: { ...emptyOrder(), fulfillment: "Delivery", deliveryDate: dateStr || "", forStock: true, status: "Received" },
    });
  }, []);
  const scheduleServiceFromCalendar = useCallback((dateStr) => {
    setDrawer({ type: "service", data: { ...emptyService(), bookedDate: dateStr || todayISO() } });
  }, []);

  const TAB_SHORT = { dashboard: "Home", orders: "Orders", accessories: "Parts", services: "Services", calendar: "Calendar", customers: "Clients", history: "History", pricing: "Pricing" };
  const tabs = [
    { id: "dashboard", label: "Dashboard", icon: LayoutDashboard },
    { id: "orders", label: "Inventory & orders", icon: Package },
    { id: "accessories", label: "Accessories & parts", icon: Boxes },
    { id: "services", label: "Services", icon: Wrench },
    { id: "calendar", label: "Calendar", icon: CalendarDays },
    // Stock pricing tab is hidden for now. Set SHOW_STOCK_PRICING = true (top of file) to bring it back; data and code are untouched.
    ...(SHOW_STOCK_PRICING ? [{ id: "pricing", label: "Stock pricing", icon: Tag }] : []),
    { id: "customers", label: "Customers", icon: Users },
    { id: "history", label: "History", icon: RotateCcw },
  ];
  // A remembered tab that no longer exists (e.g. hidden Stock pricing) falls back to the dashboard.
  useEffect(() => { if (!tabs.some((t) => t.id === tab)) setTab("dashboard"); }, [tab]);

  const exportAllData = useCallback(() => {
    const payload = {
      exportedAt: new Date().toISOString(),
      orders, services, accessories, pricing, calendarNotes, checklistItems, changeLog, customers,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `rodi-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, [orders, services, accessories, pricing, calendarNotes, checklistItems, changeLog, customers]);

  const exportCSV = useCallback(() => {
    const files = [["orders", orders], ["services", services], ["accessories", accessories], ["pricing", pricing]];
    files.forEach(([name, rows], i) => {
      setTimeout(() => downloadText(`rodi-${name}-${todayISO()}.csv`, toCSV(rows), "text/csv"), i * 400);
    });
  }, [orders, services, accessories, pricing]);

  const ctxValue = { records: { orders, services, accessories }, profiles: customers, viewCustomer: setHistoryFor, printJob: setJobCard };

  return (
    <AppCtx.Provider value={ctxValue}>
    <div className="rodi-root" style={{ minHeight: "100%" }}>
      <GlobalStyle />
      <div className="rodi-shell">
      <aside className="rodi-side">
        <div className="rodi-brand">
          <div className="rodi-brand-mark"><Zap size={20} color="#121311" fill="#121311" /></div>
          <div className="rodi-brand-text">
            <span style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 20, letterSpacing: "0.04em", color: "#fff", lineHeight: 1.05 }}>RODI</span>
            <span style={{ fontSize: 10.5, letterSpacing: "0.28em", color: "#8E8F86", fontWeight: 600, lineHeight: 1.1 }}>ELECTRIC</span>
          </div>
        </div>
        <nav className="rodi-nav">
          {tabs.map((t) => {
            const Icon = t.icon;
            const active = tab === t.id;
            return (
              <button key={t.id} onClick={() => navTo(t.id)} className={"rodi-btn rodi-navbtn" + (active ? " active" : "")} data-active={active ? "1" : "0"}>
                <Icon size={19} color={active ? "#F6BD1B" : "currentColor"} /> <span className="rodi-lbl" data-short={TAB_SHORT[t.id] || t.label}>{t.label}</span>
              </button>
            );
          })}
        </nav>
        <button onClick={() => setShowName(true)} title="Set your name" data-testid="user-chip" className="rodi-btn rodi-userchip">
          <span className="rodi-avatar">{(userName || "?").trim().charAt(0).toUpperCase() || "?"}</span>
          <span style={{ display: "flex", flexDirection: "column", lineHeight: 1.25, textAlign: "left" }}>
            <span style={{ color: "#fff", fontWeight: 600, fontSize: 13.5 }}>{userName || "Set name"}</span>
            <span style={{ fontSize: 12, color: "#8E8F86" }}>Workshop · Perth</span>
          </span>
        </button>
      </aside>
      <div className="rodi-content">
      <div className="rodi-topbar">
        <div className="rodi-mbrand"><Zap size={18} color="#121311" /></div>
        <div className="rodi-gs"><GlobalSearch orders={orders} services={services} accessories={accessories} onOpen={openRecordFromCalendar} /></div>
        <button onClick={() => setShowName(true)} title="Set your name" className="rodi-btn rodi-mchip" data-testid="user-chip-mobile">
          <span className="rodi-avatar">{(userName || "?").trim().charAt(0).toUpperCase() || "?"}</span>
        </button>
      </div>
      <div style={{ padding: "8px 44px 60px", display: "flex", justifyContent: "center" }} className="rodi-page">
      <div style={{ maxWidth: 1500, width: "100%" }}>
        {syncError && (
          <div style={{
            background: "#FBEAE8", border: "1px solid #E3B3AC", color: "#8A2E22", borderRadius: 10,
            padding: "10px 14px", marginBottom: 16, fontSize: 13.5, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12,
          }}>
            <span>{syncError}</span>
            <button onClick={() => setSyncError(null)} style={{ background: "none", border: "none", cursor: "pointer", color: "#8A2E22", fontWeight: 700, fontSize: 16, lineHeight: 1 }}>×</button>
          </div>
        )}
        {!loaded ? (
          <div style={{ padding: "80px 20px", textAlign: "center", color: "#8B9086", fontSize: 14.5 }}>
            Loading your data…
          </div>
        ) : (
          <>
            {tab === "dashboard" && (
              <DashboardTab
                orders={orders}
                services={services}
                accessories={accessories}
                checklistItems={checklistItems}
                onAddChecklistItem={addChecklistItem}
                onToggleChecklistItem={toggleChecklistItem}
                onDeleteChecklistItem={deleteChecklistItem}
                onEditChecklistItem={editChecklistItem}
                onExport={exportAllData}
                onExportCSV={exportCSV}
                goTo={goTo}
                onOpen={openRecordFromCalendar}
              />
            )}
            {tab === "orders" && (
              <OrdersTab
                orders={orders}
                onAdd={() => setDrawer({ type: "order", data: emptyOrder() })}
                onEdit={(o) => setDrawer({ type: "order", data: o })}
                onDelete={(id) => setConfirm({ type: "order", id })}
                onDuplicate={(o) => setDrawer({
                  type: "order",
                  data: {
                    ...emptyOrder(),
                    brand: o.brand, type: o.type, colour: o.colour, qty: o.qty,
                    fulfillment: o.fulfillment, forStock: o.forStock,
                  },
                })}
                onToggleArchive={toggleOrderArchive}
                onArchiveAllReceived={archiveAllReceivedOrders}
                onAdvanceStatus={advanceOrderStatus}
                onSetStatus={setOrderStatus}
                preset={preset && preset.tab === "orders" ? preset : null}
              />
            )}
            {tab === "services" && (
              <ServicesTab
                services={services}
                onAdd={() => setDrawer({ type: "service", data: emptyService() })}
                onEdit={(s) => setDrawer({ type: "service", data: s })}
                onDelete={(id) => setConfirm({ type: "service", id })}
                onToggleArchive={toggleServiceArchive}
                onArchiveAllCompleted={archiveAllCompletedServices}
                onAdvanceStatus={advanceServiceStatus}
                onSetStatus={setServiceStatus}
                onAppendLog={appendServiceLog}
                onEditLogEntry={editServiceLogEntry}
                onDeleteLogEntry={deleteServiceLogEntry}
                preset={preset && preset.tab === "services" ? preset : null}
              />
            )}
            {tab === "accessories" && (
              <AccessoriesTab
                accessories={accessories}
                onAdd={() => setDrawer({ type: "accessory", data: emptyAccessory() })}
                onEdit={(a) => setDrawer({ type: "accessory", data: a })}
                onDelete={(id) => setConfirm({ type: "accessory", id })}
                onDuplicate={(a) => setDrawer({
                  type: "accessory",
                  data: { ...emptyAccessory(), brand: a.brand, type: a.type, colour: a.colour, qty: a.qty, forStock: a.forStock },
                })}
                onToggleArchive={toggleAccessoryArchive}
                onArchiveAllReceived={archiveAllReceivedAccessories}
                onAdvanceStatus={advanceAccessoryStatus}
                onSetStatus={setAccessoryStatus}
              />
            )}
            {tab === "pricing" && (
              <PricingTab
                pricing={pricing}
                onAdd={() => setDrawer({ type: "pricing", data: emptyPricing() })}
                onEdit={(p) => setDrawer({ type: "pricing", data: p })}
                onDelete={(id) => setConfirm({ type: "pricing", id })}
              />
            )}
            {tab === "customers" && (
              <CustomersTab
                customers={buildCustomers(ctxValue.records, customers)}
                onOpen={(c) => setHistoryFor(c)}
                onAdd={() => setHistoryFor({ name: "", phone: "", isNew: true })}
              />
            )}
            {tab === "history" && <HistoryTab entries={changeLog} />}
            {tab === "calendar" && (
              <CalendarTab
                orders={orders}
                services={services}
                accessories={accessories}
                calendarNotes={calendarNotes}
                onAddNote={addCalendarNote}
                onEditNote={updateCalendarNote}
                onDeleteNote={deleteCalendarNote}
                onOpenRecord={openRecordFromCalendar}
                onScheduleDelivery={scheduleDeliveryFromCalendar}
                onScheduleService={scheduleServiceFromCalendar}
              />
            )}
          </>
        )}
      </div>
      </div>
      </div>
      </div>

      {drawer?.type === "order" && (
        <OrderForm initial={drawer.data} onSave={saveOrder} onClose={() => setDrawer(null)} onCreateService={createServiceFromOrder} />
      )}
      {drawer?.type === "delivery" && (
        <DeliveryForm initial={drawer.data} onSave={saveOrder} onClose={() => setDrawer(null)} />
      )}
      {drawer?.type === "service" && (
        <ServiceForm initial={drawer.data} onSave={saveService} onClose={() => setDrawer(null)} />
      )}
      {drawer?.type === "pricing" && (
        <PricingForm initial={drawer.data} onSave={savePricing} onClose={() => setDrawer(null)} />
      )}
      {drawer?.type === "accessory" && (
        <AccessoryForm initial={drawer.data} onSave={saveAccessory} onClose={() => setDrawer(null)} />
      )}
      {confirm && (
        <ConfirmDialog
          text={
            confirm.type === "order" ? "Delete this order? This can't be undone."
              : confirm.type === "service" ? "Delete this service booking? This can't be undone."
              : confirm.type === "pricing" ? "Delete this price entry? This can't be undone."
              : "Delete this accessory order? This can't be undone."
          }
          onCancel={() => setConfirm(null)}
          onConfirm={async () => {
            const table = confirm.type === "order" ? "orders" : confirm.type === "service" ? "services" : confirm.type === "pricing" ? "pricing" : "accessories";
            const id = confirm.id;
            setConfirm(null);
            await deleteRecord(table, id);
          }}
        />
      )}
      <Toast toast={toast} onClose={() => setToast(null)} />
      {showName && <NameDialog current={userName} onSave={saveName} onClose={() => setShowName(false)} />}
      {historyFor && (
        <CustomerHistoryModal key={historyFor.isNew ? "new" : historyFor.name} customer={historyFor} records={ctxValue.records} profiles={customers} onSaveProfile={saveCustomer}
          onOpen={(kind, rec) => { setHistoryFor(null); openRecordFromCalendar(kind, rec); }} onClose={() => setHistoryFor(null)} />
      )}
      {jobCard && <JobCardModal job={jobCard} onClose={() => setJobCard(null)} />}
    </div>
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<RodiTracker />);

</script>
<script>
  (function () {
    try {
      var source = document.getElementById('app-source').textContent;
      var output = Babel.transform(source, {
        presets: [['react', { runtime: 'classic' }]]
      }).code;
      var script = document.createElement('script');
      script.textContent = output;
      document.body.appendChild(script);
    } catch (err) {
      document.getElementById('root').innerHTML =
        '<div id="boot-error">Something went wrong loading the app:\n' +
        (err && err.message ? err.message : err) + '</div>';
      console.error(err);
    }
  })();
</script>
</body>
</html>
