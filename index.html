function camelToSnake(obj) {
  const out = {};
  Object.keys(obj).forEach((k) => {
    const snake = k.replace(/[A-Z]/g, (m) => "_" + m.toLowerCase());
    out[snake] = obj[k];
  });
  return out;
}
function snakeToCamel(obj) {
  const out = {};
  Object.keys(obj).forEach((k) => {
    const camel = k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
    out[camel] = obj[k];
  });
  return out;
}

async function sbList(table) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?select=*&order=created_at.asc", {
    headers: sbHeaders,
  });
  if (!res.ok) throw new Error("Failed to load " + table + " (" + res.status + ")");
  const rows = await res.json();
  return rows.map(snakeToCamel);
}

async function sbUpsert(table, obj) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?on_conflict=id", {
    method: "POST",
    headers: { ...sbHeaders, Prefer: "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify(camelToSnake(obj)),
  });
  if (!res.ok) throw new Error("Failed to save to " + table + " (" + res.status + ")");
  const rows = await res.json();
  return rows[0] ? snakeToCamel(rows[0]) : obj;
}

async function sbDelete(table, id) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + table + "?id=eq." + encodeURIComponent(id), {
    method: "DELETE",
    headers: sbHeaders,
  });
  if (!res.ok) throw new Error("Failed to delete from " + table + " (" + res.status + ")");
  return true;
}

async function sbBulkArchive(table, statusValue) {
  const res = await fetch(
    SUPABASE_URL + "/rest/v1/" + table + "?status=eq." + encodeURIComponent(statusValue) + "&archived=eq.false",
    {
      method: "PATCH",
      headers: { ...sbHeaders, Prefer: "return=representation" },
      body: JSON.stringify({ archived: true }),
    }
  );
  if (!res.ok) throw new Error("Bulk archive failed (" + res.status + ")");
  const rows = await res.json();
  return rows.map(snakeToCamel);
}

// Displays a stored ISO date (YYYY-MM-DD) as Australian format with weekday, e.g. "Wed 23/09/2026". Storage format is unchanged.
function formatAU(dateStr) {
  if (!dateStr) return "";
  const parts = dateStr.split("-");
  if (parts.length !== 3) return dateStr;
  const [y, m, d] = parts;
  const dateObj = new Date(Number(y), Number(m) - 1, Number(d));
  if (isNaN(dateObj.getTime())) return `${d}/${m}/${y}`;
  const weekday = dateObj.toLocaleDateString("en-AU", { weekday: "short" });
  return `${weekday} ${d}/${m}/${y}`;
}

const todayISO = () => new Date().toISOString().slice(0, 10);
// True if the given ISO date (YYYY-MM-DD) is strictly before today.
function isPastDate(dateStr) {
  if (!dateStr) return false;
  return dateStr < todayISO();
}
// Days between today and the given ISO date (negative = past, 0 = today, positive = future).
function daysFromToday(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const [y, m, d] = dateStr.split("-").map(Number);
  const target = new Date(y, m - 1, d);
  return Math.round((target - today) / 86400000);
}

// Like formatAU, but shows TODAY / TOMORROW / YESTERDAY for those dates.
function formatAURel(dateStr) {
  if (!dateStr) return "";
  const n = daysFromToday(dateStr);
  if (n === 0) return "TODAY";
  if (n === 1) return "TOMORROW";
  if (n === -1) return "YESTERDAY";
  return formatAU(dateStr);
}

// Returns the status that follows `current` in `list`, or null if it's already last (or not found).
function nextStatus(current, list) {
  const idx = list.indexOf(current);
  if (idx === -1 || idx === list.length - 1) return null;
  return list[idx + 1];
}

// Generic row sorter: sortKey is a field name on each row, sortDir is "asc" or "desc".
// statusOrder (optional): when sorting by "status", ranks by position in this array
// (the real workflow progression, e.g. Pre-ordered → Ordered → In Transit → Received)
// instead of sorting the status label alphabetically.
function sortRows(rows, sortKey, sortDir, statusOrder) {
  if (!sortKey) return rows;
  const arr = [...rows];
  arr.sort((a, b) => {
    let av = a[sortKey];
    let bv = b[sortKey];
    if (sortKey === "status" && statusOrder) {
      av = statusOrder.indexOf(av);
      bv = statusOrder.indexOf(bv);
      if (av === -1) av = statusOrder.length;
      if (bv === -1) bv = statusOrder.length;
    } else {
      const an = Number(av), bn = Number(bv);
      if (av !== "" && bv !== "" && !isNaN(an) && !isNaN(bn) && av != null && bv != null) {
        av = an; bv = bn;
      } else {
        av = (av ?? "").toString().toLowerCase();
        bv = (bv ?? "").toString().toLowerCase();
      }
    }
    if (av < bv) return sortDir === "asc" ? -1 : 1;
    if (av > bv) return sortDir === "asc" ? 1 : -1;
    return 0;
  });
  return arr;
}
// Renders a clickable, sortable table header cell.
function SortableHeader({ label, sortKey, activeKey, dir, onSort, width }) {
  const active = sortKey && activeKey === sortKey;
  return (
    <th
      onClick={() => sortKey && onSort(sortKey)}

        padding: "9px 8px", fontSize: 12, color: active ? "#191B18" : "#565C54", fontWeight: 600,
        cursor: sortKey ? "pointer" : "default", userSelect: "none", width: width || undefined,
      }}
    >

        {sortKey && <ArrowUpDown size={10} style={{ opacity: active ? 1 : 0.3, flexShrink: 0 }} />}
        {active && <span style={{ fontSize: 9 }}>{dir === "asc" ? "▲" : "▼"}</span>}
      </span>
    </th>
  );
}

function getCourierName(url) {
  try {
    const host = new URL(url).hostname.replace(/^www\./, "");
    for (const domain of Object.keys(COURIER_DOMAINS)) {
      if (host === domain || host.endsWith("." + domain)) return COURIER_DOMAINS[domain];
    }
    const parts = host.split(".");
    const core = parts.length >= 2 ? parts[parts.length - 2] : parts[0];
    return core.charAt(0).toUpperCase() + core.slice(1);
  } catch (e) {
    return "Track";
  }
}

}

function escapeICS(s) {
  return String(s || "").replace(/[\\;,]/g, (m) => "\\" + m).replace(/\n/g, "\\n");
}
function buildICS(events) {
  let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//RODI Tracker//EN\n";
  events.forEach((ev) => {
    const dt = ev.date.replace(/-/g, "");
    ics += `BEGIN:VEVENT\nUID:${uid()}@rodi-tracker\nDTSTAMP:${dt}T090000Z\nDTSTART;VALUE=DATE:${dt}\nSUMMARY:${escapeICS(ev.title)}\nDESCRIPTION:${escapeICS(ev.description)}\nEND:VEVENT\n`;
  });
  ics += "END:VCALENDAR";
  return ics;
}
function downloadICS(orders, services, accessories, calendarNotes) {
  const events = [];
  orders.forEach((o) => {
    if (o.eta) {
      events.push({
        title: `${o.brand || "Order"} ${o.type || ""} arriving`.trim(),
        date: o.eta,
        description: `Customer: ${o.customer || "—"} | Tracking: ${o.tracking || "—"}`,
      });
    }
  });
  services.forEach((s) => {
    if (s.bookedDate) {
      events.push({
        title: `Service — ${s.customer || "Customer"} (${s.bike || "bike"})`,
        date: s.bookedDate,
        description: s.serviceType || "",
      });
    }
  });
  (accessories || []).forEach((a) => {
    if (a.eta) {
      events.push({
        title: `Restock arriving — ${a.brand || ""} ${a.type || "accessory"}`.trim(),
        date: a.eta,
        description: `Qty: ${a.qty || "—"} | Customer: ${a.customer || "—"} | Tracking: ${a.tracking || "—"}`,
      });
    }
  });
  (calendarNotes || []).forEach((n) => {
    if (n.date) {
      events.push({ title: n.text, date: n.date, description: "" });
    }
  });
  if (events.length === 0) return false;
  const blob = new Blob([buildICS(events)], { type: "text/calendar" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "rodi-schedule.ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return true;
}

// "#RRGGBB" -> darker "#RRGGBB" (amt 0..1) for readable text on a soft tint of the same colour.
function shadeHex(hex, amt) {
  const m = /^#([0-9a-f]{6})$/i.exec(hex || "");
  if (!m) return "#16171A";
  const n = parseInt(m[1], 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(v * (1 - amt))));
  return "#" + [f((n >> 16) & 255), f((n >> 8) & 255), f(n & 255)].map((v) => v.toString(16).padStart(2, "0")).join("");
}
function tintOf(hex, alphaHex) { return /^#[0-9a-f]{6}$/i.test(hex || "") ? hex + (alphaHex || "22") : "#ECEAE3"; }

// useState that remembers its value in localStorage (safe if storage is blocked).
function usePersisted(key, initial) {
  const [v, setV] = useState(() => {
    try { const raw = localStorage.getItem("rodi:" + key); if (raw != null) return JSON.parse(raw); } catch (e) {}
    return typeof initial === "function" ? initial() : initial;
  });
  useEffect(() => { try { localStorage.setItem("rodi:" + key, JSON.stringify(v)); } catch (e) {} }, [key, v]);
  return [v, setV];
}

// ---- Service workshop log: stored as lines "dd/mm/yyyy HH:MM | TEXT" inside the existing `notes` text column ----
const STAMP_RE = /^(\d{2}\/\d{2}\/\d{4} \d{2}:\d{2}) \| (.*)$/;
// notes column = optional "JOB | text" line (service details) + "PART | text" lines (parts used) + timestamped log lines.
// Legacy untimestamped lines count as service details.
function splitNotes(notes) {
  const jobParts = [], log = [], parts = [];
  (notes || "").split("\n").map((l) => l.trim()).filter(Boolean).forEach((line) => {
    if (STAMP_RE.test(line)) log.push(line);
    else if (line.startsWith("PART | ")) parts.push(line.slice(7));
    else if (line.startsWith("JOB | ")) jobParts.push(line.slice(6).replace(/⏎/g, "\n"));
    else jobParts.push(line.replace(/⏎/g, "\n"));
  });
  return { job: jobParts.join("\n"), log, parts };
}
function joinNotes(job, logRaws, parts) {
  const j = (job || "").trim();
  return [...(j ? ["JOB | " + j.replace(/\n/g, "⏎")] : []), ...(parts || []).map((p) => "PART | " + p), ...logRaws].join("\n");
}
function jobNoteOf(notes) { return splitNotes(notes).job; }
function partsOf(notes) { return splitNotes(notes).parts; }
function parseLog(notes) {
  return splitNotes(notes).log.map((line) => { const m = line.match(STAMP_RE); return { stamp: m[1], text: m[2].replace(/⏎/g, "\n"), raw: line }; });
}
function logWithEdit(notes, idx, text) {
  const t = text.trim().replace(/\n/g, "⏎");
  const { job, parts } = splitNotes(notes);
  return joinNotes(job, parseLog(notes).map((e, j) => (j === idx ? `${e.stamp} | ${t}` : e.raw)), parts);
}
function logWithout(notes, idx) { return joinNotes(jobNoteOf(notes), parseLog(notes).filter((_, j) => j !== idx).map((e) => e.raw), partsOf(notes)); }
function logWithAdd(notes, text) { return joinNotes(jobNoteOf(notes), [...parseLog(notes).map((e) => e.raw), `${nowStamp()} | ${text.trim().replace(/\n/g, "⏎")}`], partsOf(notes)); }

// List of log entries (newest first). Click an entry (or its pencil) to edit it in place.
function LogEntries({ entries, onEdit, onDelete, fontSize }) {
  const [editing, setEditing] = useState(null); // { idx, text }
  const save = () => { if (editing && editing.text.trim()) onEdit(editing.idx, editing.text); setEditing(null); };
  return entries.map((e, i) => ({ e, i })).reverse().map(({ e, i }) => (
    editing && editing.idx === i ? (
      <div key={"edit" + i} data-testid="log-entry-editor" style={{ padding: "8px 10px", borderBottom: "1px solid #EFEFEA", background: "#FFF8E1" }}>
        {e.stamp && <div style={{ fontSize: 11, color: "#8B9086", fontWeight: 600 }}>{e.stamp}</div>}
        <textarea autoFocus rows={2} value={editing.text}
          onChange={(ev) => setEditing({ idx: i, text: ev.target.value.toUpperCase() })}
          onKeyDown={(ev) => { if (ev.key === "Escape") setEditing(null); if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); save(); } }}
          style={{ ...inputStyle, resize: "vertical", marginTop: 4 }} />
        <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
          <button type="button" data-testid="log-entry-save" onClick={save} className="rodi-btn" style={{ background: "#F6BD1B", border: "1px solid #D9D6CC", borderRadius: 7, padding: "4px 12px", fontWeight: 700, cursor: "pointer", fontSize: 12.5 }}>Save</button>
          <button type="button" onClick={() => setEditing(null)} style={{ background: "#fff", border: "1px solid #D8DAD1", borderRadius: 7, padding: "4px 12px", cursor: "pointer", fontSize: 12.5 }}>Cancel</button>
        </div>
      </div>
    ) : (
      <div key={e.raw + i} data-testid="log-entry" title="Click to edit" onClick={() => setEditing({ idx: i, text: e.text })}
        style={{ display: "flex", gap: 8, padding: "7px 10px", borderBottom: "1px solid #EFEFEA", alignItems: "flex-start", cursor: "pointer" }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          {e.stamp && <div style={{ fontSize: 11, color: "#8B9086", fontWeight: 600 }}>{e.stamp}</div>}
          <div style={{ fontSize: fontSize || 14, wordBreak: "break-word", whiteSpace: "pre-wrap" }}>{e.text}</div>
        </div>
        <button type="button" title="Edit entry" onClick={(ev) => { ev.stopPropagation(); setEditing({ idx: i, text: e.text }); }}
          style={{ border: "none", background: "transparent", color: "#33506B", cursor: "pointer", padding: 2 }}><Pencil size={13} /></button>
        <button type="button" title="Delete entry" onClick={(ev) => { ev.stopPropagation(); onDelete(i); }}
          style={{ border: "none", background: "transparent", color: "#C1483A", cursor: "pointer", padding: 2 }}><X size={13} /></button>
      </div>
    )
  ));
}

function nowStamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

  const [text, setText] = useState("");

    <div style={{ display: "flex", flexDirection: "column", gap: 8 }} data-testid="service-log">

// ---- Change history helpers ----
function recordLabel(table, r) {
  if (!r) return "";
  if (table === "orders") return `${r.brand || ""} ${r.type || ""}`.trim() + (r.customer ? ` (${r.customer})` : r.forStock ? " (STOCK)" : "");
  if (table === "services") return `${r.customer || "SERVICE"}${r.bike ? " — " + r.bike : ""}`;
  if (table === "accessories") return `${r.brand || ""} ${r.type || ""}`.trim() + (r.customer ? ` (${r.customer})` : "");
  if (table === "pricing") return `${r.brand || ""} ${r.model || ""}`.trim();
  if (table === "customers") return r.name || "";
  return "";
}
const TABLE_NOUN = { orders: "Order", services: "Service", accessories: "Accessory", pricing: "Price", customers: "Customer" };
function diffRecords(a, b, table) {
  const skip = { id: 1, createdAt: 1 };
  const changes = [];
  Object.keys(b).forEach((k) => {
    if (skip[k]) return;
    const x = a[k] == null ? "" : a[k], y = b[k] == null ? "" : b[k];
    if (String(x) === String(y)) return;
    if (k === "notes" && table === "services") {
      const x1 = splitNotes(a.notes), y1 = splitNotes(b.notes);
      if (x1.job !== y1.job) changes.push("service details updated");
      if (x1.parts.join("\n") !== y1.parts.join("\n")) changes.push("parts used updated");
      if (x1.log.join("\n") !== y1.log.join("\n")) changes.push("workshop log updated");
      return;
    }
    if (k === "notes" && a.notes !== undefined && String(b.notes || "").indexOf("|") > -1 && /\d{2}\/\d{2}\/\d{4} \d{2}:\d{2} \|/.test(String(b.notes))) {
      changes.push("workshop log updated");
      return;
    }
    const cut = (v) => { v = String(v); return v.length > 28 ? v.slice(0, 28) + "…" : (v === "" ? "—" : v); };
    changes.push(`${k}: ${cut(x)} → ${cut(y)}`);
  });
  if (changes.length > 4) return changes.slice(0, 4).join("; ") + `; +${changes.length - 4} more`;
  return changes.join("; ");
}

function Toast({ toast, onClose }) {
  useEffect(() => {
    if (!toast) return undefined;
    const t = setTimeout(onClose, 9000);
    return () => clearTimeout(t);
  }, [toast]);
  if (!toast) return null;
  return (
    <div data-testid="toast" className="rodi-toast" style={{
      position: "fixed", left: "50%", bottom: 22, transform: "translateX(-50%)", zIndex: 70,
      background: "#191B18", color: "#fff", borderRadius: 10, padding: "10px 14px", display: "flex", alignItems: "center", gap: 14,
      fontSize: 14, boxShadow: "0 10px 30px rgba(0,0,0,0.3)", maxWidth: "calc(100vw - 24px)",
    }}>
      <span>{toast.text}</span>
      {toast.undo && (
        <button type="button" onClick={() => { const u = toast.undo; onClose(); u(); }} style={{
          background: "#F6BD1B", color: "#191B18", border: "none", borderRadius: 6, padding: "5px 12px", fontWeight: 700, cursor: "pointer", fontSize: 13,
        }}>Undo</button>

// Header search across orders, services and accessories.
function GlobalSearch({ orders, services, accessories, onOpen }) {
  const [q, setQ] = useState("");
  const query = q.trim().toLowerCase();
  const results = useMemo(() => {
    if (!query) return null;
    const has = (arr) => arr.join(" ").toLowerCase().includes(query);
    return {
      orders: orders.filter((o) => !o.archived && has([o.brand, o.type, o.colour, o.customer, o.phone, o.tracking])).slice(0, 8),
      services: services.filter((x) => !x.archived && has([x.customer, x.phone, x.bike, x.serviceType, x.mechanic])).slice(0, 8),
      accessories: accessories.filter((a) => !a.archived && has([a.brand, a.type, a.colour, a.customer, a.phone, a.tracking])).slice(0, 8),
    };
  }, [query, orders, services, accessories]);
  const ctx = React.useContext(AppCtx);
  const customers = useMemo(() => {
    if (!query) return [];
    const seen = {};
    [...orders, ...services, ...accessories, ...(ctx.profiles || []).map((p) => ({ customer: p.name, phone: p.phone }))].forEach((r) => {
      const n = (r.customer || "").trim();
      if (n && n.toLowerCase().includes(query) && !seen[n.toLowerCase()]) seen[n.toLowerCase()] = { name: n, phone: r.phone || "" };
    });
    return Object.values(seen).slice(0, 5);
  }, [query, orders, services, accessories, ctx.profiles]);
  const total = results ? results.orders.length + results.services.length + results.accessories.length + customers.length : 0;
  const pick = (kind, rec) => { setQ(""); onOpen(kind, rec); };
  const row = (kind, rec, title, badge) => (
    <div key={kind + rec.id} className="rodi-row" onClick={() => pick(kind, rec)}
      style={{ display: "flex", justifyContent: "space-between", gap: 8, padding: "7px 10px", cursor: "pointer", fontSize: 13.5, borderBottom: "1px solid #EFEFEA", color: "#191B18" }}>
      <span style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{title}</span>
      {badge}
    </div>
  );
  const head = (t) => <div style={{ fontSize: 11, fontWeight: 700, color: "#8B9086", padding: "8px 10px 2px", textTransform: "uppercase" }}>{t}</div>;
  return (
    <div style={{ position: "relative", flex: "1 1 240px", maxWidth: 420, minWidth: 0 }}>
      <Search size={16} style={{ position: "absolute", left: 14, top: 15, color: "#8A8C82" }} />
      <input
        data-testid="global-search"
        placeholder="Search everything — customer, brand, bike, phone…"
        value={q}
        onChange={(e) => setQ(e.target.value)}
        style={{ ...inputStyle, paddingLeft: 38, height: 46, borderRadius: 12, border: "1px solid #E4E1D8", background: "#fff" }}
      />
      {results && (
        <div data-testid="global-search-results" style={{
          position: "absolute", top: 52, left: 0, right: 0, zIndex: 30, background: "#fff", border: "1px solid #D9D6CC",
          borderRadius: 10, maxHeight: 360, overflowY: "auto", boxShadow: "0 10px 30px rgba(0,0,0,0.25)",
        }}>
          {total === 0 && <div style={{ padding: 12, fontSize: 13.5, color: "#8B9086" }}>No matches for "{q}".</div>}
          {customers.length > 0 && head("Customers — full history")}
          {customers.map((c) => (
            <div key={"c" + c.name} className="rodi-row" data-testid="search-customer" onClick={() => { setQ(""); ctx.viewCustomer && ctx.viewCustomer(c); }}
              style={{ padding: "7px 10px", cursor: "pointer", fontSize: 13.5, borderBottom: "1px solid #EFEFEA", fontWeight: 600 }}>{c.name} <span style={{ color: "#3A7CA5", fontWeight: 500, fontSize: 12 }}>view history</span></div>
          ))}
          {results.orders.length > 0 && head("Orders")}
          {results.orders.map((o) => row("order", o, `${o.brand} ${o.type} — ${o.customer || "STOCK"}`, <StatusBadge label={o.status} color={ORDER_COLORS[o.status]} />))}
          {results.services.length > 0 && head("Services")}
          {results.services.map((x) => row("service", x, `${x.customer || "—"} — ${x.bike || ""}`, <StatusBadge label={x.status} color={SERVICE_COLORS[x.status]} />))}
          {results.accessories.length > 0 && head("Accessories")}
          {results.accessories.map((a) => row("accessory", a, `${a.brand} ${a.type} — ${a.customer || "STOCK"}`, <StatusBadge label={a.status} color={ACCESSORY_COLORS[a.status]} />))}
        </div>
      )}
    </div>
  );
}

const ORDER_QUICK_LABELS = { overdue: "Overdue orders", week: "Arriving this week", assembly: "Needs assembly", deliveries: "Deliveries this week", pickup: "Ready for pick-up" };
const SERVICE_QUICK_LABELS = { today: "Services today", week: "Services this week", overdue: "Overdue services", ready: "Ready for pick-up" };
function inNext7(dateStr) { const d = daysFromToday(dateStr); return d !== null && d >= 0 && d <= 7; }
function orderQuickMatch(o, quick) {
  if (!quick) return true;
  if (quick === "overdue") return isPastDate(o.eta) && o.status !== "Received";
  if (quick === "week") return inNext7(o.eta);
  if (quick === "assembly") return o.status === "Received" && o.assemblyStatus !== "Assembled";
  if (quick === "deliveries") return o.fulfillment === "Delivery" && inNext7(o.deliveryDate);
  if (quick === "pickup") return o.status === "Received" && o.fulfillment === "Pickup" && !!o.customer && o.assemblyStatus === "Assembled";
  return true;
}
function serviceQuickMatch(s, quick) {
  if (!quick) return true;
  if (quick === "today") return s.bookedDate === todayISO();
  if (quick === "week") return inNext7(s.bookedDate);
  if (quick === "overdue") return isPastDate(s.bookedDate) && s.status === "Booked";
  if (quick === "ready") return s.status === "Ready for Pickup";
  return true;
}

// ---- Shared context: lets deep components (forms, cards) open the history / job-card popups ----
const AppCtx = React.createContext({ records: { orders: [], services: [], accessories: [] }, profiles: [], viewCustomer: null, printJob: null });

const STALE = { partsDays: 5, progressDays: 7, readyDays: 7, overdueDays: 7, uncollectedDays: 3 };
function ageDays(dateStr) { const n = daysFromToday(dateStr); return n === null ? null : -n; }
// Jobs that have been sitting too long and probably need a chase-up.
function staleItems(orders, services, accessories) {
  const out = [];
  services.forEach((s) => {
    if (s.archived) return;
    const booked = ageDays(s.bookedDate);
    if (s.status === "Awaiting Parts" && booked !== null && booked >= STALE.partsDays) out.push({ kind: "service", rec: s, days: booked, reason: `Awaiting parts — booked ${booked} days ago` });
    else if (s.status === "In Progress" && booked !== null && booked >= STALE.progressDays) out.push({ kind: "service", rec: s, days: booked, reason: `In progress — booked ${booked} days ago` });
    else if (s.status === "Ready for Pickup") {
      const d = ageDays(s.pickupDate || s.bookedDate);
      if (d !== null && d >= STALE.readyDays) out.push({ kind: "service", rec: s, days: d, reason: s.pickupDate ? `Ready for pick-up — pick-up date ${d} days ago` : `Ready for pick-up — booked ${d} days ago` });
    }
  });
  orders.forEach((o) => {
    if (o.archived) return;
    if (o.status !== "Received") {
      const d = ageDays(o.eta);
      if (d !== null && d >= STALE.overdueDays) out.push({ kind: "order", rec: o, days: d, reason: `ETA ${d} days overdue` });
    } else if (o.fulfillment === "Pickup" && o.customer && o.assemblyStatus === "Assembled") {
      const d = ageDays(o.receivedDate);
      if (d !== null && d >= STALE.uncollectedDays) out.push({ kind: "order", rec: o, days: d, reason: `Pick-up date was ${d} days ago — not collected` });
    }
  });
  accessories.forEach((a) => {
    if (a.archived || a.status === "Received") return;
    const d = ageDays(a.eta);
    if (d !== null && d >= STALE.overdueDays) out.push({ kind: "accessory", rec: a, days: d, reason: `ETA ${d} days overdue` });
  });
  return out.sort((x, y) => y.days - x.days);
}

// Fields that are probably missing for this record's stage. Plain shop stock is skipped.
function missingDetails(kind, r) {
  const m = [];
  if (kind === "order") {
    if (r.forStock && !r.customer) return m;
    if (r.customer && !r.phone) m.push("phone");
    if (r.status === "In Transit" && !r.tracking) m.push("tracking");
    if (r.customer && r.fulfillment === "Delivery" && !r.deliveryDate) m.push("delivery date");
  } else if (kind === "service") {
    if (!r.phone) m.push("phone");
    if (!r.bookedDate) m.push("booked date");
    if (!r.serviceType) m.push("service type");
    if (r.status !== "Booked" && r.status !== "Completed" && !r.mechanic) m.push("mechanic");
  } else if (kind === "accessory") {
    if (r.forStock && !r.customer) return m;
    if (r.customer && !r.phone) m.push("phone");
    if (r.status === "In Transit" && !r.tracking) m.push("tracking");
  }
  return m;
}
// Amber "Missing" shown in an ETA cell when a tracking number exists but no ETA has been entered.
function EtaMissing() { return <span data-testid="eta-missing" style={{ fontSize: 10.5, color: "#D98B3D", fontWeight: 700 }}>Missing</span>; }
function MissingTag({ kind, rec }) {
  const m = rec.archived ? [] : missingDetails(kind, rec);
  if (!m.length) return null;
  return <div data-testid="missing-tag" style={{ fontSize: 10.5, color: "#D98B3D", fontWeight: 700, marginTop: 2 }}>Missing: {m.join(", ")}</div>;
}

// Possible duplicates of a NEW record (not shown when editing an existing one).
function findDuplicates(kind, form, records) {
  const list = kind === "service" ? records.services : kind === "accessory" ? records.accessories : records.orders;
  if (list.some((r) => r.id === form.id)) return [];
  const low = (v) => (v || "").toString().trim().toLowerCase();
  const name = low(form.customer);
  const phone = (form.phone || "").replace(/\D/g, "");
  const bike = low(form.bike);
  return list.filter((r) => {
    if (r.archived) return false;
    if (kind === "service" && r.status === "Completed") return false;
    const sameCust = !!name && low(r.customer) === name;
    const samePhone = phone.length >= 6 && (r.phone || "").replace(/\D/g, "") === phone;
    if (kind === "service") return sameCust || samePhone || (!!bike && low(r.bike) === bike);
    return (sameCust || samePhone) && !!low(form.type) && low(r.brand) === low(form.brand) && low(r.type) === low(form.type);
  }).slice(0, 3);
}
function CustomerExtras({ kind, form, onFillPhone }) {
  const ctx = React.useContext(AppCtx);
  const knownPhone = (() => {
    const nm = (form.customer || "").trim().toLowerCase();

    const rec = [...ctx.records.orders, ...ctx.records.services, ...ctx.records.accessories].find((r) => (r.customer || "").trim().toLowerCase() === nm && r.phone);
    return rec ? rec.phone : "";
  })();

          ⚠ Possible duplicate — {dups.map((d) => kind === "service"

            : `${d.customer || "—"} · ${d.brand} ${d.type} (${d.status})`).join("; ")}

  );

const lowTrim = (v) => (v || "").toString().trim().toLowerCase();
// One row per customer, built from the saved customer profiles plus every name found on orders, services and accessories.
const CUSTOMER_CATEGORIES = { Servicing: "#3A7CA5", Sales: "#4C9A6A", Warranty: "#7C5CBF" };
function CategoryBadges({ cats }) {
  if (!cats || !cats.length) return <span style={{ color: "#8B9086" }}>—</span>;
  return (
    <span style={{ display: "inline-flex", gap: 5, flexWrap: "wrap" }}>
      {cats.map((c) => (
        <span key={c} data-testid="customer-category" style={{ background: CUSTOMER_CATEGORIES[c], color: "#fff", borderRadius: 999, padding: "2px 9px", fontSize: 11.5, fontWeight: 700, whiteSpace: "nowrap" }}>{c}</span>
      ))}
    </span>
  );
}
function buildCustomers(records, profiles) {
  const map = {};
  const get = (name) => {
    const k = lowTrim(name);
    if (!k) return null;
    return map[k] || (map[k] = { key: k, name: name.trim(), phone: "", email: "", address: "", notes: "", profile: null, orders: [], services: [], accessories: [] });
  };
  profiles.forEach((p) => {
    const c = get(p.name || "");
    if (c) { c.profile = p; c.name = p.name.trim(); c.phone = p.phone || ""; c.email = p.email || ""; c.address = p.address || ""; c.notes = p.notes || ""; }
  });
  [["orders", records.orders], ["services", records.services], ["accessories", records.accessories]].forEach(([k, list]) => {
    list.forEach((r) => {
      const c = get(r.customer || "");
      if (!c) return;
      c[k].push(r);
      if (!c.phone && r.phone) c.phone = r.phone;
    });
  });
  return Object.values(map).map((c) => {
    const dates = [
      ...c.orders.map((o) => o.orderDate || o.eta), ...c.services.map((x) => x.bookedDate), ...c.accessories.map((a) => a.eta || a.date),
    ].filter(Boolean).sort();
    const open = c.orders.filter((o) => !o.archived).length + c.services.filter((x) => !x.archived && x.status !== "Completed").length + c.accessories.filter((a) => !a.archived).length;
    const cats = [];
    if (c.services.length) cats.push("Servicing");
    if (c.orders.some((o) => o.payment !== "Warranty") || c.accessories.some((a) => a.paymentOwing !== "Warranty")) cats.push("Sales");
    if (c.orders.some((o) => o.payment === "Warranty") || c.accessories.some((a) => a.paymentOwing === "Warranty")) cats.push("Warranty");
    return { ...c, categories: cats, lastDate: dates.length ? dates[dates.length - 1] : "", open, total: c.orders.length + c.services.length + c.accessories.length };
  });
}

    </div>
  );
  const sec = (label, n) => <h4 style={{ fontSize: 12.5, color: "#565C54", margin: "14px 0 4px 0", textTransform: "uppercase" }}>{label} ({n})</h4>;
  const total = ords.length + svcs.length + accs.length;
  return (
    <div data-testid="customer-history" onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 55, background: "rgba(25,27,24,0.55)", display: "flex", alignItems: "center", justifyContent: "center", padding: 16, overflowY: "auto" }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", border: "none", borderRadius: 22, padding: 18, width: "100%", maxWidth: 580, maxHeight: "90vh", overflowY: "auto", boxSizing: "border-box", boxShadow: "0 12px 40px rgba(0,0,0,0.3)" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
          <div style={{ minWidth: 0, flex: 1 }}>
            <h3 className="rodi-display" style={{ margin: 0, fontSize: 22, fontWeight: 600 }}>{isNew ? "New customer" : (customer.name || anyPhone || "Customer")}</h3>
            <div style={{ marginTop: 6 }}><CategoryBadges cats={(() => { const c = []; if (svcs.length) c.push("Servicing"); if (ords.some((o) => o.payment !== "Warranty") || accs.some((a) => a.paymentOwing !== "Warranty")) c.push("Sales"); if (ords.some((o) => o.payment === "Warranty") || accs.some((a) => a.paymentOwing === "Warranty")) c.push("Warranty"); return c; })()} /></div>
            <div style={{ fontSize: 13, color: "#565C54", marginTop: 4 }}>{total} record{total === 1 ? "" : "s"} in total ({ords.length} orders, {svcs.length} services, {accs.length} accessories)</div>
          </div>
          <IconBtn onClick={onClose} title="Close history"><X size={14} /></IconBtn>
        </div>

        <form data-testid="customer-details" onSubmit={save} style={{ marginTop: 12, background: "#FAFAF7", border: "1px solid #E3E4DD", borderRadius: 10, padding: 12, display: "flex", flexDirection: "column", gap: 10 }}>
          <div style={{ fontSize: 12.5, fontWeight: 700, color: "#565C54", textTransform: "uppercase" }}>Customer profile</div>
          <Field label="Name"><input data-testid={isNew ? "new-customer-name" : "cust-name"} autoFocus={isNew} placeholder="CUSTOMER NAME" style={{ ...inputStyle, fontWeight: 700 }} value={nameInput} onChange={(e) => { setSaved(false); setNameInput(e.target.value.toUpperCase()); }} /></Field>
          {!isNew && lowTrim(nameInput) !== lowTrim(customer.name) && lowTrim(nameInput) !== "" && (
            <div data-testid="rename-note" style={{ fontSize: 12.5, color: "#7A4A0C", background: "#FFF4E0", border: "1px solid #E8C48A", borderRadius: 8, padding: "6px 9px" }}>
              Saving will rename this customer on all their orders, services and accessories.
            </div>
          )}
          <div style={{ display: "grid", gridTemplateColumns: "minmax(0,1fr) minmax(0,1fr)", gap: 10 }}>
            <Field label="Phone"><input data-testid="cust-phone" style={inputStyle} value={details.phone} onChange={setD("phone")} /></Field>
            <Field label="Email"><input data-testid="cust-email" type="email" style={inputStyle} value={details.email} onChange={setD("email")} /></Field>
          </div>
          <Field label="Address"><input data-testid="cust-address" style={inputStyle} value={details.address} onChange={setD("address")} /></Field>
          <Field label="Customer notes"><textarea data-testid="cust-notes" style={{ ...inputStyle, minHeight: 56, resize: "vertical" }} value={details.notes} onChange={setD("notes")} placeholder="Preferences, bike details, anything useful…" /></Field>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button type="submit" data-testid="cust-save" className="rodi-btn" style={{ background: "#F6BD1B", color: "#191B18", border: "none", borderRadius: 8, padding: "8px 16px", fontWeight: 700, cursor: "pointer", fontSize: 13.5 }}>Save details</button>
            {saved && <span data-testid="cust-saved" style={{ fontSize: 13, color: "#4C9A6A", fontWeight: 700 }}>Saved ✓</span>}
          </div>
        </form>

        <div style={{ fontSize: 12, color: "#8B9086", marginTop: 10 }}>History includes archived records. Opening a record closes any form you have open.</div>
        {total === 0 && <p style={{ color: "#8B9086", fontSize: 14 }}>No orders or services for this customer yet.</p>}
        {ords.length > 0 && sec("Orders", ords.length)}
        {ords.map((o) => <Row key={o.id} kind="order" rec={o} title={`${o.brand} ${o.type}`.trim() + (o.colour ? ` — ${o.colour}` : "")} date={o.orderDate || o.eta} color={ORDER_COLORS[o.status]} />)}
        {svcs.length > 0 && sec("Services", svcs.length)}
        {svcs.map((x) => <Row key={x.id} kind="service" rec={x} title={`${x.bike || "Bike"} — ${x.serviceType || "service"}`} date={x.bookedDate} color={SERVICE_COLORS[x.status]} />)}
        {accs.length > 0 && sec("Accessories & parts", accs.length)}
        {accs.map((a) => <Row key={a.id} kind="accessory" rec={a} title={`${a.brand} ${a.type}`.trim()} date={a.eta} color={ACCESSORY_COLORS[a.status]} />)}
      </div>
    </div>
  );
}

function OrdersTab({ orders, onAdd, onEdit, onDelete, onDuplicate, onToggleArchive, onArchiveAllReceived, onAdvanceStatus, onSetStatus, preset }) {
  const [search, setSearch] = usePersisted("orders.search", "");
  const [quick, setQuick] = useState(preset ? preset.quick : null);
  useEffect(() => { setQuick(preset ? preset.quick : null); }, [preset && preset.key]);
  const [statusFilter, setStatusFilter] = usePersisted("orders.status", "All");
  const [stockOnly, setStockOnly] = usePersisted("orders.stock", false);
  const [needsAssembly, setNeedsAssembly] = usePersisted("orders.assembly", false);
  const [view, setView] = usePersisted("orders.view", "active");
  const [sortKey, setSortKey] = usePersisted("orders.sortKey", "status");
  const [sortDir, setSortDir] = usePersisted("orders.sortDir", "asc");
  // Arriving from a dashboard shortcut: start from a clean list so remembered filters don't hide it.
  useEffect(() => { if (preset) { setSearch(""); setStatusFilter("All"); setStockOnly(false); setNeedsAssembly(false); setView("active"); } }, [preset && preset.key]);
  const onSort = (key) => {
    if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(key); setSortDir("asc"); }
  };

  const archivedCount = useMemo(() => orders.filter((o) => o.archived).length, [orders]);
  const eligibleToArchive = useMemo(() => orders.filter((o) => !o.archived && o.status === "Received").length, [orders]);

  const filtered = useMemo(() => {
    return orders.filter((o) => {
      const matchesView = view === "archived" ? o.archived : !o.archived;
      const matchesStatus = statusFilter === "All" || o.status === statusFilter;
      const matchesStock = !stockOnly || o.forStock;
      const matchesAssembly = !needsAssembly || (o.assemblyStatus !== "Assembled" && o.status === "Received");
      const q = search.toLowerCase();
      const matchesSearch = !q || [o.brand, o.type, o.customer, o.tracking, o.colour].join(" ").toLowerCase().includes(q);
      return matchesView && matchesStatus && matchesStock && matchesAssembly && matchesSearch && orderQuickMatch(o, quick);
    });
  }, [orders, search, statusFilter, stockOnly, needsAssembly, view, quick]);

  const counts = useMemo(() => {
    const c = {};
    ORDER_STATUSES.forEach((s) => (c[s] = 0));
    orders.filter((o) => (view === "archived" ? o.archived : !o.archived)).forEach((o) => { c[o.status] = (c[o.status] || 0) + 1; });
    return c;
  }, [orders, view]);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", gap: 6, background: "#EFF0EC", padding: 4, borderRadius: 9 }}>
          <button onClick={() => setView("active")} className="rodi-btn" style={{
            border: "none", borderRadius: 6, padding: "6px 14px", cursor: "pointer", fontSize: 13, fontWeight: 600,
            background: view === "active" ? "#fff" : "transparent", color: view === "active" ? "#191B18" : "#8B9086",
          }}>Active</button>
          <button onClick={() => setView("archived")} className="rodi-btn" style={{
            border: "none", borderRadius: 6, padding: "6px 14px", cursor: "pointer", fontSize: 13, fontWeight: 600,
            background: view === "archived" ? "#fff" : "transparent", color: view === "archived" ? "#191B18" : "#8B9086",
          }}>Archived</button>
        </div>
        {view === "active" && eligibleToArchive > 0 && (
          <button onClick={onArchiveAllReceived} className="rodi-btn" style={{
            border: "1px solid #D8DAD1", background: "#fff", borderRadius: 8, padding: "7px 12px",
            display: "flex", alignItems: "center", gap: 6, cursor: "pointer", fontSize: 12.5, fontWeight: 600, color: "#565C54",
          }}>
            <Archive size={13} /> Archive {eligibleToArchive} received
          </button>
        )}
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16 }}>
        {ORDER_STATUSES.map((s) => (
          <button key={s} onClick={() => setStatusFilter(statusFilter === s ? "All" : s)}
            className="rodi-btn"
            style={{
              border: statusFilter === s ? `2px solid ${ORDER_COLORS[s]}` : "1px solid #D8DAD1",
              background: "#fff", borderRadius: 999, padding: "6px 12px", cursor: "pointer",
              fontSize: 13, display: "flex", alignItems: "center", gap: 7, fontWeight: 500,
            }}>
            <span style={{ width: 8, height: 8, borderRadius: 999, background: ORDER_COLORS[s] }} />
            {s} <span style={{ color: "#8B9086" }}>{counts[s]}</span>
          </button>
        ))}
        <button onClick={() => setStockOnly((v) => !v)} className="rodi-btn"
          style={{
            border: stockOnly ? "2px solid #2E8B77" : "1px solid #D8DAD1",
            background: "#fff", borderRadius: 999, padding: "6px 12px", cursor: "pointer",
            fontSize: 13, display: "flex", alignItems: "center", gap: 7, fontWeight: 500,
          }}>
          <span style={{ width: 8, height: 8, borderRadius: 999, background: "#2E8B77" }} />
          Shop stock only
        </button>
        <button onClick={() => setNeedsAssembly((v) => !v)} className="rodi-btn"
          style={{
            border: needsAssembly ? "2px solid #D98B3D" : "1px solid #D8DAD1",
            background: "#fff", borderRadius: 999, padding: "6px 12px", cursor: "pointer",
            fontSize: 13, display: "flex", alignItems: "center", gap: 7, fontWeight: 500,
          }}>
          <span style={{ width: 8, height: 8, borderRadius: 999, background: "#D98B3D" }} />
          Needs assembly
        </button>
        {quick && <QuickFilterChip label={ORDER_QUICK_LABELS[quick] || quick} onClear={() => setQuick(null)} />}
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: "1 1 220px" }}>
          <Search size={15} style={{ position: "absolute", left: 10, top: 11, color: "#8B9086" }} />
          <input placeholder="Search brand, model, customer, tracking…" value={search} onChange={(e) => setSearch(e.target.value)}
            style={{ ...inputStyle, width: "100%", paddingLeft: 32 }} />
        </div>
        <button onClick={onAdd} className="rodi-btn" style={{
          background: "#F6BD1B", color: "#191B18", border: "none", borderRadius: 8,
          padding: "0 16px", display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontWeight: 700, fontSize: 14,
        }}>
          <Plus size={16} /> Add order
        </button>
      </div>

      <div className="rodi-scrollbar" style={{ overflowX: "auto", border: "1px solid #E7E4DB", borderRadius: 18, boxShadow: "0 1px 2px rgba(20,20,15,0.04)", background: "#fff" }}>
        <table style={{ width: "100%", borderCollapse: "collapse" }}>
          <thead>
            <tr style={{ textAlign: "left", borderBottom: "1px solid #E3E4DD", background: "#FAFAF7" }}>
              {[
                { label: "Status", key: "status" }, { label: "Brand", key: "brand" }, { label: "Type", key: "type" },
                { label: "Colour", key: "colour" }, { label: "Qty", key: "qty" }, { label: "ETA", key: "eta" },
                { label: "Tracking", key: null }, { label: "Customer", key: "customer" }, { label: "Payment", key: "payment" },
                { label: "Fulfillment", key: "fulfillment" }, { label: "Delivery / Pick up", key: null }, { label: "", key: null },
              ].map((h) => (
                <SortableHeader key={h.label || "actions"} label={h.label} sortKey={h.key} activeKey={sortKey} dir={sortDir} onSort={onSort} width={h.label === "ETA" ? 150 : h.label === "Customer" ? 190 : h.label === "Status" ? 160 : undefined} />
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr><td colSpan={12} style={{ padding: 28, textAlign: "center", color: "#8B9086", fontSize: 14 }}>
                {view === "archived" ? "No archived orders yet." : "No orders match — add one to get started."}
              </td></tr>
            )}
            {sortRows(filtered, sortKey, sortDir, ORDER_STATUSES).map((o) => {
              const overdue = view === "active" && isPastDate(o.eta) && o.status !== "Received";
              return (
              <tr key={o.id} className="rodi-row" onClick={() => onEdit(o)} style={{
                borderBottom: "1px solid #EFEFEA", cursor: "pointer",
                background: overdue ? "#FBEAE8" : undefined,
              }}>
                <td style={{ padding: "8px 10px" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                    <StatusMenu label={o.status} color={ORDER_COLORS[o.status]} statuses={ORDER_STATUSES} onPick={(st) => onSetStatus(o.id, st)} />
                    {view === "active" && nextStatus(o.status, ORDER_STATUSES) && (
                      <button
                        onClick={(e) => { e.stopPropagation(); onAdvanceStatus(o.id); }}
                        title={`Advance to ${nextStatus(o.status, ORDER_STATUSES)}`}
                        className="rodi-btn rodi-advance"
                        style={{
                          border: "1px solid #D8DAD1", background: "#fff", borderRadius: 999,
                          width: 22, height: 22, display: "inline-flex", alignItems: "center", justifyContent: "center",
                          cursor: "pointer", color: "#33506B", flexShrink: 0,
                        }}
                      >
                        <ChevronRight size={13} />
                      </button>
                    )}
                  </div>
                </td>
                <td style={{ padding: "8px 10px", fontWeight: 600 }}>{o.brand}</td>
                <td style={{ padding: "8px 10px" }}>{o.type}</td>
                <td style={{ padding: "8px 10px" }}>{o.colour}</td>
                <td style={{ padding: "8px 10px" }}>{o.qty}</td>
                <td style={{ padding: "8px 10px", color: overdue ? "#C1483A" : undefined, fontWeight: overdue ? 700 : 400 }}>
                  <span style={{ whiteSpace: "nowrap" }}>{formatAURel(o.eta) || (o.tracking ? <EtaMissing /> : "—")}{overdue && " ⚠"}</span>
                </td>
                <td style={{ padding: "8px 10px", fontFamily: "monospace", fontSize: 13 }}><TrackingCell value={o.tracking} /></td>
                <td style={{ padding: "8px 14px 8px 10px", minWidth: 170 }}>
                  {o.customer
                    ? <div style={{ whiteSpace: "nowrap" }}>{o.customer}</div>
                    : o.forStock ? <div style={{ color: "#2E8B77", fontWeight: 800, fontSize: 13 }}>STOCK</div> : <div>—</div>}
                  <MissingTag kind="order" rec={o} />
                  <div style={{ display: "flex", gap: 8, marginTop: 2 }}>
                    {o.forStock && o.customer && <span style={{ fontSize: 10.5, color: "#2E8B77", fontWeight: 700 }}>STOCK</span>}
                    {o.notified && <span style={{ fontSize: 10.5, color: "#3A7CA5", fontWeight: 600 }}>Texted</span>}
                    {o.status === "Received" && (o.assemblyStatus === "Assembled"
                      ? <span style={{ fontSize: 10.5, color: "#4C9A6A", fontWeight: 600 }}>Assembled</span>
                      : <span style={{ fontSize: 10.5, color: "#D98B3D", fontWeight: 700 }}>For assembly</span>)}
                  </div>
                </td>
                {(() => {
                  const stockOnly = o.forStock && !o.customer;
                  return (
                    <>
                      <td style={{ padding: "8px 10px", fontSize: 13, fontWeight: 700, color: stockOnly ? undefined : PAYMENT_COLORS[o.payment] }}>
                        {stockOnly ? "—" : (o.payment || "—")}

                        {stockOnly ? "—" : (formatAURel(o.fulfillment === "Delivery" ? o.deliveryDate : o.receivedDate) || "—")}
                      </td>
                    </>
                  );
                })()}
                <td style={{ padding: "8px 10px" }}>
                  <div style={{ display: "flex", gap: 6 }}>
                    <IconBtn onClick={(e) => { e.stopPropagation(); onToggleArchive(o.id); }} title={o.archived ? "Restore" : "Archive"}>

                    </IconBtn>

                  </div>
                </td>
              </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function PricingTab({ pricing, onAdd, onEdit, onDelete }) {
  const [search, setSearch] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("All");
  const [sortKey, setSortKey] = useState("brand");
  const [sortDir, setSortDir] = useState("asc");
  const onSort = (key) => {
    if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(key); setSortDir("asc"); }
  };

  const filtered = useMemo(() => {
    const q = search.toLowerCase();
    return pricing.filter((p) => {
      const matchesSearch = !q || [p.brand, p.model].join(" ").toLowerCase().includes(q);
      const matchesCategory = categoryFilter === "All" || (p.category || "E-Bike") === categoryFilter;
      return matchesSearch && matchesCategory;
    });
  }, [pricing, search, categoryFilter]);

  const grouped = useMemo(() => {
    const groups = {};
    PRICING_CATEGORIES.forEach((c) => { groups[c] = []; });
    filtered.forEach((p) => {
      const cat = p.category || "E-Bike";
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(p);
    });
    return groups;
  }, [filtered]);

  const renderTable = (rows) => (
    <div className="rodi-scrollbar" style={{ overflowX: "auto", border: "1px solid #E7E4DB", borderRadius: 18, boxShadow: "0 1px 2px rgba(20,20,15,0.04)", background: "#fff" }}>
      <table style={{ width: "100%", borderCollapse: "collapse" }}>
        <thead>
          <tr style={{ textAlign: "left", borderBottom: "1px solid #E3E4DD", background: "#FAFAF7" }}>
            {[
              { label: "Brand", key: "brand" }, { label: "Model / type", key: "model" }, { label: "Cost", key: "cost" },
              { label: "RRP", key: "rrp" }, { label: "Margin", key: null }, { label: "Gross Profit", key: null },
              { label: "Notes", key: null }, { label: "", key: null },
            ].map((h) => (
              <SortableHeader key={h.label || "actions"} label={h.label} sortKey={h.key} activeKey={sortKey} dir={sortDir} onSort={onSort} width={h.label === "ETA" ? 150 : undefined} />
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.length === 0 && (
            <tr><td colSpan={8} style={{ padding: 28, textAlign: "center", color: "#8B9086", fontSize: 14 }}>No prices saved yet — add one for reference.</td></tr>
          )}
          {sortRows(rows, sortKey, sortDir).map((p) => {
            const margin = p.cost !== "" && p.rrp !== "" && Number(p.cost) > 0
              ? (((Number(p.rrp) - Number(p.cost)) / Number(p.rrp)) * 100).toFixed(0) + "%"
              : "—";
            const grossProfit = p.cost !== "" && p.rrp !== "" ? money(Number(p.rrp) - Number(p.cost)) : "—";
            return (
              <tr key={p.id} className="rodi-row" onClick={() => onEdit(p)} style={{ borderBottom: "1px solid #EFEFEA", cursor: "pointer" }}>
                <td style={{ padding: "8px 10px", fontWeight: 600 }}>{p.brand}</td>
                <td style={{ padding: "8px 10px" }}>{p.model}</td>
                <td style={{ padding: "8px 10px" }}>{money(p.cost)}</td>
                <td style={{ padding: "8px 10px", fontWeight: 600 }}>{money(p.rrp)}</td>
                <td style={{ padding: "8px 10px", color: "#4C9A6A", fontWeight: 600 }}>{margin}</td>
                <td style={{ padding: "8px 10px", color: "#4C9A6A", fontWeight: 600 }}>{grossProfit}</td>
                <td style={{ padding: "8px 10px", color: "#565C54", fontSize: 13 }}>{p.notes || "—"}</td>
                <td style={{ padding: "8px 10px" }}>
                  <div style={{ display: "flex", gap: 6 }}>
                    <IconBtn onClick={(e) => { e.stopPropagation(); onDelete(p.id); }} title="Delete" danger><Trash2 size={14} /></IconBtn>
                  </div>
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );

  return (
    <div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
        <button onClick={() => setCategoryFilter("All")} className="rodi-btn" style={{
          border: categoryFilter === "All" ? "1px solid #16171A" : "1px solid #D8DAD1",
          background: "#fff", borderRadius: 999, padding: "6px 14px", cursor: "pointer", fontSize: 13, fontWeight: 600,
        }}>All</button>
        {PRICING_CATEGORIES.map((c) => (
          <button key={c} onClick={() => setCategoryFilter(c)} className="rodi-btn" style={{
            border: categoryFilter === c ? "1px solid #16171A" : "1px solid #D8DAD1",
            background: "#fff", borderRadius: 999, padding: "6px 14px", cursor: "pointer", fontSize: 13, fontWeight: 600,
          }}>{c}</button>
        ))}
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 14, flexWrap: "wrap" }}>
        <div style={{ position: "relative", flex: "1 1 220px" }}>
          <Search size={15} style={{ position: "absolute", left: 10, top: 11, color: "#8B9086" }} />
          <input placeholder="Search brand or model…" value={search} onChange={(e) => setSearch(e.target.value)}
            style={{ ...inputStyle, width: "100%", paddingLeft: 32 }} />
        </div>
        <button onClick={onAdd} className="rodi-btn" style={{
          background: "#F6BD1B", color: "#191B18", border: "none", borderRadius: 8,
          padding: "0 16px", display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontWeight: 700, fontSize: 14,
        }}>
          <Plus size={16} /> Add price
        </button>
      </div>

      {PRICING_CATEGORIES
        .filter((cat) => categoryFilter === "All" || categoryFilter === cat)
        .map((cat) => (
          <div key={cat} style={{ marginBottom: 24 }}>
            <h3 className="rodi-display" style={{ fontSize: 21, margin: "0 0 12px 0" }}>
              {cat === "E-Moto" ? "E-MOTOS" : "E-BIKES"}
            </h3>
            {renderTable(grouped[cat] || [])}
          </div>
        ))}
    </div>
  );
}

              </td></tr>
            )}
            {sortRows(filtered, sortKey, sortDir, ACCESSORY_STATUSES).map((a) => {
              const overdue = view === "active" && isPastDate(a.eta) && a.status !== "Received";
              return (
              <tr key={a.id} className="rodi-row" onClick={() => onEdit(a)} style={{
                borderBottom: "1px solid #EFEFEA", cursor: "pointer",
                background: overdue ? "#FBEAE8" : undefined,
              }}>
                <td style={{ padding: "8px 10px" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                    <StatusMenu label={a.status} color={ACCESSORY_COLORS[a.status]} statuses={ACCESSORY_STATUSES} onPick={(st) => onSetStatus(a.id, st)} />
                    {view === "active" && nextStatus(a.status, ACCESSORY_STATUSES) && (
                      <button
                        onClick={(e) => { e.stopPropagation(); onAdvanceStatus(a.id); }}
                        title={`Advance to ${nextStatus(a.status, ACCESSORY_STATUSES)}`}
                        className="rodi-btn rodi-advance"
                        style={{
                          border: "1px solid #D8DAD1", background: "#fff", borderRadius: 999,
                          width: 22, height: 22, display: "inline-flex", alignItems: "center", justifyContent: "center",
                          cursor: "pointer", color: "#33506B", flexShrink: 0,
                        }}
                      >
                        <ChevronRight size={13} />
                      </button>
                    )}
                  </div>
                </td>
                <td style={{ padding: "8px 10px", fontWeight: 600 }}>{a.brand || "—"}</td>
                <td style={{ padding: "8px 10px" }}>{a.type || "—"}</td>
                <td style={{ padding: "8px 10px" }}>{a.colour || "—"}</td>
                <td style={{ padding: "8px 10px" }}>{a.qty}</td>
                <td style={{ padding: "8px 10px", color: overdue ? "#C1483A" : undefined, fontWeight: overdue ? 700 : 400 }}>
                  <span style={{ whiteSpace: "nowrap" }}>{formatAURel(a.eta) || (a.tracking ? <EtaMissing /> : "—")}{overdue && " ⚠"}</span>
                </td>
                <td style={{ padding: "8px 10px", fontFamily: "monospace", fontSize: 13 }}><TrackingCell value={a.tracking} /></td>
                <td style={{ padding: "8px 14px 8px 10px", minWidth: 170 }}>
                  {a.customer
                    ? <div style={{ whiteSpace: "nowrap" }}>{a.customer}</div>
                    : a.forStock ? <div style={{ color: "#2E8B77", fontWeight: 800, fontSize: 13 }}>STOCK</div> : "—"}
                  {a.forStock && a.customer && <div style={{ fontSize: 10.5, color: "#2E8B77", fontWeight: 700, marginTop: 2 }}>STOCK</div>}
                  <MissingTag kind="accessory" rec={a} />
                </td>
                <td style={{ padding: "8px 10px", fontSize: 13, fontWeight: 700, color: a.forStock && !a.customer ? undefined : PAYMENT_COLORS[a.paymentOwing] }}>
                  {a.forStock && !a.customer ? "—" : (a.paymentOwing || "—")}
                </td>
                <td style={{ padding: "8px 10px" }}>
                  <div style={{ display: "flex", gap: 6 }}>
                    <IconBtn onClick={(e) => { e.stopPropagation(); onDuplicate(a); }} title="Duplicate"><Copy size={14} /></IconBtn>
                    <IconBtn onClick={(e) => { e.stopPropagation(); onToggleArchive(a.id); }} title={a.archived ? "Restore" : "Archive"}>
                      {a.archived ? <RotateCcw size={14} /> : <Archive size={14} />}
                    </IconBtn>
                    <IconBtn onClick={(e) => { e.stopPropagation(); onDelete(a.id); }} title="Delete" danger><Trash2 size={14} /></IconBtn>
                  </div>
                </td>
              </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const WEEKDAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

function CalendarTab({ orders, services, accessories, calendarNotes, onAddNote, onDeleteNote, onEditNote, onOpenRecord, onScheduleDelivery, onScheduleService }) {
  const [month, setMonth] = useState(() => { const d = new Date(); d.setDate(1); return d; });
  const [selected, setSelected] = useState(null);
  const [noteText, setNoteText] = useState("");
  const [editingNote, setEditingNote] = useState(null); // { id, date, text }

  const activeOrders = useMemo(() => orders.filter((o) => !o.archived), [orders]);
  const activeServices = useMemo(() => services.filter((s) => !s.archived), [services]);
  const activeAccessories = useMemo(() => accessories.filter((a) => !a.archived), [accessories]);

  const [hiddenKinds, setHiddenKinds] = useState({});
  const allEventsByDate = useMemo(() => {
    const map = {};
    activeOrders.forEach((o) => {
      if (!o.eta) return;
      (map[o.eta] = map[o.eta] || []).push({ kind: "order", title: `${o.brand} ${o.type}`.trim(), color: "#33506B", ref: o });
    });
    activeServices.forEach((s) => {
      if (!s.bookedDate) return;
      (map[s.bookedDate] = map[s.bookedDate] || []).push({ kind: "service", title: `${s.customer || "SERVICE"}`, color: "#F6BD1B", ref: s });
    });
    activeAccessories.forEach((a) => {
      if (!a.eta) return;
      (map[a.eta] = map[a.eta] || []).push({ kind: "accessory", title: `${a.brand || "Order"}: ${a.type || "item"}`, color: "#7C5CBF", ref: a });
    });
    activeOrders.forEach((o) => {
      if (o.fulfillment !== "Delivery" || !o.deliveryDate) return;
      (map[o.deliveryDate] = map[o.deliveryDate] || []).push({ kind: "delivery", title: `DELIVER: ${o.customer || "CUSTOMER"}`, color: "#2E8B77", ref: o });
    });
    activeOrders.forEach((o) => {
      if (o.fulfillment !== "Pickup" || !o.receivedDate) return;
      (map[o.receivedDate] = map[o.receivedDate] || []).push({ kind: "pickup", title: `PICK UP: ${o.customer || "CUSTOMER"}`, color: "#B5651D", ref: o });
    });
    (calendarNotes || []).forEach((n) => {
      if (!n.date) return;
      (map[n.date] = map[n.date] || []).push({ kind: "note", title: n.text, color: "#C2417A", ref: n });
    });
    return map;
  }, [activeOrders, activeServices, activeAccessories, calendarNotes]);
  const eventsByDate = useMemo(() => {
    const out = {};
    Object.keys(allEventsByDate).forEach((d) => { out[d] = allEventsByDate[d].filter((ev) => !hiddenKinds[ev.kind]); });
    return out;
  }, [allEventsByDate, hiddenKinds]);
  const KIND_FILTERS = [
    { kind: "order", label: "Orders", color: "#33506B" }, { kind: "accessory", label: "Accessories", color: "#7C5CBF" },
    { kind: "service", label: "Services", color: "#F6BD1B" }, { kind: "delivery", label: "Deliveries", color: "#2E8B77" },
    { kind: "pickup", label: "Pick ups", color: "#B5651D" }, { kind: "note", label: "Notes", color: "#C2417A" },
  ];

  const cells = useMemo(() => {
    const year = month.getFullYear(), m = month.getMonth();
    const first = new Date(year, m, 1);
    const startOffset = (first.getDay() + 6) % 7; // Monday-first
    const daysInMonth = new Date(year, m + 1, 0).getDate();
    const arr = [];
    for (let i = 0; i < startOffset; i++) arr.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      arr.push(dateStr);
    }
    return arr;
  }, [month]);

  const monthLabel = month.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const todayStr = new Date().toISOString().slice(0, 10);

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <IconBtn onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() - 1, 1))} title="Previous"><ChevronLeft size={15} /></IconBtn>
          <h2 className="rodi-display" style={{ fontSize: 34, fontWeight: 600, margin: 0, minWidth: 190, letterSpacing: "-0.02em" }}>{monthLabel}</h2>
          <IconBtn onClick={() => setMonth(new Date(month.getFullYear(), month.getMonth() + 1, 1))} title="Next"><ChevronRight size={15} /></IconBtn>
        </div>
        <button
          onClick={() => { const ok = downloadICS(activeOrders, activeServices, activeAccessories, calendarNotes); if (!ok) alert("Add an ETA or booking date first — nothing to export yet."); }}
          className="rodi-btn"
          style={{ background: "#fff", border: "1px solid #D8DAD1", borderRadius: 8, padding: "9px 14px", display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontWeight: 600, fontSize: 13.5 }}
        >
          <Download size={15} /> Export to calendar (.ics)
        </button>
      </div>

      <div data-testid="calendar-filters" style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
        {KIND_FILTERS.map((f) => {
          const on = !hiddenKinds[f.kind];
          return (
            <button key={f.kind} onClick={() => setHiddenKinds((h) => ({ ...h, [f.kind]: on }))} className="rodi-btn" style={{
              border: on ? `2px solid ${f.color}` : "1px solid #D8DAD1", background: on ? "#fff" : "#F3F4EF", color: on ? "#191B18" : "#8B9086",
              borderRadius: 999, padding: "5px 12px", cursor: "pointer", fontSize: 12.5, fontWeight: 600, display: "flex", alignItems: "center", gap: 6,
              textDecoration: on ? "none" : "line-through",
            }}>
              <span style={{ width: 8, height: 8, borderRadius: 999, background: on ? f.color : "#C9CBC3" }} />
              {f.label}
            </button>
          );
        })}
      </div>

      <div className="rodi-cal-grid" style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 6, marginBottom: 6 }}>
        {WEEKDAYS.map((d) => (
          <div key={d} style={{ textAlign: "center", fontSize: 12, color: "#8B9086", fontWeight: 600, padding: "4px 0" }}>{d}</div>
        ))}
      </div>
      <div className="rodi-cal-grid" style={{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))", gap: 8 }}>
        {cells.map((dateStr, i) => {
          if (!dateStr) return <div key={i} />;
          const evs = eventsByDate[dateStr] || [];
          const dayNum = Number(dateStr.slice(-2));
          const isToday = dateStr === todayStr;
          return (
            <div
              key={dateStr}
              onClick={() => setSelected(dateStr)}
              className="rodi-cal-cell"
              style={{
                minHeight: 112, minWidth: 0, border: isToday ? "2px solid #F6BD1B" : "1px solid #E7E4DB",
                borderRadius: 14, background: selected === dateStr ? "#FBF5DA" : "#fff",
                padding: 9, cursor: "pointer", display: "flex", flexDirection: "column", gap: 5,
                overflowX: "hidden",
              }}
            >
              <span className="rodi-cal-num" style={{ alignSelf: "flex-start", minWidth: 26, height: 26, borderRadius: 13, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 5px", fontSize: 13, fontWeight: 700, background: isToday ? "#F6BD1B" : "transparent", color: "#16171A" }}>{dayNum}</span>
              {evs.map((ev, idx) => (
                <span key={idx} className="rodi-cal-chip" style={{
                  display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 600, background: tintOf(ev.color, "22"), color: "#16171A", borderRadius: 7,
                  padding: "4px 8px", overflow: "hidden", whiteSpace: "nowrap",
                }}><span style={{ flex: "0 0 7px", height: 7, borderRadius: 999, background: ev.color }} /><span className="rodi-cal-chiptext" style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{ev.title}</span></span>
              ))}
            </div>
          );
        })}
      </div>

      {selected && (
        <div
          data-testid="day-modal"
          onClick={() => setSelected(null)}
          style={{
            position: "fixed", inset: 0, zIndex: 40, background: "rgba(25,27,24,0.55)",
            display: "flex", alignItems: "center", justifyContent: "center", padding: 16, overflowY: "auto",
          }}
        >
        <div
          onClick={(e) => e.stopPropagation()}
          style={{
            background: "#fff", border: "none", borderRadius: 22, padding: 18,
            width: "100%", maxWidth: 560, maxHeight: "90vh", overflowY: "auto", boxSizing: "border-box",
            boxShadow: "0 12px 40px rgba(0,0,0,0.3)",
          }}
        >
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <h3 className="rodi-display" style={{ margin: 0, fontSize: 19, fontWeight: 600 }}>{formatAU(selected)}</h3>
            <IconBtn onClick={() => setSelected(null)} title="Close"><X size={14} /></IconBtn>
          </div>
          {(eventsByDate[selected] || []).length === 0 && <p style={{ color: "#8B9086", fontSize: 14 }}>Nothing scheduled this day.</p>}
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
            {(eventsByDate[selected] || []).map((ev, idx) => {
              if (ev.kind === "note" && editingNote && editingNote.id === ev.ref.id) {
                return (
                  <form
                    key={idx}
                    onSubmit={(e) => {
                      e.preventDefault();
                      if (!editingNote.text.trim()) return;
                      onEditNote(editingNote.id, editingNote.date, editingNote.text.trim());
                      setEditingNote(null);
                    }}
                    style={{ display: "flex", gap: 8, alignItems: "center", background: "#FFF8E1", padding: 8, borderRadius: 8 }}
                  >
                    <input type="date" value={editingNote.date} onChange={(e) => setEditingNote({ ...editingNote, date: e.target.value })} style={{ ...inputStyle, width: 150 }} />
                    <input value={editingNote.text} onChange={(e) => setEditingNote({ ...editingNote, text: e.target.value.toUpperCase() })} style={{ ...inputStyle, flex: 1 }} />
                    <button type="submit" className="rodi-btn" style={{ background: "#F6BD1B", color: "#191B18", border: "none", borderRadius: 8, padding: "8px 12px", cursor: "pointer", fontWeight: 700, fontSize: 13 }}>Save</button>
                    <button type="button" onClick={() => setEditingNote(null)} style={{ background: "#fff", border: "1px solid #D8DAD1", borderRadius: 8, padding: "8px 12px", cursor: "pointer", fontSize: 13 }}>Cancel</button>
                  </form>
                );
              }
              const clickable = ev.kind === "order" || ev.kind === "service" || ev.kind === "accessory" || ev.kind === "delivery" || ev.kind === "pickup";
              const KIND = { order: ["ORDER ARRIVING", "#33506B"], service: ["SERVICE", "#C99A0A"], accessory: ["ACCESSORY ARRIVING", "#7C5CBF"], delivery: ["DELIVERY", "#2E8B77"], pickup: ["PICK UP", "#B5651D"], note: ["NOTE", "#C2417A"] };
              const [kindLabel, kindColor] = KIND[ev.kind] || ["EVENT", "#565C54"];
              const detail = ev.kind === "order" ? `for ${ev.ref.customer || "—"}`
                : ev.kind === "service" ? ev.ref.serviceType || ""
                : ev.kind === "note" ? "click to edit"
                : ev.kind === "delivery" || ev.kind === "pickup" ? `${ev.ref.brand || ""} ${ev.ref.type || ""}`.trim()
                : `qty ${ev.ref.qty || "—"} for ${ev.ref.customer || "—"}`;
              return (
                <div
                  key={idx}
                  data-testid="day-event"
                  onClick={() => { if (clickable) onOpenRecord(ev.kind === "delivery" || ev.kind === "pickup" ? "order" : ev.kind, ev.ref); }}
                  style={{
                    display: "flex", gap: 10, alignItems: "center", fontSize: 14,
                    cursor: clickable ? "pointer" : "default",
                    padding: "9px 12px", border: "1px solid #E3E4DD", borderLeft: `6px solid ${kindColor}`,
                    borderRadius: 8, background: "#FAFAF7",
                  }}
                  className={clickable ? "rodi-row" : undefined}
                >
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 10.5, fontWeight: 800, letterSpacing: "0.06em", color: kindColor }}>{kindLabel}</div>
                    <div
                      style={{ fontWeight: 700, cursor: ev.kind === "note" ? "pointer" : undefined, wordBreak: "break-word" }}
                      onClick={(e) => { if (ev.kind === "note") { e.stopPropagation(); setEditingNote({ id: ev.ref.id, date: ev.ref.date, text: ev.ref.text }); } }}
                    >{ev.title}</div>
                    {detail && <div style={{ color: "#565C54", fontSize: 12.5 }}>{detail}</div>}
                  </div>
                  {ev.kind === "note" && (
                    <div style={{ marginLeft: "auto", display: "flex", gap: 4 }}>
                      <IconBtn onClick={() => setEditingNote({ id: ev.ref.id, date: ev.ref.date, text: ev.ref.text })} title="Edit note"><Pencil size={13} /></IconBtn>
                      <IconBtn onClick={() => onDeleteNote(ev.ref.id)} title="Delete note" danger><Trash2 size={13} /></IconBtn>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
            <button
              type="button"
              onClick={() => onScheduleDelivery(selected)}
              className="rodi-btn"
              style={{
                background: "#2E8B77", color: "#fff", border: "1px solid #D9D6CC", borderRadius: 8,
                padding: "8px 14px", display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontWeight: 700, fontSize: 13,
              }}
            >
              <Truck size={14} /> Schedule delivery
            </button>
            <button
              type="button"
              onClick={() => onScheduleService(selected)}
              className="rodi-btn"
              style={{
                background: "#F6BD1B", color: "#191B18", border: "none", borderRadius: 8,
                padding: "8px 14px", display: "flex", alignItems: "center", gap: 7, cursor: "pointer", fontWeight: 700, fontSize: 13,
              }}
            >
              <Wrench size={14} /> Schedule service
            </button>
          </div>

          <form
            onSubmit={(e) => {
              e.preventDefault();
              if (!noteText.trim()) return;
              onAddNote(selected, noteText.trim());
              setNoteText("");
            }}
            style={{ display: "flex", gap: 8 }}
          >
            <input
              value={noteText}
              onChange={(e) => setNoteText(e.target.value.toUpperCase())}
              placeholder="e.g. DECLAN P/UP ORDER — check assembled"
              style={{ ...inputStyle, flex: 1 }}
            />
            <button type="submit" className="rodi-btn" style={{
              background: "#F6BD1B", color: "#191B18", border: "none", borderRadius: 8,
              padding: "0 16px", cursor: "pointer", fontWeight: 700, fontSize: 13.5,
            }}>
              Add note
            </button>
          </form>
        </div>
        </div>
      )}
    </div>
  );
}

function StatCard({ icon, label, value, color }) {
  return (
    <div style={{
      background: "#fff", border: "1px solid #E7E4DB", borderRadius: 18, boxShadow: "0 1px 2px rgba(20,20,15,0.04)", padding: "18px 20px",
      display: "flex", flexDirection: "column", gap: 12, height: "100%",
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
        <span style={{ width: 9, height: 9, borderRadius: 999, background: color, flexShrink: 0 }} />
        <span style={{ fontSize: 13, fontWeight: 600, color: "#6B6E66" }}>{label}</span>
      </div>
      <div className="rodi-display" style={{ fontSize: 42, lineHeight: 1, letterSpacing: "-0.03em", fontVariantNumeric: "tabular-nums" }}>{value}</div>
    </div>
